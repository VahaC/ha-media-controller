refresh:
  name: Refresh controller data
  description: Refresh queue and playlist data immediately.
  fields:
    entry_id:
      name: Controller
      description: Optional controller entry. Omit to refresh every loaded controller.
      selector:
        config_entry:
          integration: vahac_media_controller

play_queue_item:
  name: Play queue item
  description: Start a Music Assistant queue item without replacing the queue.
  fields:
    entity_id:
      name: Music Assistant player
      required: true
      selector:
        entity:
          domain: media_player
          integration: music_assistant
    queue_item_id:
      name: Queue item ID
      required: true
      example: "4f44d4fb2b8f4a23a1f6175e"
      selector:
        text:

