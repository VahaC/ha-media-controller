# Media Controller — paired ESP32-S3 firmware
#
# The same device and the same interface as media-controller.yaml, configured
# from Home Assistant instead of from this file. Nothing here names a Home
# Assistant entity: the device advertises itself over mDNS, shows a six-digit
# code, and Home Assistant answers with a token and one entity ID. Everything
# else — which player, which queue sensor, which lamp is behind button 1 —
# arrives at runtime in the config sensor and is kept in flash.
#
# Changing a room control is therefore a Home Assistant action, not a reflash.
#
# It talks to Home Assistant over the REST API, polling once a second, exactly
# as the T560 panel does; see docs/CONTRACT.md. The ESPHome native API is still
# here, but only for what it was always good for: adoption, logs, over-the-air
# updates, and the theme and diagnostic entities. It carries no Home Assistant
# state any more.
#
# The interface is shared with the classic firmware and lives in
# media-controller-ui.yaml. This file supplies the other half of the seam its
# header describes.

substitutions:
  device_name: media-controller
  friendly_name: Media Controller

  # The only address in this file. Home Assistant advertises itself over mDNS,
  # but ESPHome can publish records and not browse for them, so unlike the
  # tablet this device cannot discover the URL for itself. Use an IP address
  # if .local names are unreliable on your network.
  ha_url: "http://homeassistant.local:8123"

  firmware_version: "0.3.0"

  # The version of docs/CONTRACT.md this firmware implements. firmware_version
  # says when this build shipped; this says what it understands, and it is the
  # only number worth comparing with the other side. The device sends it in
  # every status report and reads the integration's own out of the config
  # sensor, so each half can tell that the other is behind. Raise it in the
  # same change that raises the number in that document; it is not a knob to
  # turn per device.
  contract_version: "7"
  asset_base_url: "https://raw.githubusercontent.com/VahaC/ha-media-controller/main/firmware/assets"

  # Where the room-grid external component is fetched from. It is a
  # substitution for the same reason asset_base_url is one: a device pulls
  # this file by raw URL and has no checkout to point at, while a working
  # tree and CI have one and must validate the component in front of them
  # rather than the one already on main. Override it with a path relative to
  # the directory of the configuration being validated, for example
  # `../components`.
  grid_component_source: "github://VahaC/ha-media-controller@main"

# The interface — display, touchscreen, LVGL pages, theme — is shared with
# media-controller.yaml and lives next to this file. See its header for the
# names the two halves agree on.
packages:
  ui: !include media-controller-ui.yaml

# The room grid and the editor this device serves for arranging it. It is an
# external component because two parts of it cannot be written as lambdas: a
# POD written to NVS through make_preference, and an AsyncWebHandler on
# web_server_base. It knows nothing about Home Assistant — everything that
# reaches it is installed into the component from this file, in on_boot
# below, and lands in a cmd_ script here. See components/media_controller_grid/.
external_components:
  - source: ${grid_component_source}
    components: [media_controller_grid]

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: media_controller.esp32s3_paired
    version: "${firmware_version}"
  on_boot:
    # -- Runs after the interface package's own on_boot, which builds the
    # -- theme and shows a home layout. An unpaired device is sent to the
    # -- pairing page from here instead. --
    priority: -200
    then:
      - lambda: id(auth_header) = "Bearer " + id(ha_token);
      # -- The four things the grid component needs from this half of the
      # -- firmware. They are installed rather than compiled in so that the
      # -- component holds no URL, no token and no entity ID: the same seam
      # -- media-controller-ui.yaml describes, for the same reason. --
      - lambda: |-
          id(room_page_index) = (int) id(page_room_grid)->index;
          id(room_grid)->set_redraw_listener([]() {
            id(rebuild_room_grid)->execute();
          });
          id(room_grid)->set_backup_writer([](std::string document) {
            id(backup_room_layout)->execute(document);
          });
          id(room_grid)->set_restore_requester([]() {
            id(restore_room_layout)->execute();
          });
          id(room_grid)->set_skin_writer([](std::string skin) {
            id(cmd_skin_select)->execute(skin);
          });
          id(room_grid)->set_skin(id(screen_style).current_option());
      - script.execute: rebuild_room_grid
      - script.execute: show_start_page

api:

# -------------------- THE LAYOUT EDITOR --------------------
# One TCP listen socket and no UI on top of it: the only thing served here is
# the layout editor, and web_server would add an entity dashboard nobody asked
# for. On ESP32 web_server_base autoloads web_server_idf.
#
# There is no authentication, deliberately, and the eight routes are narrow
# enough that this is a decision rather than an oversight. See the header of
# components/media_controller_grid/media_controller_grid.h, and the warning in
# docs/ESP32_PAIRED_CONTROLLER.md about not exposing this port outside the
# house.
web_server_base:

media_controller_grid:
  id: room_grid
  port: 80
  # The layouts the interface draws, in the spelling docs/CONTRACT.md uses.
  # The editor offers exactly these and the component refuses anything else
  # before it is passed on, so this route cannot write an arbitrary value into
  # an arbitrary entity.
  skins:
    - classic
    - minimal_ring
    - cover_card

# -------------------- DISCOVERY --------------------
# What makes Home Assistant offer to add this device. The integration reads
# these three records in async_step_zeroconf. The service type is shared with
# the T560 panel on purpose: the profile travels as a record rather than as a
# service type of its own.
#
# Port 0: this device serves nothing. The record exists to be discovered.
mdns:
  services:
    - service: _media-controller
      protocol: _tcp
      port: 0
      txt:
        panel_id: !lambda return get_mac_address();
        profile: esp32_s3_panel
        name: ${friendly_name}

sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    internal: true
    update_interval: 60s

  - platform: internal_temperature
    id: esp32_temperature
    internal: true
    update_interval: 60s

  # -------------------- PLAYER STATE --------------------
  # The interface reads thirteen ids and does not care where they came from.
  # In the classic firmware they are `platform: homeassistant` and Home
  # Assistant pushes them; here the poll cycle publishes them.
  #
  # Every one is published only when it actually changed, because a template
  # entity fires on_value on every publish and a once-a-second poll would
  # otherwise redraw the whole screen once a second.
  - platform: template
    id: volume_level
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_volume

  - platform: template
    id: media_duration
    internal: true
    update_interval: never

  - platform: template
    id: media_position
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_progress

text_sensor:
  - platform: template
    id: media_title
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_title
        # The integration refreshes the queue three seconds after a title
        # change. Fetch after that debounce so the device does not read stale
        # data.
        - delay: 4s
        - script.execute: refresh_queue

  - platform: template
    id: media_artist
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_artist

  # -- Album art path, relative to ha_url. "None" when there is none. --
  - platform: template
    id: entity_picture
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            if (x == "None" || x.empty()) {
              ESP_LOGD("img", "No album art available, skipping");
              return;
            }
            std::string full_url = "${ha_url}" + x;
            ESP_LOGD("img", "Loading art: %s", full_url.c_str());
            id(album_art).set_url(full_url.c_str());
            id(album_art_small).set_url(full_url.c_str());
        - script.execute: ui_load_album_art

  - platform: template
    id: player_state
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: id(screen_last_active_ms) = millis();
        - script.execute: ui_sync_play_state

  - platform: template
    id: shuffle_state
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_shuffle

  - platform: template
    id: repeat_state
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_repeat

# -------------------- SWITCHES PAGE STATE --------------------
# One per room slot, in slot order. Which entity feeds each is decided at
# runtime, so a slot may hold a light or a switch without a reflash.
binary_sensor:
  - platform: template
    id: light1_state
    internal: true
    on_state:
      then:
        - script.execute: apply_light1_style

  - platform: template
    id: light2_state
    internal: true
    on_state:
      then:
        - script.execute: apply_light2_style

  - platform: template
    id: fan_switch_state
    internal: true
    on_state:
      then:
        - script.execute: apply_fan_style

  - platform: template
    id: ac_switch_state
    internal: true
    on_state:
      then:
        - script.execute: apply_ac_style

globals:
  # ════════════════════════════════════════════════════════════
  # WHAT HOME ASSISTANT TOLD THIS DEVICE
  # ════════════════════════════════════════════════════════════
  # All of it survives a reboot, so a device that starts while Home Assistant
  # is down still knows what to ask for once it comes back, and a restart
  # never sends anybody back to the pairing screen.

  # -- The access token, minted by the integration and handed over once. A
  # -- Home Assistant long-lived token is an HS256 JWT of about 180
  # -- characters; 254 is the most a restoring string global can hold. --
  - id: ha_token
    type: std::string
    restore_value: true
    max_restore_data_length: 254

  # -- "Bearer " + the token. A request header is rendered as const char *, so
  # -- the value has to outlive the call: a temporary built inside the header
  # -- lambda would dangle. --
  - id: auth_header
    type: std::string
    restore_value: false

  # -- The one entity Home Assistant names during pairing. Everything else is
  # -- read out of it. --
  - id: config_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  - id: player_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  - id: queue_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  - id: playlists_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  # -- The one entity in the payload this device *writes*: the Player Skin
  # -- select on its own Home Assistant device. Home Assistant stays the owner
  # -- of the value; the on-device picker writes here and the new skin arrives
  # -- back the ordinary way, in settings.player_skin. Absent when the
  # -- integration named none, which greys the picker in the editor. --
  - id: skin_select_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  # -- The room registry itself is **not** a global. Sixty-four elements with
  # -- Cyrillic names are far past the 254 bytes a restoring string global can
  # -- hold, and the grid that arranges them is a POD in its own NVS blob; see
  # -- components/media_controller_grid/. What survives a reboot there is the
  # -- arrangement, which is the user's own work. The registry is Home
  # -- Assistant's and comes back with the first poll.

  # -- The body of one weather.get_forecasts request, built the same way:
  # -- the poll asks the component whether a weather card is drawn, and only
  # -- then sends it. --
  - id: pending_forecast_body
    type: std::string
    restore_value: false

  # -- Set while a long press is sweeping a card's brightness, so the release
  # -- that ends it does not also toggle the light. The four fixed buttons of
  # -- the interface keep one of these per button; the grid has one, because
  # -- only one card can be under a finger. --
  - id: room_card_long_active
    type: bool
    restore_value: false
    initial_value: "false"

  # -- Whether that long press actually moved a thermostat's setpoint, which
  # -- is a different question: a press held just past the long-press
  # -- threshold and released before the first repeat has swept nothing, and
  # -- the release must not then write the thermostat's own value back to it.
  # -- One is enough for the same reason as above. --
  - id: room_card_swept
    type: bool
    restore_value: false
    initial_value: "false"

  # -- Checksum of the layout. Equal values mean there is nothing to lay out
  # -- again, which is what keeps a once-a-second poll cheap. --
  - id: config_revision
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The parts of the last config payload the actions after the parse still
  # -- need. Held rather than re-extracted: the payload is scanned once, and
  # -- nothing downstream has to reach back into the response it came from. --
  - id: pending_attributes
    type: std::string
    restore_value: false

  - id: pending_commands
    type: std::string
    restore_value: false

  - id: layout_changed
    type: bool
    restore_value: false
    initial_value: "false"

  # ════════════════════════════════════════════════════════════
  # PAIRING
  # ════════════════════════════════════════════════════════════
  # The code is generated once and kept, so a watchdog reboot does not change
  # the digits somebody is halfway through typing.
  - id: pairing_code
    type: std::string
    restore_value: true
    max_restore_data_length: 16

  - id: pairing_hint
    type: std::string
    restore_value: false

  # ════════════════════════════════════════════════════════════
  # COMMAND WATERMARKS
  # ════════════════════════════════════════════════════════════
  # A command is applied only when its timestamp is newer than the last one
  # acted on. They are restored for the reason the contract spells out: a
  # restart command that was not remembered would run again on every boot.
  - id: last_display_at
    type: double
    restore_value: true
    initial_value: "0"

  - id: last_brightness_at
    type: double
    restore_value: true
    initial_value: "0"

  - id: last_restart_at
    type: double
    restore_value: true
    initial_value: "0"

  - id: last_page_at
    type: double
    restore_value: true
    initial_value: "0"

  # -- What the parse decided, for the actions that follow it. A lambda cannot
  # -- turn a backlight on; only an action can. --
  - id: want_display
    type: int
    restore_value: false
    initial_value: "0"

  - id: want_brightness
    type: int
    restore_value: false
    initial_value: "-1"

  - id: want_restart
    type: bool
    restore_value: false
    initial_value: "false"

  - id: want_page
    type: std::string
    restore_value: false

  # ════════════════════════════════════════════════════════════
  # POLL BOOKKEEPING
  # ════════════════════════════════════════════════════════════
  # None of this is restored: it changes constantly, and a restoring global
  # writes to flash whenever it does.
  - id: poll_interval_ms
    type: uint32_t
    restore_value: false
    initial_value: "1000"

  - id: playlist_poll_interval_ms
    type: uint32_t
    restore_value: false
    initial_value: "60000"

  - id: last_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The skin the last payload named, handed to the interface after the
  # -- payload has been parsed rather than in the middle of parsing it. --
  - id: pending_skin
    type: std::string
    restore_value: false
  - id: last_playlist_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The forecast moves slowly: one request every half hour, on top of the
  # -- first one as soon as a weather card is drawn. An http_request blocks
  # -- the main loop, so this never runs oftener no matter how many weather
  # -- blocks a page holds. --
  - id: last_forecast_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_pairing_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The last answer the provisioning endpoint gave. Two jobs: it keeps the
  # -- log to one line per change instead of one per poll, and it decides how
  # -- often to ask again. --
  - id: last_pairing_status
    type: int
    restore_value: false
    initial_value: "0"

  - id: last_report_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_report_page
    type: std::string
    restore_value: false
    initial_value: '""'

  # -- The position Home Assistant last reported, as opposed to the one the
  # -- interface advances locally every second. Home Assistant's number does
  # -- not move on its own, so publishing it back on every poll would undo
  # -- that advance. Only a change on their side is a re-sync. --
  - id: last_polled_position
    type: float
    restore_value: false
    initial_value: "-1"

  # ════════════════════════════════════════════════════════════
  # PARSERS
  # ════════════════════════════════════════════════════════════
  # There is no JSON library on the device. These walk the payload by hand, in
  # the same style as the playlist and slot-label parsers in the interface
  # package, and they are deliberately forgiving: a field that is missing or
  # malformed reads as empty rather than as an error.
  #
  # Each one is self-contained. A global's initial_value is emitted as a raw
  # C++ expression and is not a lambda ESPHome rewrites, so `id(...)` does not
  # work in here and one parser cannot call another.

  # -- One field of an object, as text. A quoted value is unescaped; a bare
  # -- value (number, true, false, null) comes back as it was written, which
  # -- is what lets the same function read both "repeat":"all" and
  # -- "shuffle":false. --
  - id: json_field
    type: std::string (*)(const std::string &, const char *)
    restore_value: no
    initial_value: |-
      [](const std::string &body, const char *key) -> std::string {
        std::string needle = std::string("\"") + key + "\"";
        size_t p = body.find(needle);
        if (p == std::string::npos) return std::string();
        p = body.find(':', p + needle.size());
        if (p == std::string::npos) return std::string();
        p++;
        while (p < body.size() && isspace((unsigned char) body[p])) p++;
        if (p >= body.size()) return std::string();

        if (body[p] != '"') {
          size_t e = p;
          while (e < body.size() && body[e] != ',' &&
                 body[e] != '}' && body[e] != ']') e++;
          std::string raw = body.substr(p, e - p);
          while (!raw.empty() &&
                 isspace((unsigned char) raw[raw.size() - 1])) {
            raw.erase(raw.size() - 1);
          }
          return raw;
        }

        p++;
        std::string out;
        while (p < body.size()) {
          char c = body[p];
          if (c == '\\' && p + 1 < body.size()) {
            char n = body[p + 1];
            if (n == 'n') out += '\n';
            else if (n == 't') out += '\t';
            else if (n == 'u') { p += 6; continue; }
            else out += n;
            p += 2;
            continue;
          }
          if (c == '"') break;
          out += c;
          p++;
        }
        return out;
      }

  # -- One nested object, so a field can be looked up inside it rather than
  # -- anywhere in the payload. Reading "state" out of a whole media player
  # -- response would be a coin toss; reading it out of the top level and
  # -- "media_title" out of "attributes" is not. --
  - id: json_object
    type: std::string (*)(const std::string &, const char *)
    restore_value: no
    initial_value: |-
      [](const std::string &body, const char *key) -> std::string {
        std::string needle = std::string("\"") + key + "\"";
        size_t p = body.find(needle);
        if (p == std::string::npos) return std::string();
        p = body.find('{', p + needle.size());
        if (p == std::string::npos) return std::string();

        int depth = 0;
        for (size_t i = p; i < body.size(); i++) {
          char c = body[i];
          if (c == '"') {
            i++;
            while (i < body.size()) {
              if (body[i] == '\\') i++;
              else if (body[i] == '"') break;
              i++;
            }
            continue;
          }
          if (c == '{') depth++;
          else if (c == '}') {
            depth--;
            if (depth == 0) return body.substr(p, i - p + 1);
          }
        }
        return std::string();
      }

script:
  # ════════════════════════════════════════════════════════════
  # COMMANDS
  # ════════════════════════════════════════════════════════════
  # The other half of the seam described in media-controller-ui.yaml. Same
  # names and same parameters as the classic firmware; a POST to the REST API
  # rather than a native API call, and the entity comes from flash rather than
  # from a substitution.

  - id: ha_action
    mode: parallel
    max_runs: 6
    parameters:
      domain: string
      service: string
      payload: string
    then:
      - if:
          condition:
            lambda: return id(ha_token).empty();
          then:
            - logger.log: "Not paired; the action was dropped"
          else:
            - http_request.post:
                url: !lambda |-
                  return "${ha_url}/api/services/" + domain + "/" + service;
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "application/json"
                body: !lambda return payload;
                capture_response: false

  - id: cmd_prev
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "media_previous_track"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_play_pause
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "media_play_pause"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_next
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "media_next_track"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_volume_down
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "volume_down"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_volume_up
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "volume_up"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  # -- The slider reports 0-100; Home Assistant wants 0.00-1.00. --
  - id: cmd_volume_set
    mode: parallel
    max_runs: 4
    parameters:
      level: int
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "volume_set"
          payload: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.2f", level / 100.0f);
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"volume_level\":" + buf + "}";

  - id: cmd_shuffle_set
    mode: parallel
    max_runs: 4
    parameters:
      state: string
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "shuffle_set"
          payload: !lambda |-
            std::string on = (state == "on") ? "true" : "false";
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"shuffle\":" + on + "}";

  - id: cmd_repeat_set
    mode: parallel
    max_runs: 4
    parameters:
      mode: string
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "repeat_set"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"repeat\":\"" + mode + "\"}";

  # -- The playlist roller holds the selection; only the index travels. --
  - id: cmd_play_playlist
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "music_assistant"
          service: "play_media"
          payload: !lambda |-
            int idx = id(selected_playlist_idx);
            std::string uri;
            if (idx >= 0 && idx < (int) id(playlist_uris).size()) {
              uri = id(playlist_uris)[idx];
            }
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"media_id\":\"" + uri +
                   "\",\"media_type\":\"playlist\"}";

  # -- A card is addressed by its entity, which the grid component resolved
  # -- from the rid the card stores. The call goes through `homeassistant`
  # -- rather than the domain in front of the dot, the way the T560 panel
  # -- does: it toggles a lamp, a socket, a thermostat and a blind alike,
  # -- and deriving the domain would refuse exactly the thermostats whose
  # -- toggle lives there. This is the whole point of the paired firmware:
  # -- nothing here is decided at compile time. --
  - id: cmd_entity_toggle
    mode: parallel
    max_runs: 4
    parameters:
      entity: string
    then:
      - lambda: |-
          if (entity.find('.') == std::string::npos) return;
          id(ha_action)->execute(
              std::string("homeassistant"), std::string("toggle"),
              "{\"entity_id\":\"" + entity + "\"}");
      # -- The states ride the config poll, which runs every second anyway.
      # -- A card the person just pressed must not wait for that, so read
      # -- the config again once Home Assistant has had time to act. --
      - delay: 400ms
      - script.execute: ui_load_room_config

  # -- Only a light can be dimmed. A switch simply ignores the long press. --
  - id: cmd_entity_brightness
    mode: parallel
    max_runs: 4
    parameters:
      entity: string
      pct: int
    then:
      - lambda: |-
          if (entity.rfind("light.", 0) != 0) return;
          char buf[8];
          snprintf(buf, sizeof(buf), "%d", pct);
          id(ha_action)->execute(
              std::string("light"), std::string("turn_on"),
              "{\"entity_id\":\"" + entity +
              "\",\"brightness_pct\":" + buf + "}");

  # -- A thermostat's setpoint, contract version 7.
  # --
  # -- Called **once**, when the finger comes off, and never per sweep tick.
  # -- A brightness sweep can afford a call per tick because a lamp answers
  # -- on mains wiring; a thermostat is very often a battery radiator valve
  # -- on Zigbee or Z-Wave, and ten calls a second to one would flood a mesh
  # -- with values nobody has finished choosing. The value swept during the
  # -- press is local to the grid component and only this sends it. --
  - id: cmd_entity_set_temperature
    mode: parallel
    max_runs: 4
    parameters:
      entity: string
      value: float
    then:
      - lambda: |-
          if (entity.rfind("climate.", 0) != 0) return;
          char buf[16];
          snprintf(buf, sizeof(buf), "%.1f", value);
          id(ha_action)->execute(
              std::string("climate"), std::string("set_temperature"),
              "{\"entity_id\":\"" + entity +
              "\",\"temperature\":" + buf + "}");
      # -- Same reason as a toggle: the card must not wait for the next
      # -- config poll to show what the person just asked for. --
      - delay: 400ms
      - script.execute: ui_load_room_config

  # -- The one entity in the payload this device writes. Home Assistant owns
  # -- the value: this asks for a skin and changes nothing locally, and the
  # -- new one arrives back the ordinary way, in settings.player_skin. The
  # -- name was already checked against the skins this build draws before it
  # -- got here, so this route cannot write an arbitrary value. --
  - id: cmd_skin_select
    mode: restart
    parameters:
      skin: string
    then:
      - if:
          condition:
            lambda: return !id(skin_select_entity).empty();
          then:
            - script.execute:
                id: ha_action
                domain: "select"
                service: "select_option"
                payload: !lambda |-
                  return "{\"entity_id\":\"" + id(skin_select_entity) +
                         "\",\"option\":\"" + skin + "\"}";
          else:
            - logger.log: "Home Assistant named no skin entity for this device"

  # -- The four fixed room buttons the interface package draws. This firmware
  # -- never shows that page: under contract version 6 a panel is sent no
  # -- `slots` block at all, so there is no entity behind a slot number and
  # -- room_page_index points at the grid instead. The scripts stay because
  # -- the interface names them and both firmwares answer to the same seam. --
  - id: cmd_slot_toggle
    parameters:
      slot: int
    then:
      - logger.log:
          format: "Slot %d is not used by this firmware; the room grid is"
          args: [slot]
          level: DEBUG

  - id: cmd_slot_brightness
    parameters:
      slot: int
      pct: int
    then:
      - logger.log:
          format: "Slot %d is not used by this firmware; the room grid is"
          args: [slot]
          level: DEBUG

  - id: play_queue_item
    then:
      - lambda: |-
          int idx = id(selected_queue_idx);
          std::string item;
          if (idx >= 0 && idx < (int) id(queue_id_list).size()) {
            item = id(queue_id_list)[idx];
            ESP_LOGD("queue", "Playing queue item: %s", item.c_str());
          }
          id(ha_action)->execute(
              std::string("media_controller"),
              std::string("play_queue_item"),
              "{\"entity_id\":\"" + id(player_entity) +
              "\",\"queue_item_id\":\"" + item + "\"}");
      - script.execute: show_home_page

  # ════════════════════════════════════════════════════════════
  # PAIRING
  # ════════════════════════════════════════════════════════════

  # -- An unpaired device shows its code; a paired one goes straight to the
  # -- interface, which the shared package has already put on screen. --
  - id: show_start_page
    then:
      - if:
          condition:
            lambda: return id(ha_token).empty();
          then:
            - lambda: |-
                if (id(pairing_code).empty()) {
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%06u",
                           (unsigned) (random_uint32() % 1000000));
                  id(pairing_code) = buf;
                  ESP_LOGI("pair", "Pairing code %s", buf);
                }
                if (id(pairing_hint).empty()) {
                  id(pairing_hint) = "Add this device in Home Assistant";
                }
            - script.execute: ui_sync_pairing
            - lvgl.page.show: page_pairing

  - id: ui_sync_pairing
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          lv_label_set_text(id(lbl_pairing_code), id(pairing_code).c_str());
          lv_label_set_text(id(lbl_pairing_hint), id(pairing_hint).c_str());

  # -- Home Assistant answers this only while somebody has approved a pairing
  # -- for this device, only for a few minutes, only for the code on this
  # -- screen, and only once. Everything that protects the exchange is on that
  # -- side, in the integration's pairing.py. Here it is a poll and four
  # -- outcomes. --
  - id: poll_pairing
    mode: restart
    then:
      - http_request.post:
          url: "${ha_url}/api/media_controller/provision"
          request_headers:
            Content-Type: "application/json"
          body: !lambda |-
            return "{\"panel_id\":\"" + get_mac_address() +
                   "\",\"code\":\"" + id(pairing_code) + "\"}";
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  int code = response->status_code;
                  if (code == 404) {
                    id(pairing_hint) = "Add this device in Home Assistant";
                  } else if (code == 202) {
                    id(pairing_hint) = "Accepted - finish the setup form";
                  } else if (code == 403) {
                    id(pairing_hint) = "Enter this code in Home Assistant";
                  } else if (code != 200) {
                    id(pairing_hint) = "Home Assistant returned an error";
                  }
                  if (code != 200) {
                    // -- One line per change, not one per poll. Home Assistant
                    //    answers 404 for as long as nobody has started adding
                    //    this device, which can be days. --
                    if (code != id(last_pairing_status)) {
                      ESP_LOGI("pair", "Provisioning HTTP %d", code);
                    }
                    id(last_pairing_status) = code;
                    id(ui_sync_pairing)->execute();
                    return;
                  }
                  id(last_pairing_status) = code;

                  std::string token = id(json_field)(body, "token");
                  std::string entity = id(json_field)(body, "config_entity");
                  if (token.empty() || entity.empty()) {
                    ESP_LOGW("pair", "The provisioning answer was incomplete");
                    return;
                  }
                  id(ha_token) = token;
                  id(config_entity) = entity;
                  id(auth_header) = "Bearer " + token;
                  id(pairing_code) = "";
                  ESP_LOGI("pair", "Paired; reading %s", entity.c_str());
              - if:
                  condition:
                    lambda: return !id(ha_token).empty();
                  then:
                    - script.execute: ui_load_room_config
                    - script.execute: show_home_page

  # -- A token Home Assistant no longer accepts is worse than no token: every
  # -- request would fail and the screen would quietly stop moving. Drop it
  # -- and ask again. --
  - id: forget_token
    then:
      - lambda: |-
          ESP_LOGW("pair", "The token was rejected; pairing again");
          id(ha_token) = "";
          id(auth_header) = "";
          id(pairing_code) = "";
          id(pairing_hint) = "Add this device in Home Assistant";
      - script.execute: show_start_page

  # ════════════════════════════════════════════════════════════
  # POLLING
  # ════════════════════════════════════════════════════════════

  # -- The player, in one request. It replaces the nine separate state
  # -- subscriptions the classic firmware gets over the native API. --
  - id: poll_player
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(player_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return "${ha_url}/api/states/" + id(player_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                max_response_buffer_size: 8192
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 401 ||
                            response->status_code == 403) {
                          id(forget_token)->execute();
                          return;
                        }
                        if (response->status_code != 200) {
                          ESP_LOGW("player", "HTTP %d",
                                   response->status_code);
                          return;
                        }

                        std::string state = id(json_field)(body, "state");
                        if (!state.empty() &&
                            state != id(player_state).state) {
                          id(player_state).publish_state(state);
                        }

                        std::string attrs = id(json_object)(body,
                                                            "attributes");
                        if (attrs.empty()) return;

                        std::string title = id(json_field)(attrs,
                                                           "media_title");
                        if (title.empty()) title = "No track";
                        if (title != id(media_title).state) {
                          id(media_title).publish_state(title);
                        }

                        std::string artist = id(json_field)(attrs,
                                                            "media_artist");
                        if (artist != id(media_artist).state) {
                          id(media_artist).publish_state(artist);
                        }

                        std::string art = id(json_field)(
                            attrs, "entity_picture_local");
                        if (art.empty()) art = "None";
                        if (art != id(entity_picture).state) {
                          id(entity_picture).publish_state(art);
                        }

                        std::string shuffle = id(json_field)(attrs,
                                                             "shuffle");
                        if (shuffle != id(shuffle_state).state) {
                          id(shuffle_state).publish_state(shuffle);
                        }

                        std::string repeat = id(json_field)(attrs, "repeat");
                        if (repeat.empty()) repeat = "off";
                        if (repeat != id(repeat_state).state) {
                          id(repeat_state).publish_state(repeat);
                        }

                        std::string vol = id(json_field)(attrs,
                                                         "volume_level");
                        if (!vol.empty()) {
                          float v = atof(vol.c_str());
                          if (isnan(id(volume_level).state) ||
                              fabsf(v - id(volume_level).state) > 0.001f) {
                            id(volume_level).publish_state(v);
                          }
                        }

                        std::string dur = id(json_field)(attrs,
                                                         "media_duration");
                        float d = dur.empty() ? 0.0f : atof(dur.c_str());
                        if (isnan(id(media_duration).state) ||
                            fabsf(d - id(media_duration).state) > 0.5f) {
                          id(media_duration).publish_state(d);
                        }

                        std::string pos = id(json_field)(attrs,
                                                         "media_position");
                        float p = pos.empty() ? 0.0f : atof(pos.c_str());
                        if (fabsf(p - id(last_polled_position)) > 0.5f) {
                          id(last_polled_position) = p;
                          id(media_position).publish_state(p);
                        }

  # -- Every card's state arrives inside the config poll, in the `room_states`
  # -- block the integration renders there. It used to be a template rendered
  # -- by a POST to /api/template, one request for every card on the page —
  # -- but that endpoint answers administrators only, and this device's token
  # -- belongs to a dedicated non-administrator user, so Home Assistant
  # -- refused it with 401 and every card stayed blank. The states are read
  # -- out of the config attributes in ui_load_room_config below, through
  # -- apply_room_states, which costs no request of its own.

  # -- The daily forecast behind the weather blocks. One request names every
  # -- drawn weather entity the component reports, and the answer is parsed
  # -- with no JSON library, the way the registry is: a day-by-day answer is
  # -- kilobytes, and this device has no kilobytes to spend on a document. --
  - id: poll_room_forecast
    mode: restart
    then:
      - lambda: id(pending_forecast_body) = id(room_grid)->forecast_request();
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() &&
                     !id(pending_forecast_body).empty();
          then:
            - http_request.post:
                # -- With the response asked for: without ?return_response
                # -- Home Assistant answers a bare empty list, however much
                # -- forecast it holds. --
                url: "${ha_url}/api/services/weather/get_forecasts?return_response"
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "application/json"
                body: !lambda return id(pending_forecast_body);
                capture_response: true
                # -- Two entities at most, five days each: well under this,
                # -- and an answer that overflows is cut off mid-flight, which
                # -- the parse reads as fewer days rather than an error. --
                max_response_buffer_size: 8192
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - lambda: id(room_grid)->apply_forecast(body);
                          - script.execute: refresh_room_cards
                        else:
                          - lambda: |-
                              ESP_LOGW("room", "Forecast HTTP %d",
                                       response->status_code);

  # -- The config sensor names every other entity, so it is requested every
  # -- cycle rather than as rarely as a layout alone would need: it is also
  # -- the channel Home Assistant turns the screen off through, and a button
  # -- there that took a minute to do anything would read as broken. --
  - id: ui_load_room_config
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(config_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return "${ha_url}/api/states/" + id(config_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                # -- Sixty-four registry elements with Cyrillic names are
                # -- about thirteen kilobytes, and 8192 does not hold them.
                # -- An overflowing buffer is not an error here: the response
                # -- is cut off mid-flight, the parse simply finds less than
                # -- it expected, and nothing appears in the log. That is the
                # -- trap TB-9 left, and this is the same fix.
                # --
                # -- Not 64 kB: the buffer is allocated at its full size on
                # -- every request (http_request.h:517) and the config sensor
                # -- is fetched once per poll_interval_ms, which is once a
                # -- second. --
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - lambda: |-
                        id(pending_attributes) = "";
                        id(pending_commands) = "";
                        id(layout_changed) = false;

                        if (response->status_code == 401 ||
                            response->status_code == 403) {
                          id(forget_token)->execute();
                          return;
                        }
                        if (response->status_code != 200) {
                          ESP_LOGW("room", "Config sensor HTTP %d",
                                   response->status_code);
                          return;
                        }
                        std::string attrs = id(json_object)(body,
                                                            "attributes");
                        if (attrs.empty()) return;

                        // -- A payload missing any of the three controller
                        //    entities is not usable yet and must be retried,
                        //    not cached. --
                        std::string player = id(json_field)(attrs, "player");
                        std::string queue = id(json_field)(attrs, "queue");
                        std::string lists = id(json_field)(attrs,
                                                           "playlists");
                        if (player.empty() || queue.empty() ||
                            lists.empty()) {
                          ESP_LOGD("slots", "The config payload is not ready");
                          return;
                        }
                        id(player_entity) = player;
                        id(queue_entity) = queue;
                        id(playlists_entity) = lists;

                        // -- This device's half of the version check; the
                        //    integration performs the other half on the
                        //    report sent above. An integration older than
                        //    this firmware sends no contract version at all,
                        //    which reads as 0 and compares like any smaller
                        //    number. There is nowhere on this screen to say
                        //    so without taking space from the interface, so
                        //    it goes to the log, where an ESPHome device
                        //    reports a configuration problem. Logged once per
                        //    version seen: the config sensor is read every
                        //    poll cycle, and a line a second would bury
                        //    everything else. --
                        static int warned_contract = -1;
                        int contract = atoi(
                            id(json_field)(attrs,
                                           "contract_version").c_str());
                        if (contract < ${contract_version} &&
                            contract != warned_contract) {
                          warned_contract = contract;
                          ESP_LOGW("config",
                                   "Home Assistant speaks contract %d and "
                                   "this firmware needs %d: update Media "
                                   "Controller",
                                   contract, ${contract_version});
                        }

                        // -- Home Assistant owns both poll rates. Clamp them
                        //    here as well as there: a client trusts a payload
                        //    no further than it has to. --
                        std::string settings = id(json_object)(attrs,
                                                               "settings");
                        if (!settings.empty()) {
                          std::string v = id(json_field)(settings,
                                                         "poll_interval_ms");
                          if (!v.empty()) {
                            uint32_t ms = (uint32_t) atof(v.c_str());
                            if (ms < 500) ms = 500;
                            if (ms > 30000) ms = 30000;
                            id(poll_interval_ms) = ms;
                          }
                          v = id(json_field)(
                              settings, "playlist_poll_interval_ms");
                          if (!v.empty()) {
                            uint32_t ms = (uint32_t) atof(v.c_str());
                            if (ms < 10000) ms = 10000;
                            if (ms > 3600000) ms = 3600000;
                            id(playlist_poll_interval_ms) = ms;
                          }
                          // -- Which home layout to draw. The interface owns
                          //    the mapping and ignores a name it does not
                          //    know, so this half only has to hand it over.
                          //    An absent key leaves the layout restored from
                          //    flash alone: Home Assistant has not chosen. --
                          id(pending_skin) = id(json_field)(settings,
                                                            "player_skin");
                        }

                        // -- The Player Skin select on this device's own Home
                        //    Assistant device, and the only entity in the
                        //    payload this firmware writes. Outside the
                        //    revision on purpose: which entity holds the skin
                        //    is not layout. --
                        id(skin_select_entity) = id(json_field)(
                            attrs, "skin_select");
                        id(room_grid)->set_skin_writable(
                            !id(skin_select_entity).empty());
                        // -- What the on-device picker has to show: the skin
                        //    on screen, not the one Home Assistant last
                        //    mentioned. --
                        id(room_grid)->set_skin(
                            id(screen_style).current_option());

                        // -- The revision covers the layout and nothing else,
                        //    so an unchanged one costs no widget work. --
                        uint32_t rev = (uint32_t) atof(
                            id(json_field)(attrs, "revision").c_str());
                        if (rev == 0 || rev != id(config_revision)) {
                          id(config_revision) = rev;
                          id(layout_changed) = true;
                        }

                        id(pending_commands) = id(json_object)(attrs,
                                                               "commands");
                        id(pending_attributes) = attrs;

                        // -- The room states ride this poll, in the block
                        //    the integration renders beside the registry. A
                        //    template rendered by POST /api/template would
                        //    be one request for every card, but that
                        //    endpoint answers administrators only and this
                        //    device's token belongs to a dedicated
                        //    non-administrator user. Applied on every poll:
                        //    unlike the registry, states move constantly. --
                        std::string states = id(json_object)(
                            attrs, "room_states");
                        if (!states.empty() &&
                            id(room_grid)->apply_room_states(states)) {
                          id(refresh_room_cards)->execute();
                        }
                    - if:
                        condition:
                          lambda: return !id(pending_skin).empty();
                        then:
                          - script.execute:
                              id: ui_apply_skin
                              skin: !lambda return id(pending_skin);
                    - script.execute: read_commands
                    - script.execute: apply_commands
                    # -- The registry is handed over only when the revision
                    # -- moved. Walking sixty-four elements with ArduinoJson
                    # -- once a second would be pure churn for a list that
                    # -- changes twice in the life of a device, and the
                    # -- revision exists to say when it did. --
                    - if:
                        condition:
                          lambda: return id(layout_changed);
                        then:
                          - lambda: |-
                              if (id(room_grid)->ingest_entities(
                                      id(pending_attributes))) {
                                id(rebuild_room_grid)->execute();
                                id(last_forecast_poll_ms) = 0;
                              }

  - id: refresh_queue
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(queue_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return "${ha_url}/api/states/" + id(queue_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - script.execute:
                              id: rebuild_queue
                              payload: !lambda return body;

  - id: poll_playlists
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() &&
                     !id(playlists_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return "${ha_url}/api/states/" + id(playlists_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - script.execute:
                              id: rebuild_playlists
                              payload: !lambda return body;
                        else:
                          - lambda: |-
                              ESP_LOGW("playlists", "HTTP %d",
                                       response->status_code);

  # ════════════════════════════════════════════════════════════
  # PANEL COMMANDS
  # ════════════════════════════════════════════════════════════
  # A command is a moment, not a message: each carries the millisecond it was
  # issued at, and it is acted on only when that is newer than the last one
  # acted on. That is what makes a poll a safe transport — a command runs once
  # however often it is read, and a restart does not repeat on every boot.
  #
  # Parsing and acting are two scripts because a lambda cannot turn a
  # backlight on; only an action can.
  #
  # `screen_off_seconds` is deliberately not applied. This device already owns
  # a "Screen Timeout" number of its own on its ESPHome device, its range is
  # narrower than the contract's, and two owners for one setting is a bug
  # waiting to happen.

  - id: read_commands
    then:
      - lambda: |-
          const std::string &payload = id(pending_commands);
          id(want_display) = 0;
          id(want_brightness) = -1;
          id(want_restart) = false;
          id(want_page) = "";
          if (payload.empty()) return;

          std::string block = id(json_object)(payload, "display");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_display_at)) {
              id(last_display_at) = at;
              id(want_display) =
                  (id(json_field)(block, "state") == "on") ? 1 : 2;
            }
          }

          block = id(json_object)(payload, "brightness");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_brightness_at)) {
              id(last_brightness_at) = at;
              int value = atoi(id(json_field)(block, "value").c_str());
              if (value >= 1 && value <= 100) id(want_brightness) = value;
            }
          }

          block = id(json_object)(payload, "restart");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_restart_at)) {
              id(last_restart_at) = at;
              id(want_restart) = true;
            }
          }

          block = id(json_object)(payload, "page");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_page_at)) {
              id(last_page_at) = at;
              id(want_page) = id(json_field)(block, "value");
            }
          }

  - id: apply_commands
    then:
      - if:
          condition:
            lambda: return id(want_display) == 2;
          then:
            - lvgl.pause:
            - light.turn_off: backlight
      - if:
          condition:
            lambda: return id(want_display) == 1;
          then:
            - light.turn_on: backlight
            - lvgl.resume:
            - lambda: id(screen_last_active_ms) = millis();
      - if:
          condition:
            lambda: return id(want_brightness) >= 0;
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda return id(want_brightness) / 100.0f;
      - if:
          condition:
            lambda: return id(want_page) == "player";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_page) == "queue";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_page) == "playlists";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_page) == "room";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_restart);
          then:
            # -- Long enough for the watermark to reach flash, so the restart
            # -- is not replayed on the next boot. --
            - delay: 2s
            - lambda: App.safe_reboot();

  # ════════════════════════════════════════════════════════════
  # THE ROOM GRID
  # ════════════════════════════════════════════════════════════
  # Eight columns by eight rows of exactly 60 px, over the whole 480x480
  # screen. That is why page_room_grid carries no heading and no "tap to
  # toggle" hint: with them the work area is about 405 px and a row collapses
  # to 50. The hint stops being true the moment a person arranges the page
  # themselves, anyway.
  #
  # This page is drawn here rather than in media-controller-ui.yaml for the
  # same reason page_pairing is: the classic firmware can never have it. It
  # resolves entity IDs while compiling, in both directions, so a card handed
  # to it at runtime would have nothing to call. That is a property of the
  # variant and not a gap; see docs/ESP32_PAIRED_CONTROLLER.md. The interface
  # keeps its four fixed buttons, and this firmware points room_page_index
  # here instead.
  #
  # Cards are built when the layout or the registry changes and at no other
  # time. Rebuilding a grid of sixty-four cards per frame would be exactly the
  # unbounded heap churn AGENTS.md forbids; LVGL takes its memory from the
  # heap here (ESPHome sets LV_USE_STDLIB_MALLOC to LV_STDLIB_CUSTOM), which
  # makes the churn possible rather than acceptable.

  - id: rebuild_room_grid
    then:
      - lambda: |-
          // -- LVGL widgets exist only after the interface package's on_boot
          //    has run. Everything that gets here earlier is redone by the
          //    explicit call at the end of this firmware's own on_boot. --
          if (!id(ui_ready)) return;

          lv_obj_t *root = (lv_obj_t *) id(room_grid_root);
          lv_obj_clean(root);

          // -- An empty grid says so rather than showing a blank screen that
          //    reads as a broken device. --
          const auto &cards = id(room_grid)->cards();
          lv_obj_t *empty[] = {
            (lv_obj_t *) id(lbl_room_grid_empty),
            (lv_obj_t *) id(lbl_room_grid_hint),
          };
          for (auto *label : empty) {
            if (cards.empty()) {
              lv_obj_remove_flag(label, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(label, LV_OBJ_FLAG_HIDDEN);
            }
          }

          for (size_t i = 0; i < cards.size(); i++) {
            const auto &card = cards[i];
            const auto *entry = id(room_grid)->entry(card.rid);

            // -- The cell is exactly 60 px. The card leaves three of them on
            //    each side unpainted, so two neighbours read as two cards
            //    rather than one slab; the geometry underneath is still whole
            //    cells. --
            lv_obj_t *tile = lv_obj_create(root);
            lv_obj_set_pos(tile, card.x() * 60 + 3, card.y() * 60 + 3);
            lv_obj_set_size(tile, card.w() * 60 - 6, card.h() * 60 - 6);
            lv_obj_set_user_data(tile, (void *) (uintptr_t) i);
            lv_obj_remove_flag(tile, LV_OBJ_FLAG_SCROLLABLE);
            // -- lv_obj_create leaves an object unclickable, and a card that
            //    is not clickable gets no long press either. A reading card
            //    stays unclickable on purpose: weather, a sensor, or anything
            //    Home Assistant offered no action for never shows a pressed
            //    state for a tap that acts on nothing, exactly like the T560
            //    panel. A card whose element has not arrived yet keeps the
            //    default and is corrected by the rebuild the registry poll
            //    triggers. --
            bool is_reading =
                entry != nullptr &&
                media_controller_grid::entry_is_reading(*entry);
            bool actionable =
                !is_reading &&
                (entry == nullptr || entry->togglable || entry->dimmable ||
                 entry->settable_temp);
            if (actionable) {
              lv_obj_add_flag(tile, LV_OBJ_FLAG_CLICKABLE);
            }
            // -- So a drag across a card still reaches the page and changes
            //    it, exactly as it does over the four fixed buttons. --
            lv_obj_add_flag(tile, LV_OBJ_FLAG_GESTURE_BUBBLE);

            // -- The palette of the room page, which apply_theme deliberately
            //    does not touch: the four fixed buttons are not themed
            //    either, and a card that repainted itself would be a second
            //    owner for a colour that already has one. A weather block
            //    wears its own sky rather than the off grey, the way the
            //    T560 panel draws it: it is information, not a switch left
            //    off. --
            bool is_weather =
                entry != nullptr &&
                entry->domain == media_controller_grid::DOMAIN_WEATHER;
            lv_obj_set_style_pad_all(tile, 0, 0);
            lv_obj_set_style_radius(tile, card.w() >= 2 ? 18 : 12, 0);
            lv_obj_set_style_bg_color(tile,
                                      is_weather ? lv_color_hex(0x2e5d8f)
                                                 : lv_color_hex(0x303050),
                                      0);
            lv_obj_set_style_bg_grad_color(tile,
                                           is_weather ? lv_color_hex(0x122540)
                                                      : lv_color_hex(0x11111f),
                                           0);
            lv_obj_set_style_bg_grad_dir(tile, LV_GRAD_DIR_VER, 0);
            lv_obj_set_style_bg_opa(tile, LV_OPA_COVER, 0);
            lv_obj_set_style_border_width(tile, 2, 0);
            lv_obj_set_style_border_color(tile,
                                          is_weather ? lv_color_hex(0x6fb3e8)
                                                     : lv_color_hex(0x505078),
                                          0);
            // -- A pressed face only where a press acts: a reading never
            //    shows one, because a tap on it acts on nothing. --
            if (actionable) {
              lv_obj_set_style_bg_color(tile, lv_color_hex(0x151526),
                                        LV_STATE_PRESSED);
              lv_obj_set_style_bg_grad_color(tile, lv_color_hex(0x272742),
                                             LV_STATE_PRESSED);
              lv_obj_set_style_border_color(tile, lv_color_hex(0x00cfff),
                                            LV_STATE_PRESSED);
            }

            // -- The artwork. A stored icon wins; without one the domain
            //    decides, which is what makes a card useful before anybody
            //    has opened the editor. A switch borrows the fan and a
            //    thermostat the air conditioner, the way the T560 panel
            //    does; a blind has its own picture. A sensor or a weather
            //    block names none where it counts: the icon object below
            //    stays hidden unless a person chose one in the editor, and
            //    the card draws its value as type rather than artwork, again
            //    the way the T560 panel does. Never scaled at draw time: each of
            //    these is a 40x40 asset of its own, because this build sets
            //    LV_COLOR_16_SWAP and LVGL cannot transform a swapped
            //    RGB565 source. --
            bool sensor_card =
                entry != nullptr &&
                entry->domain == media_controller_grid::DOMAIN_SENSOR;
            image::Image *art = id(card_icon_light1);
            if (card.icon == 1) art = id(card_icon_light1);
            else if (card.icon == 2) art = id(card_icon_light2);
            else if (card.icon == 3) art = id(card_icon_fan);
            else if (card.icon == 4) art = id(card_icon_ac);
            else if (card.icon == 5) art = id(card_icon_weather);
            else if (card.icon == 6) art = id(card_icon_blind);
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_WEATHER) {
              art = id(card_icon_weather);
            }
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_SWITCH) {
              art = id(card_icon_fan);
            }
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_CLIMATE) {
              art = id(card_icon_ac);
            }
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_COVER) {
              art = id(card_icon_blind);
            }

            // -- A one-cell card is 54 px of paint and has room for the icon
            //    or the name, not both. The icon is the half that still says
            //    what the card is at a glance. That rule is the same for
            //    every card type but two: a sensor or a weather block at one
            //    cell says its value, with the name where it fits beside it
            //    — see `compact` below. Anything else at one cell is a
            //    picture and a tap, and everything it has to say needs two. --
            bool labelled = media_controller_grid::card_is_labelled(card);
            bool reads = media_controller_grid::card_shows_reading(card, entry);
            // -- A sensor below the labelled size still says its value: the
            //    name goes on top and the value under it, and where both do
            //    not fit the name is dropped and the value stays, because
            //    the value outranks the name. --
            bool compact = media_controller_grid::card_shows_compact(card, entry);
            // -- Large weather cards list the coming days under the current
            //    reading, as many rows as the card has cells for. The count
            //    is a fact about the card's size, so the refresh below
            //    builds the same children back by asking the same question.
            // --
            uint8_t forecast_rows =
                media_controller_grid::card_forecast_rows(card, entry);
            // -- A large weather card draws the T560 headed layout: the name
            //    on top, the hero temperature large beneath it, the condition
            //    line under the hero and the coming days at the bottom. A
            //    compact weather block keeps the compact layout every reading
            //    shares. --
            bool weather_large = is_weather && labelled && !compact;

            const lv_font_t *room_font = id(roboto_16)->get_lv_font();
            int line_h = lv_font_get_line_height(room_font);
            int tile_h = card.h() * 60 - 6;
            int tile_w = card.w() * 60 - 6;

            lv_obj_t *icon = lv_image_create(tile);
            lv_image_set_src(icon, art->get_lv_image_dsc());
            lv_obj_remove_flag(icon, LV_OBJ_FLAG_CLICKABLE);
            // -- No icon where the value is the picture: on a compact card
            //    54 px hold the name and the value and nothing else, and on
            //    a sensor or a weather card the reading says more than
            //    artwork ever could — the T560 panel draws no icon-table
            //    artwork on a reading either — unless a person chose an
            //    icon for it in the editor, which wins. The object stays —
            //    child 0 is the icon on every card, and the refresh below
            //    walks children by index. --
            bool hide_icon =
                compact ||
                ((sensor_card || is_weather) && card.icon == 0);
            if (hide_icon) {
              lv_obj_add_flag(icon, LV_OBJ_FLAG_HIDDEN);
            }
            int icon_y = !labelled ? 0
                                   : (-12 - (reads ? 8 : 0) -
                                      (int) forecast_rows * 20);
            lv_obj_align(icon, LV_ALIGN_CENTER, 0, icon_y);

            // -- Decided before anything it places is created: the value
            //    needs one line and the name needs one, and where both do
            //    not fit the name is dropped and the value stays. --
            bool show_name = true;
            int value_y = 0;
            if (compact) {
              int need = 4 + line_h + 2 + line_h + 4;
              show_name = need <= tile_h;
              int zone_top = show_name ? 4 + line_h + 2 : 4;
              int zone_bottom = tile_h - 4;
              int slack = zone_bottom - zone_top - line_h;
              value_y = zone_top + (slack > 0 ? slack / 2 : 0);
            }

            // -- Child 1 on every labelled card of a known domain; see the
            //    child order in media_controller_grid.h. It is created empty
            //    because the registry arriving and the state arriving are two
            //    different polls, and refresh_room_cards fills it: the
            //    reading on a thermostat, sensor or cover card, and ON/OFF
            //    on a light or switch card. A large weather card instead
            //    carries the hero temperature in child 1 and the condition
            //    line in child 2, the way the T560 panel stacks them. --
            lv_obj_t *reading = nullptr;
            lv_obj_t *weather_sub = nullptr;
            if (weather_large) {
              const lv_font_t *hero_font =
                  tile_w >= 174 ? id(roboto_36)->get_lv_font()
                                : id(roboto_30)->get_lv_font();
              int hero_line = lv_font_get_line_height(hero_font);
              int name_bottom = 4 + line_h + 2;
              int forecast_top = forecast_rows > 0
                                     ? tile_h - 4 -
                                           (46 + (forecast_rows - 1) * 20 +
                                            line_h)
                                     : tile_h - 4;
              int total = hero_line + 4 + line_h;
              int slack = forecast_top - name_bottom - total;
              int hero_y = name_bottom + (slack > 0 ? slack / 2 : 0);

              reading = lv_label_create(tile);
              lv_label_set_long_mode(reading, LV_LABEL_LONG_DOT);
              lv_obj_set_width(reading, tile_w - 16);
              lv_obj_set_style_text_align(reading, LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_font(reading, hero_font, 0);
              lv_obj_set_style_text_color(reading, lv_color_hex(0xffffff), 0);
              lv_label_set_text(reading, "");
              lv_obj_align(reading, LV_ALIGN_TOP_MID, 0, hero_y);

              weather_sub = lv_label_create(tile);
              lv_label_set_long_mode(weather_sub, LV_LABEL_LONG_DOT);
              lv_obj_set_width(weather_sub, tile_w - 16);
              lv_obj_set_style_text_align(weather_sub, LV_TEXT_ALIGN_CENTER,
                                          0);
              lv_obj_set_style_text_font(weather_sub, room_font, 0);
              lv_obj_set_style_text_color(weather_sub,
                                          lv_color_hex(0xcfe3f7), 0);
              lv_label_set_text(weather_sub, "");
              lv_obj_align(weather_sub, LV_ALIGN_TOP_MID, 0,
                           hero_y + hero_line + 4);
            } else if (reads || compact) {
              reading = lv_label_create(tile);
              lv_label_set_long_mode(reading, LV_LABEL_LONG_DOT);
              lv_obj_set_width(reading, card.w() * 60 - 16);
              lv_obj_set_style_text_align(reading, LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_font(reading, room_font, 0);
              lv_obj_set_style_text_color(reading, compact ? lv_color_hex(0xffffff)
                                                           : lv_color_hex(0x8f8fb4), 0);
              lv_label_set_text(reading, "");
              if (compact) {
                lv_obj_align(reading, LV_ALIGN_TOP_MID, 0, value_y);
              } else if (sensor_card) {
                // -- Nothing above it: the icon is hidden, so the value
                //    moves to the middle of the card and the name keeps the
                //    bottom line. --
                lv_obj_align(reading, LV_ALIGN_CENTER, 0, -8);
              } else {
                lv_obj_align(reading, LV_ALIGN_BOTTOM_MID, 0, -26);
              }
            }

            // -- One label per forecast row, created empty: the registry
            //    arriving, the state arriving and the forecast arriving are
            //    three different polls, and refresh_room_cards fills them.
            //    On a weather card the rows draw in the T560 colours — the
            //    weekday muted, the high orange, the low blue — through
            //    recolor spans (see forecast_text_colored). --
            for (uint8_t row = 0; row < forecast_rows; row++) {
              lv_obj_t *forecast = lv_label_create(tile);
              lv_label_set_long_mode(forecast, LV_LABEL_LONG_DOT);
              lv_obj_set_width(forecast, card.w() * 60 - 16);
              lv_obj_set_style_text_align(forecast, LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_font(forecast, id(roboto_16)->get_lv_font(), 0);
              lv_obj_set_style_text_color(forecast, weather_large ? lv_color_hex(0xa9c3e0)
                                                                  : lv_color_hex(0x8f8fb4), 0);
              if (weather_large) {
                lv_label_set_recolor(forecast, true);
              }
              lv_label_set_text(forecast, "");
              lv_obj_align(forecast, LV_ALIGN_BOTTOM_MID, 0,
                           -46 - (int) row * 20);
            }

            if (labelled || (compact && show_name)) {
              lv_obj_t *name = lv_label_create(tile);
              lv_label_set_long_mode(name, LV_LABEL_LONG_WRAP);
              lv_obj_set_width(name, card.w() * 60 - 16);
              lv_obj_set_style_text_align(name, LV_TEXT_ALIGN_CENTER, 0);
              // -- roboto_16 and not montserrat: a registry name is whatever
              //    the user typed, and the Roboto faces in this build carry
              //    the Cyrillic glyphs the built-in fonts do not. --
              lv_obj_set_style_text_font(name, room_font, 0);
              lv_obj_set_style_text_color(name, lv_color_hex(0xd8d8f0), 0);
              lv_label_set_text(name, entry != nullptr && !entry->name.empty()
                                          ? entry->name.c_str()
                                          : "—");
              if (compact) {
                // -- On top, single line: the value below outranks it, and
                //    at this size there is no second line to give. --
                lv_label_set_long_mode(name, LV_LABEL_LONG_DOT);
                lv_obj_align(name, LV_ALIGN_TOP_MID, 0, 4);
              } else if (weather_large) {
                // -- A reading is headed by its name, the way the T560 panel
                //    draws it: the location first, then the current
                //    conditions, then the coming days. Single line, so the
                //    hero below never moves. --
                lv_label_set_long_mode(name, LV_LABEL_LONG_DOT);
                lv_obj_set_style_text_color(name, lv_color_hex(0xf1f6fd), 0);
                lv_obj_align(name, LV_ALIGN_TOP_MID, 0, 4);
              } else {
                lv_obj_align(name, LV_ALIGN_BOTTOM_MID, 0, -6);
                // -- A long name wraps onto a second line where the card
                //    has room for it, rather than being ellipsized where it
                //    does not have to be. Exactly two lines are kept: the
                //    name identifies the card, it is not the content. What
                //    sits above it moves up by one line with it. --
                lv_obj_update_layout(name);
                uint32_t lines =
                    (lv_obj_get_height(name) + (uint32_t) line_h - 1) /
                    (uint32_t) line_h;
                if (lines != 2) {
                  lv_label_set_long_mode(name, LV_LABEL_LONG_DOT);
                } else if (!sensor_card && !weather_large) {
                  if (reading != nullptr) {
                    lv_obj_align(reading, LV_ALIGN_BOTTOM_MID, 0,
                                 -26 - line_h);
                  }
                  for (uint8_t row = 0; row < forecast_rows; row++) {
                    lv_obj_t *day = lv_obj_get_child(tile, 2 + (int32_t) row);
                    if (day == nullptr) break;
                    lv_obj_align(day, LV_ALIGN_BOTTOM_MID, 0,
                                 -46 - (int) row * 20 - line_h);
                  }
                  icon_y -= line_h;
                  lv_obj_align(icon, LV_ALIGN_CENTER, 0, icon_y);
                }
              }
            }

            // -- One callback per actionable card. Which card it is comes from
            //    the index in the object's user data, and the entity behind
            //    it from the registry, so nothing about a card is captured
            //    and nothing goes stale when the registry moves under it. A
            //    reading carries none at all: without CLICKABLE no press is
            //    ever sent, and without a callback no tap can become a
            //    service call even if one were. --
            if (actionable) {
              lv_obj_add_event_cb(tile, [](lv_event_t *e) {
              lv_obj_t *pressed =
                  (lv_obj_t *) lv_event_get_current_target(e);
              size_t index =
                  (size_t) (uintptr_t) lv_obj_get_user_data(pressed);
              const auto &placed = id(room_grid)->cards();
              if (index >= placed.size()) return;
              auto *entry = id(room_grid)->entry(placed[index].rid);
              if (entry == nullptr) return;

              switch (lv_event_get_code(e)) {
                case LV_EVENT_PRESSED:
                  id(room_card_long_active) = false;
                  id(room_card_swept) = false;
                  break;
                case LV_EVENT_LONG_PRESSED:
                  id(room_card_long_active) = true;
                  break;
                case LV_EVENT_LONG_PRESSED_REPEAT: {
                  // -- This device has one gesture beyond a tap, and each
                  //    card type spends it on the one value it has: a light
                  //    on its brightness, a thermostat on its setpoint. The
                  //    sweep runs up, turns round at the top and comes back
                  //    down, exactly as the four fixed buttons do; the value
                  //    is local because a light reports the brightness it
                  //    reached, not the one the finger is heading for. --
                  if (entry->dimmable) {
                    float pct = entry->pct + entry->direction * 4.0f;
                    if (pct >= 100.0f) { pct = 100.0f; entry->direction = -1; }
                    if (pct <= 1.0f) { pct = 1.0f; entry->direction = 1; }
                    entry->pct = pct;
                    id(cmd_entity_brightness)->execute(entry->entity,
                                                       (int) pct);
                    break;
                  }
                  // -- Not while it is off. The card of an off thermostat
                  //    shows the room temperature and not the setpoint,
                  //    because it is heading nowhere, so a sweep there would
                  //    move a number with nothing on screen changing — the
                  //    one thing a sweep must never do. Turning it on is a
                  //    tap, and the sweep is there the moment it runs. --
                  if (!entry->settable_temp ||
                      !media_controller_grid::entry_is_on(*entry)) break;

                  // -- Nothing is sent from here. The setpoint moves on the
                  //    device and goes to Home Assistant once, on release:
                  //    see cmd_entity_set_temperature for why a thermostat
                  //    is not swept the way a lamp is. --
                  float target = std::isnan(entry->setpoint)
                                     ? (entry->min_temp + entry->max_temp) / 2.0f
                                     : entry->setpoint;
                  target += entry->direction * entry->temp_step;
                  if (target >= entry->max_temp) {
                    target = entry->max_temp;
                    entry->direction = -1;
                  }
                  if (target <= entry->min_temp) {
                    target = entry->min_temp;
                    entry->direction = 1;
                  }
                  entry->setpoint = target;
                  id(room_card_swept) = true;

                  // -- Only this card is repainted, not the page: a full
                  //    refresh_room_cards at the long-press repeat rate
                  //    would invalidate sixty-four tiles ten times a second
                  //    for one number. Child 1 is the reading; see the child
                  //    order in media_controller_grid.h. --
                  if (media_controller_grid::card_shows_reading(placed[index],
                                                                entry)) {
                    lv_obj_t *reading = lv_obj_get_child(pressed, 1);
                    std::string text = media_controller_grid::card_reading(*entry);
                    if (reading != NULL && !text.empty())
                      lv_label_set_text(reading, text.c_str());
                  }
                  break;
                }
                case LV_EVENT_RELEASED:
                  // -- Where a setpoint sweep is committed. RELEASED and not
                  //    CLICKED, because a finger that slides off the card
                  //    still ends the sweep and still means it; LVGL sends
                  //    RELEASED in both cases and CLICKED in only one. --
                  if (id(room_card_swept) && !std::isnan(entry->setpoint)) {
                    id(cmd_entity_set_temperature)->execute(entry->entity,
                                                            entry->setpoint);
                  }
                  id(room_card_swept) = false;
                  break;
                case LV_EVENT_CLICKED:
                  // -- A release that ended a sweep, or one that happened
                  // -- while the page was already sliding away, is not a
                  // -- tap. Neither is a tap on an element Home Assistant
                  // -- offered no `toggle` for: a thermostat that cannot be
                  // -- turned off is a card that reads rather than acts. A
                  // -- reading never toggles even if one were offered, the
                  // -- way the T560 panel never acts on a weather block. --
                  if (!id(room_card_long_active) &&
                      !id(switches_swipe_active) && entry->togglable &&
                      !media_controller_grid::entry_is_reading(*entry)) {
                    id(cmd_entity_toggle)->execute(entry->entity);
                  }
                  id(room_card_long_active) = false;
                  break;
                default:
                  break;
              }
            }, LV_EVENT_ALL, nullptr);
            }
          }

          ESP_LOGD("room", "Built %u room card(s)",
                   (unsigned) cards.size());
      - script.execute: refresh_room_cards

  # -- What a state poll changes, and the only thing it changes: the cards
  # -- themselves are not rebuilt, because nothing about their geometry moved.
  # -- Children are walked by index, which is the order rebuild_room_grid
  # -- created them in. --
  - id: refresh_room_cards
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          lv_obj_t *root = (lv_obj_t *) id(room_grid_root);
          const auto &cards = id(room_grid)->cards();
          uint32_t built = lv_obj_get_child_count(root);

          for (size_t i = 0; i < cards.size() && i < built; i++) {
            lv_obj_t *tile = lv_obj_get_child(root, (int32_t) i);
            const auto *entry = id(room_grid)->entry(cards[i].rid);

            // -- Three states and not two. A card whose element Home
            //    Assistant no longer carries, or whose entity is
            //    unavailable, must not read as "off": off is a fact and this
            //    is the absence of one.
            // --
            // -- What counts as "on" is the component's to answer, because a
            //    thermostat's state is a mode rather than the word "on" and
            //    card_reading has to agree with this line. --
            bool known = entry != nullptr &&
                         media_controller_grid::entry_is_known(*entry);
            bool on = known && media_controller_grid::entry_is_on(*entry);
            // -- A weather block and a sensor block wear their own sky
            //    rather than the off grey: they are information, not a
            //    switch left off. A weather block keeps the T560 sky border
            //    it was built with; a sensor keeps the dimmer one. --
            bool is_weather =
                entry != nullptr &&
                entry->domain == media_controller_grid::DOMAIN_WEATHER;
            bool reading =
                entry != nullptr &&
                media_controller_grid::entry_is_reading(*entry);

            lv_obj_set_style_border_color(
                tile,
                !known ? lv_color_hex(0x59303c)
                       : (on ? lv_color_hex(0x00cfff)
                             : (is_weather ? lv_color_hex(0x6fb3e8)
                                : (reading ? lv_color_hex(0x3d6a99)
                                           : lv_color_hex(0x505078)))),
                0);
            // -- An active card reads at a glance: a wider accent border on
            //    top of the colour, the way the four fixed buttons glow. --
            lv_obj_set_style_border_width(tile, on ? 3 : 2, 0);

            lv_obj_t *icon = lv_obj_get_child(tile, 0);
            if (icon != NULL) {
              lv_obj_set_style_img_recolor(icon, lv_color_hex(0x1a1a2c), 0);
              lv_obj_set_style_img_recolor_opa(icon, on ? LV_OPA_TRANSP : 150,
                                               0);
              lv_obj_set_style_img_opa(icon, known ? LV_OPA_COVER : 90, 0);
            }

            // -- The value line. Child 1 on every labelled card of a known
            //    domain and on a compact sensor or weather card; see the
            //    child order in media_controller_grid.h: the reading on a
            //    thermostat, sensor or cover card, ON/OFF on a light or
            //    switch card, and the hero temperature on a large weather
            //    card, with the condition line in child 2 beneath it.
            // --
            // -- The guard is "has this element ever been answered", not
            //    "is the new reading empty". Skipping an empty reading would
            //    leave a thermostat that was just switched off showing the
            //    setpoint it used to have; skipping until the first answer
            //    is what actually stops a card being blanked before the poll
            //    has said anything about it. --
            bool weather_large =
                is_weather &&
                media_controller_grid::card_is_labelled(cards[i]) &&
                !media_controller_grid::card_shows_compact(cards[i], entry);
            if (weather_large) {
              lv_obj_t *hero = lv_obj_get_child(tile, 1);
              lv_obj_t *sub = lv_obj_get_child(tile, 2);
              if (hero != NULL && entry != nullptr &&
                  !entry->state.empty()) {
                std::string hero_text =
                    media_controller_grid::weather_hero(*entry);
                // -- Written unconditionally, the way the reading is: an
                //    empty string keeps the hero blank until the state poll
                //    answers, and overwrites a stale one the moment it
                //    does. --
                lv_label_set_text(hero, hero_text.c_str());
              }
              if (sub != NULL && entry != nullptr &&
                  !entry->state.empty()) {
                lv_label_set_text(
                    sub,
                    media_controller_grid::weather_sub(*entry).c_str());
              }
            } else if (media_controller_grid::card_shows_reading(cards[i],
                                                                  entry) ||
                       media_controller_grid::card_shows_compact(cards[i],
                                                                 entry)) {
              lv_obj_t *reading = lv_obj_get_child(tile, 1);
              if (reading != NULL && !entry->state.empty()) {
                lv_label_set_text(
                    reading,
                    media_controller_grid::card_reading(*entry).c_str());
                // -- ON on a lamp, a socket or a blind draws in the accent;
                //    OFF stays in the dim reading grey. --
                if (entry->domain == media_controller_grid::DOMAIN_LIGHT ||
                    entry->domain == media_controller_grid::DOMAIN_SWITCH ||
                    entry->domain == media_controller_grid::DOMAIN_COVER) {
                  bool on_value =
                      media_controller_grid::entry_is_on(*entry);
                  lv_obj_set_style_text_color(
                      reading,
                      on_value ? lv_color_hex(0x00cfff)
                               : lv_color_hex(0x8f8fb4),
                      0);
                }
              }
            }

            // -- The coming days on a large weather card, children 3 and up
            //    (child 1 is the hero, child 2 the condition); see the child
            //    order in media_controller_grid.h. Written unconditionally,
            //    the way the reading is: an empty string keeps a row blank
            //    until its forecast poll answers, and overwrites a stale one
            //    the moment it does. --
            uint8_t forecast_rows =
                media_controller_grid::card_forecast_rows(cards[i], entry);
            for (uint8_t row = 0; row < forecast_rows; row++) {
              lv_obj_t *forecast = lv_obj_get_child(tile, 3 + (int32_t) row);
              if (forecast == NULL)
                break;
              std::string text;
              if (entry != nullptr && !entry->state.empty())
                text = media_controller_grid::forecast_text_colored(*entry,
                                                                     row);
              lv_label_set_text(forecast, text.c_str());
            }
          }

  # ════════════════════════════════════════════════════════════
  # THE ROOM LAYOUT BACKUP
  # ════════════════════════════════════════════════════════════
  # The grid lives on this device: it is edited here, in the page the grid
  # component serves, and Home Assistant has no opinion about it. What Home
  # Assistant has is somewhere durable to put a copy, which is the one thing
  # this device cannot provide for itself — erasing flash, or replacing the
  # board, loses the NVS blob. The panel_id is derived from the MAC, the same
  # one this device paired and reports with, so a reflashed device finds its
  # own copy again and no other device can read it.
  #
  # The body is the layout document, byte for byte. Home Assistant never
  # parses it: the grid format belongs to the client that draws it.

  - id: backup_room_layout
    mode: restart
    parameters:
      document: string
    then:
      - if:
          condition:
            lambda: return !id(ha_token).empty();
          then:
            - http_request.send:
                method: PUT
                url: !lambda |-
                  return "${ha_url}/api/media_controller/panel_layout/" +
                         get_mac_address();
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "text/plain"
                body: !lambda return document;
                capture_response: false

  # -- Asked for by the editor, answered on the main loop. An http_request on
  # -- ESP-IDF blocks it, so this cannot run inside the HTTP handler that was
  # -- asked; the component takes the request, answers "queued", and hears
  # -- the outcome here. --
  - id: restore_room_layout
    mode: restart
    then:
      - if:
          condition:
            lambda: return !id(ha_token).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return "${ha_url}/api/media_controller/panel_layout/" +
                         get_mac_address();
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                # -- The ceiling the backup endpoint itself enforces. --
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(room_grid)->restore_finished(true, body, "");
                        } else if (response->status_code == 404) {
                          id(room_grid)->restore_finished(
                              false, "",
                              "Home Assistant holds no copy of this layout.");
                        } else {
                          char buf[64];
                          snprintf(buf, sizeof(buf),
                                   "Home Assistant answered HTTP %d.",
                                   response->status_code);
                          id(room_grid)->restore_finished(false, "", buf);
                        }
                on_error:
                  then:
                    - lambda: |-
                        id(room_grid)->restore_finished(
                            false, "", "Home Assistant could not be reached.");
          else:
            - lambda: |-
                id(room_grid)->restore_finished(
                    false, "", "This device is not paired yet.");

  # -- Home Assistant cannot ask this device anything, so what it knows about
  # -- it is pushed. There is no battery to report; the integration expects an
  # -- absent one. --
  - id: report_status
    mode: restart
    then:
      - if:
          condition:
            lambda: return !id(ha_token).empty();
          then:
            - http_request.post:
                url: "${ha_url}/api/media_controller/panel_status"
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "application/json"
                # -- No battery and no signal strength: this device is mains
                # -- powered, and the importing configuration decides whether
                # -- it is on Wi-Fi or Ethernet at all, so the package cannot
                # -- declare a wifi_signal sensor. Both are optional in the
                # -- contract, and the report is what keeps
                # -- binary_sensor.<panel>_connected honest. --
                body: !lambda |-
                  char buf[96];
                  std::string json =
                    std::string("{\"panel_id\":\"") + get_mac_address() +
                    "\",\"version\":\"${firmware_version}\","
                    // -- The release number above says when this build
                    // -- shipped; this says what it understands, and is what
                    // -- lets Home Assistant notice a device running a build
                    // -- older than the contract it speaks. --
                    "\"contract_version\":${contract_version},"
                    "\"page\":\"" + id(current_page) + "\","
                    "\"uptime_seconds\":" +
                    std::to_string((unsigned) (millis() / 1000));
                  int rssi = isnan(id(wifi_signal_dbm).state)
                               ? -127 : (int) id(wifi_signal_dbm).state;
                  if (rssi != -127) {
                    snprintf(buf, sizeof(buf), ",\"wifi_dbm\":%d", rssi);
                    json += buf;
                  }
                  if (!isnan(id(esp32_temperature).state)) {
                    snprintf(buf, sizeof(buf), ",\"temperature_c\":%.1f",
                             id(esp32_temperature).state);
                    json += buf;
                  }
                  // -- Where the layout editor this device serves answers,
                  // -- so that Home Assistant can offer it on this device's
                  // -- panel page. The address is the device's own and
                  // -- nowhere else: the port belongs to the grid component
                  // -- and the routable interface is only known here. A
                  // -- device that has no address yet sends nothing. --
                  std::string editor = id(room_grid)->editor_url();
                  if (!editor.empty())
                    json += ",\"editor_url\":\"" + editor + "\"";
                  snprintf(buf, sizeof(buf),
                           ",\"display\":{\"available\":true,\"on\":%s,"
                           "\"brightness\":%d}}",
                           id(backlight).remote_values.is_on() ? "true"
                                                               : "false",
                           (int) (id(backlight).remote_values.get_brightness()
                                  * 100.0f));
                  json += buf;
                  id(last_report_page) = id(current_page);
                  return json;
                capture_response: false

# -------------------- THE POLL CYCLE --------------------
# ESPHome cannot retune an interval at runtime, so the tick is fixed and each
# job decides for itself whether enough time has passed. Home Assistant owns
# the two intervals; they arrive in the config sensor.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          uint32_t now = millis();

          if (id(ha_token).empty()) {
            // -- 404 means Home Assistant has never heard of this device, and
            //    that can last for days: an unopened box on a shelf must not
            //    poll every three seconds, because each request blocks the
            //    main loop and ESPHome logs every non-2xx answer as an error.
            //    Any other answer means somebody is adding it right now, so
            //    the fast rate comes straight back. The first two minutes are
            //    always fast, for the common case of flashing a device and
            //    adding it immediately. --
            uint32_t wait = 3000;
            if (id(last_pairing_status) == 404 && now > 120000) {
              wait = 15000;
            }
            if (id(last_pairing_poll_ms) == 0 ||
                now - id(last_pairing_poll_ms) >= wait) {
              id(last_pairing_poll_ms) = now;
              id(poll_pairing)->execute();
            }
            return;
          }

          if (now - id(last_poll_ms) >= id(poll_interval_ms)) {
            id(last_poll_ms) = now;
            id(ui_load_room_config)->execute();
            id(poll_player)->execute();
          }

          // -- Room states need no poll of their own: they ride the config
          //    poll above, in the room_states block, because the template
          //    endpoint they used to come through answers administrators
          //    only. --

          // -- The forecast behind the weather blocks: at once when there
          //    is something to ask for, then every half hour. The clock
          //    does not start until the component names an entity, so a
          //    page with no weather on it never pays for one. --
          if (!id(ha_token).empty() &&
              (id(last_forecast_poll_ms) == 0 ||
               now - id(last_forecast_poll_ms) >= 1800000)) {
            id(last_forecast_poll_ms) = now;
            id(poll_room_forecast)->execute();
          }

          // -- Fetch as soon as the config sensor has named the playlists
          //    entity, then on its own interval. The clock does not start
          //    until there is something to ask for, so a freshly paired
          //    device does not show an empty playlist page for a minute. --
          if (!id(playlists_entity).empty() &&
              (id(last_playlist_poll_ms) == 0 ||
               now - id(last_playlist_poll_ms) >=
                   id(playlist_poll_interval_ms))) {
            id(last_playlist_poll_ms) = now;
            id(poll_playlists)->execute();
          }

          if (id(last_report_page) != id(current_page) ||
              id(last_report_ms) == 0 || now - id(last_report_ms) >= 60000) {
            id(last_report_ms) = now;
            id(report_status)->execute();
          }

# -------------------- ROOM CARD ARTWORK --------------------
# The same four files the interface already draws at 128 px, decoded again at
# the size a grid card uses. A second asset rather than a scale: this build
# sets LV_COLOR_16_SWAP and leaves LV_DRAW_SW_SUPPORT_SWAPPED off, so LVGL
# cannot transform a swapped RGB565 source at all. Declared here so the
# classic firmware pays no flash for artwork it has no grid to draw.
image:
  - platform: file
    file: "${asset_base_url}/1lamp.png"
    id: card_icon_light1
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/2lamps.png"
    id: card_icon_light2
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/fan.png"
    id: card_icon_fan
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/ac.png"
    id: card_icon_ac
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/blind.png"
    id: card_icon_blind
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/weather.png"
    id: card_icon_weather
    resize: 40x40
    type: RGB
    transparency: alpha_channel

# -------------------- THE PAGES THIS FIRMWARE ADDS --------------------
# Appended to the pages the interface package defines; the classic firmware
# compiles neither. The room grid replaces the four fixed buttons on this
# variant, and the pairing screen is what a person sees before the device
# belongs to a Home Assistant.
lvgl:
  pages:
    # -- The room grid. Empty at compile time on purpose: what is on it comes
    # -- from the layout in flash and the registry in the config sensor, and
    # -- rebuild_room_grid is the only thing that puts anything here.
    # --
    # -- No heading and no hint. Eight rows of exactly 60 px need all 480, and
    # -- "tap to toggle | hold lights to dim" stops being true the moment the
    # -- person arranging the page decides what is on it. --
    - id: page_room_grid
      # -- Stated rather than assumed. A cell is exactly 60 px only if the
      # -- grid starts at the very top left of the screen, and a page that
      # -- inherited any padding would push all eight columns inwards and
      # -- clip the eighth. --
      pad_all: 0
      border_width: 0
      on_load:
        - lambda: id(current_page) = "room";
        - lambda: id(switches_swipe_active) = false;
      on_swipe_right:
        - lambda: id(switches_swipe_active) = true;
        - script.execute: nav_home_move_right
      on_swipe_left:
        - lambda: id(switches_swipe_active) = true;
        - script.execute: nav_home_move_left
      widgets:
        - obj:
            id: room_grid_root
            width: 480
            height: 480
            align: TOP_LEFT
            x: 0
            y: 0
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            clickable: false
            scrollable: false
            gesture_bubble: true

        - label:
            id: lbl_room_grid_empty
            text: "No room controls yet"
            text_font: roboto_22
            text_color: 0x77779a
            align: CENTER
            hidden: true

        - label:
            id: lbl_room_grid_hint
            text: "Add them to this device in Home Assistant"
            text_font: roboto_16
            text_color: 0x55556f
            align: CENTER
            y: 34
            hidden: true

    - id: page_pairing
      widgets:
        - label:
            text: "MEDIA CONTROLLER"
            text_font: roboto_16
            text_color: 0x5588cc
            align: TOP_MID
            y: 90

        - label:
            id: lbl_pairing_code
            text: "------"
            text_font: roboto_36
            text_color: 0xffffff
            align: CENTER
            y: -20

        - label:
            id: lbl_pairing_hint
            text: "Add this device in Home Assistant"
            text_font: roboto_16
            text_color: 0x77779A
            align: CENTER
            y: 60
