# Media Controller — paired ESP32-S3 firmware
#
# The half of the firmware that talks to Home Assistant; the half that draws is
# media-controller-ui.yaml. Nothing is configured in this file: the device
# advertises itself over mDNS, shows a six-digit code, and Home Assistant
# answers with a token and one entity ID. Everything
# else — which player, which queue sensor, which lamp is behind button 1 —
# arrives at runtime in the config sensor and is kept in flash.
#
# Changing a room control is therefore a Home Assistant action, not a reflash.
#
# It talks to Home Assistant over the REST API, polling once a second, exactly
# as the T560 panel does; see docs/CONTRACT.md. The ESPHome native API is still
# here, but only for what it was always good for: adoption, logs, over-the-air
# updates, and the theme and diagnostic entities. It carries no Home Assistant
# state any more.
#
# It also updates itself from Home Assistant, over the same token it uses for
# everything else. See "OVER-THE-AIR UPDATES" below: that is what lets a panel
# on a wall move to a newer build without a cable, and it is why the factory
# image no longer has to say it cannot.
#
# The interface lives in media-controller-ui.yaml and this file supplies the
# other half of the seam its header describes: everything about widgets is
# there, everything about reaching Home Assistant is here.

substitutions:
  device_name: media-controller
  friendly_name: Media Controller

  # Where Home Assistant is, baked in at compile time. It is a *bootstrap*
  # value, not the address the firmware uses: everything below reads the
  # ha_base global, which this fills in at boot whenever it is not empty.
  #
  # A device YAML that names an address therefore behaves exactly as it always
  # has — the compile-time value wins on every boot, so editing it and
  # reflashing still moves the device to another Home Assistant. A device YAML
  # that leaves it empty, which is what firmware/media-controller-factory.yaml
  # does, learns the address during pairing instead and keeps it in flash. Use
  # an IP address if .local names are unreliable on your network.
  ha_url: "http://homeassistant.local:8123"

  firmware_version: "0.6.18"

  # The version of docs/CONTRACT.md this firmware implements. firmware_version
  # says when this build shipped; this says what it understands, and it is the
  # only number worth comparing with the other side. The device sends it in
  # every status report and reads the integration's own out of the config
  # sensor, so each half can tell that the other is behind. Raise it in the
  # same change that raises the number in that document; it is not a knob to
  # turn per device.
  contract_version: "9"
  asset_base_url: "https://raw.githubusercontent.com/VahaC/ha-media-controller/main/firmware/assets"

  # Where the room-grid external component is fetched from. It is a
  # substitution for the same reason asset_base_url is one: a device pulls
  # this file by raw URL and has no checkout to point at, while a working
  # tree and CI have one and must validate the component in front of them
  # rather than the one already on main. Override it with a path relative to
  # the directory of the configuration being validated, for example
  # `../components`.
  grid_component_source: "github://VahaC/ha-media-controller@main"

# The interface — display, touchscreen, LVGL pages, theme — lives next to this
# file. See its header for the names the two halves agree on.
packages:
  ui: !include media-controller-ui.yaml

# The room grid and the editor this device serves for arranging it. It is an
# external component because two parts of it cannot be written as lambdas: a
# POD written to NVS through make_preference, and an AsyncWebHandler on
# web_server_base. It knows nothing about Home Assistant — everything that
# reaches it is installed into the component from this file, in on_boot
# below, and lands in a cmd_ script here. See components/media_controller_grid/.
external_components:
  - source: ${grid_component_source}
    components:
      - media_controller_grid
      - media_controller_provision
      - media_controller_push
      # -- A fork of the stock display driver, and only for one option it does
      # -- not offer: the size of the bounce buffer. See its header. --
      - st7701s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: media_controller.esp32s3_paired
    version: "${firmware_version}"
  on_boot:
    # -- Runs after the interface package's own on_boot, which builds the
    # -- theme and shows a home layout. An unpaired device is sent to the
    # -- pairing page from here instead. --
    priority: -200
    then:
      # -- The compile-time address wins whenever there is one: a device YAML
      # -- that names it is the authority on where Home Assistant is, and
      # -- editing it and reflashing has always been how a device is moved.
      # -- An empty substitution leaves whatever pairing stored. --
      - lambda: |-
          if (std::string("${ha_url}").size() > 0) {
            id(ha_base) = "${ha_url}";
          }
          while (!id(ha_base).empty() && id(ha_base).back() == '/') {
            id(ha_base).pop_back();
          }
          id(auth_header) = "Bearer " + id(ha_token);
      # -- The six things the grid component needs from this half of the
      # -- firmware. They are installed rather than compiled in so that the
      # -- component holds no URL, no token and no entity ID: the same seam
      # -- media-controller-ui.yaml describes, for the same reason. The two
      # -- newest are card artwork: one asks Home Assistant to store the name
      # -- and icon of a card, and one fetches a picture the component has
      # -- decided it wants. Neither builds a URL in the component. --
      - lambda: |-
          id(room_page_index) = (int) id(page_room_grid)->index;
          id(room_grid)->set_icon_preview_base(
              id(ha_base) + "/api/media_controller/icon-preview/");
          id(room_grid)->set_redraw_listener([]() {
            id(rebuild_room_grid)->execute();
          });
          id(room_grid)->set_backup_writer([](std::string document) {
            id(backup_room_layout)->execute(document);
          });
          id(room_grid)->set_restore_requester([]() {
            id(restore_room_layout)->execute();
          });
          id(room_grid)->set_skin_writer([](std::string skin) {
            id(cmd_skin_select)->execute(skin);
          });
          id(room_grid)->set_card_writer([](std::string body) {
            id(cmd_write_card)->execute(body);
          });
          id(room_grid)->set_icon_fetcher([](std::string icon) {
            id(fetch_room_icon)->execute(icon);
          });
          // -- The other direction. Both of these are handed a document that
          //    Home Assistant would otherwise have been asked for, and both
          //    reach the same parser the poll uses. They run on the main loop
          //    -- the component defers them off its HTTP task -- which is
          //    what makes publishing a sensor and drawing a widget from here
          //    safe. Stamping last_push_ms is how the poll cycle learns that
          //    this payload is being delivered and needs no asking for. --
          id(panel_push)->set_player_handler([](std::string payload) {
            id(last_push_ms) = millis();
            id(apply_player_payload)->execute(payload);
          });
          id(panel_push)->set_config_handler([](std::string payload) {
            id(last_push_ms) = millis();
            id(apply_config_payload)->execute(payload);
          });
      # -- What the provisioning endpoint does with an accepted bootstrap.
      # -- It holds no URL and no token of its own: it checks the code against
      # -- what is on screen and hands the three values back here. See
      # -- components/media_controller_provision/. --
      # --
      # -- The code and whether this device is paired are *pushed* into the
      # -- component instead, in show_start_page and accept_bootstrap, because
      # -- a request arrives on the HTTP task and those two live in globals
      # -- this loop owns. --
      - lambda: |-
          id(panel_provision)->set_apply_handler(
              [](media_controller_provision::ProvisionPayload payload) {
                id(accept_bootstrap)->execute(payload.ha_url, payload.token,
                                              payload.config_entity);
              });
      # -- Which of three boots this is, and it is decided from one value
      # -- in flash because nothing else survives an update.
      # --
      # -- update_target_version is written by install_firmware immediately
      # -- before the write starts. If this image is the one that was asked
      # -- for, the update worked and this build now has to prove itself
      # -- before the bootloader is told to keep it -- see verify_new_image
      # -- and confirm_boot. If it names some other version, this is the
      # -- *old* image running again: the bootloader rolled back, which is
      # -- the whole point of the mechanism, and the only thing left to do is
      # -- say so where somebody debugging a wall panel will find it. --
      - lambda: |-
          if (!id(update_target_version).empty()) {
            if (id(update_target_version) == "${firmware_version}") {
              id(update_proving) = true;
              id(update_proving_since_ms) = millis();
              ESP_LOGW("ota",
                       "Firmware ${firmware_version} is running for the first "
                       "time and has to reach Home Assistant before the "
                       "bootloader is told to keep it");
            } else {
              ESP_LOGE("ota",
                       "Firmware %s did not come back; the bootloader rolled "
                       "this device back to ${firmware_version}",
                       id(update_target_version).c_str());
              id(update_target_version) = "";
            }
          }
      - script.execute: sync_editor_skin
      - script.execute: rebuild_room_grid
      - script.execute: show_start_page

# -------------------- THERE IS NO ESPHome NATIVE API --------------------
# `api:` was here until contract version 9, and removing it is the whole point
# of that version rather than a tidy-up.
#
# What it cost while it was here was not the socket. It was that a panel
# appeared in the **ESPHome integration** in Home Assistant — as a discovered
# device asking to be adopted, and then as a second device carrying a dozen
# entities of its own beside the ones this contract already provides. A user
# had two places to look for one panel's backlight, and an installation had a
# dependency on an integration it did not otherwise need.
#
# Nothing here disables discovery by hand. `esphome/components/mdns` publishes
# `_esphomelib._tcp` only under `USE_API`, and `USE_API` is defined only when
# this key is present. No key, no record, and nothing for ESPHome's zeroconf
# discovery to find — the mechanism is absence rather than suppression, which
# is why it cannot come back by accident. What a panel does advertise is
# `_media-controller._tcp`, above, which is what this integration finds it by.
#
# Two things went with it, and both are honest losses:
#
#   * adoption in ESPHome Device Builder. A panel is installed from the web
#     installer and updated from Home Assistant instead — see "Updating" in
#     docs/ESP32_PAIRED_CONTROLLER.md;
#   * the log stream in the ESPHome dashboard. Logs come out of UART0 over the
#     USB-C port at 115200 baud, which is the same cable the device is flashed
#     with; `esphome logs` still works over serial.
#
# The twelve entities the API used to carry are not gone, only moved: the
# theme is `theme` in the config sensor and the diagnostics are `diagnostics`
# in the status report, so they are entities of the panel's own Home Assistant
# device now. See docs/CONTRACT.md.
#
# An owner of a package-based build who wants this device in the ESPHome
# dashboard anyway can add `api:` in **their own** device YAML, on top of this
# package. That is a deliberate opt-in with a consequence — the panel becomes
# discoverable by the ESPHome integration again — and it is not the default
# for anybody who has not asked for it.

# -------------------- OVER-THE-AIR UPDATES --------------------
# The factory image used to ship with no OTA at all, and that was a decision
# rather than an omission: ESPHome's own OTA needs a password, and a password
# compiled into a binary anybody can download from a public page is not a
# password. A shared one would let anyone on the network replace the firmware
# on every panel installed from that page.
#
# `platform: http_request` is a different thing entirely and needs no password,
# because it opens no port. It listens for nothing. It is a client: it fetches
# a URL when this firmware decides to, and this firmware decides to only when
# Home Assistant has put an `update` command in the config sensor -- a channel
# that already carries this device's own token. `platform: esphome`, which is
# the one with the password and the listening socket, stays out of this image.
#
# The image itself comes from Home Assistant and not from the internet. A
# panel on an isolated VLAN cannot reach GitHub, and a certificate bundle and
# TLS on the device to reach a public host would cost flash and add an attack
# surface for nothing. Home Assistant has both already: it downloads the
# release, checks its SHA-256, and serves the bytes it verified over the local
# network. What this device verifies is the MD5 of what it received, which is
# what ESPHome's update client checks and is the right question at this end --
# "did these bytes arrive intact", not "is this the right release".
#
# See start_firmware_update and install_firmware below for the two halves, and
# custom_components/media_controller/panel_firmware.py for the endpoints.
ota:
  - platform: http_request
    id: panel_ota
    on_progress:
      then:
        - lambda: |-
            // -- The only thing this device can still say while it writes,
            //    and it can only say it to the person standing in front of
            //    it: from the moment install_firmware calls the update
            //    client the main loop is inside it, so LVGL's refresh timer
            //    never runs and setting a widget would change nothing on the
            //    glass. lv_refr_now pushes the frame out by hand instead --
            //    the flush this display does is a copy into the framebuffer
            //    and returns, so it is safe to ask for from here.
            //
            //    Home Assistant is told none of this. It cannot be: the
            //    device answers no request at all until the write ends. See
            //    custom_components/media_controller/update.py, which shows
            //    the wait without a percentage for exactly that reason. --
            int percent = (int) x;
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            if (percent == id(update_progress_shown)) return;
            id(update_progress_shown) = percent;
            char text[8];
            snprintf(text, sizeof(text), "%d%%", percent);
            lv_bar_set_value(id(bar_update_progress), percent, LV_ANIM_OFF);
            lv_label_set_text(id(lbl_update_percent), text);
            lv_refr_now(NULL);
    on_error:
      then:
        - lambda: |-
            // -- Nothing was booted, so nothing is pending verification. The
            //    device is still on the build it was on, which is exactly
            //    what an update that failed its MD5 check should leave. --
            id(update_target_version) = "";
            id(update_url) = "";
            ESP_LOGE("ota", "Firmware update failed (code 0x%02X); this "
                            "device is unchanged", x);
            id(screen_keep_awake) = false;
        - script.execute: show_home_page

# -------------------- ROLLBACK --------------------
# A bad build on a panel screwed to a wall with no cable path is strictly
# worse than never updating it, so the bootloader is asked to keep the old
# image until this one has proved itself. That is `enable_ota_rollback`, which
# ESPHome turns on by default for esp-idf and which needs safe_mode to be
# enabled -- it is, because the `ota` component above auto-loads it. It is
# declared explicitly here anyway, because the two values that matter are
# **not** the defaults:
#
#   * boot_is_good_on_shutdown: false. An orderly restart is not evidence.
#     With the default, a panel that came up on a new image and was restarted
#     from Home Assistant before it had reached anything would mark that image
#     valid on the way down, and the rollback would be gone;
#   * boot_is_good_after: 15min, which is only a backstop. What actually
#     confirms an image is confirm_boot below, and it asks for more than
#     "the loop is still running": the device has to have re-read its config
#     sensor and had a status report accepted. The backstop is longer than the
#     proof window in verify_new_image so that it cannot confirm an image that
#     window is about to roll back.
#
# The one failure the bootloader cannot see on its own is a build that boots
# and runs but can never reach Home Assistant again: nothing resets, so
# nothing rolls back. verify_new_image is that half -- it reboots deliberately,
# and the reboot is what hands the decision back to the bootloader.
safe_mode:
  boot_is_good_after: 15min
  boot_is_good_on_shutdown: false

# -------------------- THE LAYOUT EDITOR --------------------
# One TCP listen socket and no UI on top of it: the only thing served here is
# the layout editor, and web_server would add an entity dashboard nobody asked
# for. On ESP32 web_server_base autoloads web_server_idf.
#
# There is no authentication, deliberately, and the eight routes are narrow
# enough that this is a decision rather than an oversight. See the header of
# components/media_controller_grid/media_controller_grid.h, and the warning in
# docs/ESP32_PAIRED_CONTROLLER.md about not exposing this port outside the
# house.
web_server_base:

# -------------------- PROVISIONING --------------------
# The other direction of pairing. A device flashed with an address polls Home
# Assistant for its token, in poll_pairing below; a device flashed from the
# factory image knows no address and cannot, so Home Assistant posts the
# bootstrap here instead once somebody has typed the six digits on screen.
#
# A paired device whose token was revoked is re-paired the same way, without
# the poll having to guess whether Home Assistant has moved.
#
# It shares the listener with the layout editor, so this adds no port. What
# guards it — unpaired only, five attempts, a constant-time compare and hard
# limits on every field — is in the component's own header.
media_controller_provision:
  id: panel_provision
  port: 80
  profile: esp32_s3_panel
  panel_name: ${friendly_name}
  contract_version: ${contract_version}
  version: "${firmware_version}"

# -------------------- WHERE HOME ASSISTANT PUSHES --------------------
# The player and the config sensor used to be asked for once a second each.
# They are posted here instead, and the polls below are what catches whatever a
# push missed. See components/media_controller_push/ for why an RGB panel
# cannot afford a synchronous request twice a second, and docs/CONTRACT.md for
# the two routes.
media_controller_push:
  id: panel_push
  port: 80

media_controller_grid:
  id: room_grid
  port: 80
  # The layouts the interface draws, in the spelling docs/CONTRACT.md uses.
  # The editor offers exactly these and the component refuses anything else
  # before it is passed on, so this route cannot write an arbitrary value into
  # an arbitrary entity.
  skins:
    - classic
    - minimal_ring
    - cover_card

# -------------------- DISCOVERY --------------------
# What makes Home Assistant offer to add this device. The integration reads
# these three records in async_step_zeroconf. The service type is shared with
# the T560 panel on purpose: the profile travels as a record rather than as a
# service type of its own.
#
# Port 80, unlike the T560 panel's record, which is port 0 because a tablet
# serves nothing. This device does: the layout editor and the provisioning
# endpoint are both on it, and a non-zero port is what tells Home Assistant it
# can post the bootstrap here rather than wait to be polled.
mdns:
  services:
    - service: _media-controller
      protocol: _tcp
      port: 80
      txt:
        panel_id: !lambda return get_mac_address();
        profile: esp32_s3_panel
        name: ${friendly_name}

sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    internal: true
    update_interval: 60s

  - platform: internal_temperature
    id: esp32_temperature
    internal: true
    update_interval: 60s

  # -------------------- PLAYER STATE --------------------
  # The interface reads thirteen ids and does not care where they came from.
  # The poll cycle publishes them, out of what it read over REST.
  #
  # Every one is published only when it actually changed, because a template
  # entity fires on_value on every publish and a once-a-second poll would
  # otherwise redraw the whole screen once a second.
  - platform: template
    id: volume_level
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_volume

  - platform: template
    id: media_duration
    internal: true
    update_interval: never

  - platform: template
    id: media_position
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_progress

text_sensor:
  - platform: template
    id: media_title
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_title
        # The integration refreshes the queue three seconds after a title
        # change. Fetch after that debounce so the device does not read stale
        # data — and only while the queue is the page being looked at. A
        # track that changes behind another page is picked up by the fetch
        # page_queue makes when it opens.
        - delay: 4s
        - if:
            condition:
              lambda: return id(current_page) == "queue";
            then:
              - script.execute: refresh_queue

  - platform: template
    id: media_artist
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_artist

  # -- Album art path, relative to ha_url. "None" when there is none. --
  - platform: template
    id: entity_picture
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            if (x == "None" || x.empty()) {
              ESP_LOGD("img", "No album art available, skipping");
              return;
            }
            std::string full_url = id(ha_base) + x;
            ESP_LOGD("img", "Loading art: %s", full_url.c_str());
            id(album_art).set_url(full_url.c_str());
            id(album_art_small).set_url(full_url.c_str());
        - script.execute: ui_load_album_art

  - platform: template
    id: player_state
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: id(screen_last_active_ms) = millis();
        - script.execute: ui_sync_play_state

  - platform: template
    id: shuffle_state
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_shuffle

  - platform: template
    id: repeat_state
    internal: true
    update_interval: never
    on_value:
      then:
        - script.execute: ui_sync_repeat

# -------------------- SWITCHES PAGE STATE --------------------
# One per room slot, in slot order. Which entity feeds each is decided at
# runtime, so a slot may hold a light or a switch without a reflash.
binary_sensor:
  - platform: template
    id: light1_state
    internal: true
    on_state:
      then:
        - script.execute: apply_light1_style

  - platform: template
    id: light2_state
    internal: true
    on_state:
      then:
        - script.execute: apply_light2_style

  - platform: template
    id: fan_switch_state
    internal: true
    on_state:
      then:
        - script.execute: apply_fan_style

  - platform: template
    id: ac_switch_state
    internal: true
    on_state:
      then:
        - script.execute: apply_ac_style

globals:
  # ════════════════════════════════════════════════════════════
  # WHAT HOME ASSISTANT TOLD THIS DEVICE
  # ════════════════════════════════════════════════════════════
  # All of it survives a reboot, so a device that starts while Home Assistant
  # is down still knows what to ask for once it comes back, and a restart
  # never sends anybody back to the pairing screen.

  # -- The icon catalog is asked for rarely: it changes when the
  # -- integration is upgraded and never otherwise, and a device that polls
  # -- it like the config sensor would spend a request a second on hundreds of
  # -- names. Zero means "never fetched", which is what makes the first
  # -- poll after a boot ask for it. --
  - id: last_catalog_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # -- Retry quickly until the first usable catalog arrives. Once it does,
  # -- the interval becomes six hours because the catalog changes only with
  # -- an integration update. --
  - id: catalog_poll_interval_ms
    type: uint32_t
    restore_value: false
    initial_value: '60000'

  # -- The picture currently being downloaded, so that the answer can be
  # -- filed under the identifier that was asked for. One at a time: each is
  # -- six kilobytes through a request that blocks the main loop. --
  - id: fetching_icon
    type: std::string
    restore_value: false

  # -- Where Home Assistant is. Filled in from the ha_url substitution at
  # -- boot when that names an address, and otherwise by pairing: a factory
  # -- image carries no address at all, and the integration hands this over
  # -- together with the token. It survives a reboot for the same reason the
  # -- token does — a device that starts while Home Assistant is down still
  # -- knows where to ask once it comes back. Never ends in a slash; on_boot
  # -- trims one, because every site below appends a path beginning with one.
  - id: ha_base
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  # -- The access token, minted by the integration and handed over once. A
  # -- Home Assistant long-lived token is an HS256 JWT of about 180
  # -- characters; 254 is the most a restoring string global can hold. --
  - id: ha_token
    type: std::string
    restore_value: true
    max_restore_data_length: 254

  # -- "Bearer " + the token. A request header is rendered as const char *, so
  # -- the value has to outlive the call: a temporary built inside the header
  # -- lambda would dangle. --
  - id: auth_header
    type: std::string
    restore_value: false

  # -- What a push has to carry to be listened to. Minted on this device
  # -- rather than handed down, so that it is one secret this pair shares and
  # -- not a second life for the Home Assistant token: that token stays here
  # -- and is readable through no route at all. It is reported in the status
  # -- report, which is how Home Assistant learns it, and it survives reboots
  # -- so that a restart does not silently stop every push until the next
  # -- report goes out. Cleared with the token, because a device that is no
  # -- longer paired accepts nothing. --
  - id: push_key
    type: std::string
    restore_value: true
    max_restore_data_length: 40

  # -- A fingerprint of the last payload each parser was handed, so that an
  # -- identical one can be dropped without being read.
  # --
  # -- This is the measurement acting on itself: a delivery costs about 48 ms
  # -- of parsing and publishing, against 31 ms for the request that carried
  # -- it, and the overwhelming majority of deliveries say exactly what the
  # -- last one said. Home Assistant pushes on every state change of the
  # -- config sensor, and that sensor moves whenever any room entity does --
  # -- so the same thirteen kilobytes arrive again and again, are read from
  # -- end to end, and change nothing. On a device whose display is refreshed
  # -- out of PSRAM by the processor itself, those milliseconds are a picture
  # -- that visibly jumps.
  # --
  # -- A 64-bit FNV-1a with the length beside it, rather than a copy: keeping
  # -- the document would cost thirteen kilobytes of internal heap for the
  # -- life of the device to save a comparison that a hash does in one pass.
  # -- A collision would skip one update, and the next delivery -- a push
  # -- within seconds, or the fallback poll within thirty -- corrects it.
  - id: last_player_digest
    type: uint64_t
    restore_value: false
    initial_value: "0"

  - id: last_config_digest
    type: uint64_t
    restore_value: false
    initial_value: "0"

  # -- The longest single payload application since the last status report:
  # -- the parse, plus every publish_state it makes and every widget update
  # -- those fire, because all of that runs inside the script and none of it
  # -- can be told apart from the outside.
  # --
  # -- It is the other half of http_ms, and the pair is the whole point. A
  # -- poll cycle is a transfer and then a reading of what was transferred,
  # -- and until both are measured, "the poll is expensive" names no part of
  # -- it. What is left over -- loop_time minus these two -- is LVGL actually
  # -- rendering, which happens in its own component afterwards. Three
  # -- numbers, three suspects, and no argument about which it is. --
  - id: parse_max_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: parse_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The longest single HTTP exchange since the last status report, in
  # -- milliseconds, straight out of the container http_request fills in.
  # -- A maximum rather than an average and reset when reported, exactly like
  # -- loop_time beside it: what matters is the one request that took two
  # -- seconds, and an average over a minute of them hides it.
  # --
  # -- It exists to answer a question the loop time cannot: a long loop says
  # -- something blocked, this says whether the something was the network.
  # -- The two together separate a slow Home Assistant, a name that resolves
  # -- slowly and a device that is busy with its own work. --
  - id: http_max_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The last time a push was accepted. The polls read it: a payload that
  # -- Home Assistant is delivering does not need asking for, and one that has
  # -- stopped arriving does. --
  - id: last_push_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The one entity Home Assistant names during pairing. Everything else is
  # -- read out of it. --
  - id: config_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  - id: player_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  - id: queue_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  - id: playlists_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  # -- The one entity in the payload this device *writes*: the Player Skin
  # -- select on its own Home Assistant device. Home Assistant stays the owner
  # -- of the value; the on-device picker writes here and the new skin arrives
  # -- back the ordinary way, in settings.player_skin. Absent when the
  # -- integration named none, which greys the picker in the editor. --
  - id: skin_select_entity
    type: std::string
    restore_value: true
    max_restore_data_length: 128

  # -- The room registry itself is **not** a global. Sixty-four elements with
  # -- Cyrillic names are far past the 254 bytes a restoring string global can
  # -- hold, and the grid that arranges them is a POD in its own NVS blob; see
  # -- components/media_controller_grid/. What survives a reboot there is the
  # -- arrangement, which is the user's own work. The registry is Home
  # -- Assistant's and comes back with the first poll.

  # -- The body of one weather.get_forecasts request, built the same way:
  # -- the poll asks the component whether a weather card is drawn, and only
  # -- then sends it. --
  - id: pending_forecast_body
    type: std::string
    restore_value: false

  # -- Set while a long press is sweeping a card's brightness, so the release
  # -- that ends it does not also toggle the light. The four fixed buttons of
  # -- the interface keep one of these per button; the grid has one, because
  # -- only one card can be under a finger. --
  - id: room_card_long_active
    type: bool
    restore_value: false
    initial_value: "false"

  # -- Whether that long press actually moved a thermostat's setpoint, which
  # -- is a different question: a press held just past the long-press
  # -- threshold and released before the first repeat has swept nothing, and
  # -- the release must not then write the thermostat's own value back to it.
  # -- One is enough for the same reason as above. --
  - id: room_card_swept
    type: bool
    restore_value: false
    initial_value: "false"

  # -- Checksum of the layout. Equal values mean there is nothing to lay out
  # -- again, which is what keeps a once-a-second poll cheap. --
  - id: config_revision
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The parts of the last config payload the actions after the parse still
  # -- need. Held rather than re-extracted: the payload is scanned once, and
  # -- nothing downstream has to reach back into the response it came from. --
  - id: pending_attributes
    type: std::string
    restore_value: false

  - id: pending_commands
    type: std::string
    restore_value: false

  - id: layout_changed
    type: bool
    restore_value: false
    initial_value: "false"

  # ════════════════════════════════════════════════════════════
  # PAIRING
  # ════════════════════════════════════════════════════════════
  # The code is generated once and kept, so a watchdog reboot does not change
  # the digits somebody is halfway through typing.
  - id: pairing_code
    type: std::string
    restore_value: true
    max_restore_data_length: 16

  - id: pairing_hint
    type: std::string
    restore_value: false

  # ════════════════════════════════════════════════════════════
  # COMMAND WATERMARKS
  # ════════════════════════════════════════════════════════════
  # A command is applied only when its timestamp is newer than the last one
  # acted on. They are restored for the reason the contract spells out: a
  # restart command that was not remembered would run again on every boot.
  - id: last_display_at
    type: double
    restore_value: true
    initial_value: "0"

  - id: last_brightness_at
    type: double
    restore_value: true
    initial_value: "0"

  - id: last_restart_at
    type: double
    restore_value: true
    initial_value: "0"

  - id: last_page_at
    type: double
    restore_value: true
    initial_value: "0"

  # -- What the parse decided, for the actions that follow it. A lambda cannot
  # -- turn a backlight on; only an action can. --
  - id: want_display
    type: int
    restore_value: false
    initial_value: "0"

  - id: want_brightness
    type: int
    restore_value: false
    initial_value: "-1"

  - id: want_restart
    type: bool
    restore_value: false
    initial_value: "false"

  - id: want_page
    type: std::string
    restore_value: false

  # ════════════════════════════════════════════════════════════
  # FIRMWARE UPDATES
  # ════════════════════════════════════════════════════════════
  # The version Home Assistant last asked for, from the `update` command. It
  # is a *request*, not a fact: nothing is downloaded until the manifest call
  # in start_firmware_update has confirmed the same version over a request
  # that carried this device's token.
  - id: last_update_at
    type: double
    restore_value: true
    initial_value: "0"

  - id: want_update_version
    type: std::string
    restore_value: false

  # -- What the manifest answered. The URL is built here, from this device's
  # -- own ha_base and a path Home Assistant returned, so no address ever
  # -- arrives from anywhere else. --
  - id: update_url
    type: std::string
    restore_value: false

  - id: update_md5
    type: std::string
    restore_value: false

  # -- A manifest call that answers "not yet" must not become a request per
  # -- second for as long as the request stands. Home Assistant fetches and
  # -- verifies the image before it asks for anything, so the usual answer is
  # -- the first one; these two exist for the case where it is not. --
  - id: update_next_try_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: update_attempts
    type: int
    restore_value: false
    initial_value: "0"

  # -- The last whole percent painted on the updating screen. The update
  # -- client hands over a percentage about once a second and every repaint
  # -- during a write is a repaint done by hand, so a value that has not
  # -- moved is not drawn again. -1 is "nothing painted yet", which is what
  # -- makes the first 0% reach the glass. --
  - id: update_progress_shown
    type: int
    restore_value: false
    initial_value: "-1"

  # -- The version this device is being moved to, written to flash before the
  # -- write starts so that the *next* boot can tell which of two things
  # -- happened. It survives the update because an application OTA writes the
  # -- app partition only and leaves NVS alone -- the same reason Wi-Fi, the
  # -- token and the room layout survive.
  # --
  # -- Empty on an ordinary boot. Equal to this build's own version means the
  # -- update worked and this image now has to prove itself. Anything else
  # -- means the bootloader rolled back and we are the old image again. --
  - id: update_target_version
    type: std::string
    restore_value: true
    max_restore_data_length: 32

  # -- Set on the first boot after an update, cleared the moment the image is
  # -- confirmed. While it is set, verify_new_image is counting. --
  - id: update_proving
    type: bool
    restore_value: false
    initial_value: "false"

  - id: update_proving_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- Whether this boot has read a usable config sensor, and whether a status
  # -- report has been accepted. Both together are what confirm_boot calls
  # -- "this build works", and neither alone would do: a device can poll a
  # -- config sensor it cannot report to, and a report can be accepted before
  # -- the payload that drives the whole interface has ever parsed. --
  - id: config_seen
    type: bool
    restore_value: false
    initial_value: "false"

  - id: boot_confirmed
    type: bool
    restore_value: false
    initial_value: "false"

  # ════════════════════════════════════════════════════════════
  # POLL BOOKKEEPING
  # ════════════════════════════════════════════════════════════
  # None of this is restored: it changes constantly, and a restoring global
  # writes to flash whenever it does.
  - id: poll_interval_ms
    type: uint32_t
    restore_value: false
    initial_value: "1000"

  - id: playlist_poll_interval_ms
    type: uint32_t
    restore_value: false
    initial_value: "60000"

  - id: last_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The player has a clock of its own so that it and the config sensor can
  # -- fall on different ticks. They used to share one, which put two blocking
  # -- requests in the same iteration of the main loop; see the poll cycle. --
  - id: last_player_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The skin the last payload named, handed to the interface after the
  # -- payload has been parsed rather than in the middle of parsing it. --
  - id: pending_skin
    type: std::string
    restore_value: false
  - id: pending_rotation
    type: std::string
    restore_value: false

  # -- Set while parsing when the theme block moved a value, so that
  # -- apply_theme runs once after the payload rather than up to twelve times
  # -- inside it. A lambda cannot call a script; only an action can. --
  - id: theme_changed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_playlist_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The forecast moves slowly: one request every half hour, on top of the
  # -- first one as soon as a weather card is drawn. An http_request blocks
  # -- the main loop, so this never runs oftener no matter how many weather
  # -- blocks a page holds. --
  - id: last_forecast_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_pairing_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # -- The last answer the provisioning endpoint gave. Two jobs: it keeps the
  # -- log to one line per change instead of one per poll, and it decides how
  # -- often to ask again. --
  - id: last_pairing_status
    type: int
    restore_value: false
    initial_value: "0"

  - id: last_report_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_report_page
    type: std::string
    restore_value: false
    initial_value: '""'

  # -- The position Home Assistant last reported, as opposed to the one the
  # -- interface advances locally every second. Home Assistant's number does
  # -- not move on its own, so publishing it back on every poll would undo
  # -- that advance. Only a change on their side is a re-sync. --
  - id: last_polled_position
    type: float
    restore_value: false
    initial_value: "-1"

  # -- The stamp Home Assistant puts on that position
  # -- (media_position_updated_at). It is rewritten on every seek, resume and
  # -- track change, and it is the one signal that says the locally advanced
  # -- position is stale and has to be taken from Home Assistant again. --
  - id: last_position_stamp
    type: std::string
    restore_value: false
    initial_value: '""'

  # ════════════════════════════════════════════════════════════
  # PARSERS
  # ════════════════════════════════════════════════════════════
  # There is no JSON library on the device. These walk the payload by hand, in
  # the same style as the playlist and slot-label parsers in the interface
  # package, and they are deliberately forgiving: a field that is missing or
  # malformed reads as empty rather than as an error.
  #
  # Each one is self-contained. A global's initial_value is emitted as a raw
  # C++ expression and is not a lambda ESPHome rewrites, so `id(...)` does not
  # work in here and one parser cannot call another.

  # -- Whether this payload says anything the last one did not, and the
  # -- remembering of it. A 64-bit FNV-1a over the bytes, with the length
  # -- folded in so that a collision would have to agree on the size too.
  # -- Zero is the "nothing seen yet" digest and never matches, so the first
  # -- delivery after a boot is always read. --
  - id: payload_digest_moved
    type: bool (*)(const std::string &, uint64_t &)
    restore_value: no
    initial_value: |-
      [](const std::string &payload, uint64_t &seen) -> bool {
        uint64_t h = 1469598103934665603ULL;
        for (unsigned char c : payload) {
          h ^= c;
          h *= 1099511628211ULL;
        }
        h ^= (uint64_t) payload.size() << 32;
        if (h != 0 && h == seen) return false;
        seen = h;
        return true;
      }

  # -- One field of an object, as text. A quoted value is unescaped; a bare
  # -- value (number, true, false, null) comes back as it was written, which
  # -- is what lets the same function read both "repeat":"all" and
  # -- "shuffle":false. --
  - id: json_field
    type: std::string (*)(const std::string &, const char *)
    restore_value: no
    initial_value: |-
      [](const std::string &body, const char *key) -> std::string {
        std::string needle = std::string("\"") + key + "\"";
        size_t p = body.find(needle);
        if (p == std::string::npos) return std::string();
        p = body.find(':', p + needle.size());
        if (p == std::string::npos) return std::string();
        p++;
        while (p < body.size() && isspace((unsigned char) body[p])) p++;
        if (p >= body.size()) return std::string();

        if (body[p] != '"') {
          size_t e = p;
          while (e < body.size() && body[e] != ',' &&
                 body[e] != '}' && body[e] != ']') e++;
          std::string raw = body.substr(p, e - p);
          while (!raw.empty() &&
                 isspace((unsigned char) raw[raw.size() - 1])) {
            raw.erase(raw.size() - 1);
          }
          return raw;
        }

        p++;
        std::string out;
        while (p < body.size()) {
          char c = body[p];
          if (c == '\\' && p + 1 < body.size()) {
            char n = body[p + 1];
            if (n == 'n') out += '\n';
            else if (n == 't') out += '\t';
            else if (n == 'u') { p += 6; continue; }
            else out += n;
            p += 2;
            continue;
          }
          if (c == '"') break;
          out += c;
          p++;
        }
        return out;
      }

  # -- One nested object, so a field can be looked up inside it rather than
  # -- anywhere in the payload. Reading "state" out of a whole media player
  # -- response would be a coin toss; reading it out of the top level and
  # -- "media_title" out of "attributes" is not. --
  - id: json_object
    type: std::string (*)(const std::string &, const char *)
    restore_value: no
    initial_value: |-
      [](const std::string &body, const char *key) -> std::string {
        std::string needle = std::string("\"") + key + "\"";
        size_t p = body.find(needle);
        if (p == std::string::npos) return std::string();
        p = body.find('{', p + needle.size());
        if (p == std::string::npos) return std::string();

        int depth = 0;
        for (size_t i = p; i < body.size(); i++) {
          char c = body[i];
          if (c == '"') {
            i++;
            while (i < body.size()) {
              if (body[i] == '\\') i++;
              else if (body[i] == '"') break;
              i++;
            }
            continue;
          }
          if (c == '{') depth++;
          else if (c == '}') {
            depth--;
            if (depth == 0) return body.substr(p, i - p + 1);
          }
        }
        return std::string();
      }

# Keep the editor synchronized with both restored and remotely selected styles.
select:
  - id: !extend screen_rotation
    internal: true
  - id: !extend screen_style
    on_value:
      then:
        - script.execute: sync_editor_skin

script:
  # ════════════════════════════════════════════════════════════
  # COMMANDS
  # ════════════════════════════════════════════════════════════
  # The other half of the seam described in media-controller-ui.yaml: the
  # cmd_ scripts a widget calls. Each is a POST to the REST API, addressed to
  # an entity read out of flash rather than out of a substitution.

  - id: ha_action
    mode: parallel
    max_runs: 6
    parameters:
      domain: string
      service: string
      payload: string
    then:
      - if:
          condition:
            lambda: return id(ha_token).empty();
          then:
            - logger.log: "Not paired; the action was dropped"
          else:
            - http_request.post:
                url: !lambda |-
                  return id(ha_base) + "/api/services/" + domain + "/" + service;
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "application/json"
                body: !lambda return payload;
                capture_response: false

  - id: cmd_prev
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "media_previous_track"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_play_pause
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "media_play_pause"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_next
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "media_next_track"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_volume_down
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "volume_down"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  - id: cmd_volume_up
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "volume_up"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) + "\"}";

  # -- The slider reports 0-100; Home Assistant wants 0.00-1.00. --
  - id: cmd_volume_set
    mode: parallel
    max_runs: 4
    parameters:
      level: int
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "volume_set"
          payload: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.2f", level / 100.0f);
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"volume_level\":" + buf + "}";

  - id: cmd_shuffle_set
    mode: parallel
    max_runs: 4
    parameters:
      state: string
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "shuffle_set"
          payload: !lambda |-
            std::string on = (state == "on") ? "true" : "false";
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"shuffle\":" + on + "}";

  - id: cmd_repeat_set
    mode: parallel
    max_runs: 4
    parameters:
      mode: string
    then:
      - script.execute:
          id: ha_action
          domain: "media_player"
          service: "repeat_set"
          payload: !lambda |-
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"repeat\":\"" + mode + "\"}";

  # -- The playlist roller holds the selection; only the index travels. --
  - id: cmd_play_playlist
    mode: parallel
    max_runs: 4
    then:
      - script.execute:
          id: ha_action
          domain: "music_assistant"
          service: "play_media"
          payload: !lambda |-
            int idx = id(selected_playlist_idx);
            std::string uri;
            if (idx >= 0 && idx < (int) id(playlist_uris).size()) {
              uri = id(playlist_uris)[idx];
            }
            return "{\"entity_id\":\"" + id(player_entity) +
                   "\",\"media_id\":\"" + uri +
                   "\",\"media_type\":\"playlist\"}";

  # -- A card is addressed by its entity, which the grid component resolved
  # -- from the rid the card stores. The call goes through `homeassistant`
  # -- rather than the domain in front of the dot, the way the T560 panel
  # -- does: it toggles a lamp, a socket, a thermostat and a blind alike,
  # -- and deriving the domain would refuse exactly the thermostats whose
  # -- toggle lives there. This is the whole point of the paired firmware:
  # -- nothing here is decided at compile time. --
  - id: cmd_entity_toggle
    mode: parallel
    max_runs: 4
    parameters:
      entity: string
    then:
      - lambda: |-
          if (entity.find('.') == std::string::npos) return;
          id(ha_action)->execute(
              std::string("homeassistant"), std::string("toggle"),
              "{\"entity_id\":\"" + entity + "\"}");
      # -- The states ride the config poll, which runs every second anyway.
      # -- A card the person just pressed must not wait for that, so read
      # -- the config again once Home Assistant has had time to act. --
      - delay: 400ms
      - script.execute: ui_load_room_config

  # -- Only a light can be dimmed. A switch simply ignores the long press. --
  - id: cmd_entity_brightness
    mode: parallel
    max_runs: 4
    parameters:
      entity: string
      pct: int
    then:
      - lambda: |-
          if (entity.rfind("light.", 0) != 0) return;
          char buf[8];
          snprintf(buf, sizeof(buf), "%d", pct);
          id(ha_action)->execute(
              std::string("light"), std::string("turn_on"),
              "{\"entity_id\":\"" + entity +
              "\",\"brightness_pct\":" + buf + "}");

  # -- A thermostat's setpoint, contract version 7.
  # --
  # -- Called **once**, when the finger comes off, and never per sweep tick.
  # -- A brightness sweep can afford a call per tick because a lamp answers
  # -- on mains wiring; a thermostat is very often a battery radiator valve
  # -- on Zigbee or Z-Wave, and ten calls a second to one would flood a mesh
  # -- with values nobody has finished choosing. The value swept during the
  # -- press is local to the grid component and only this sends it. --
  - id: cmd_entity_set_temperature
    mode: parallel
    max_runs: 4
    parameters:
      entity: string
      value: float
    then:
      - lambda: |-
          if (entity.rfind("climate.", 0) != 0) return;
          char buf[16];
          snprintf(buf, sizeof(buf), "%.1f", value);
          id(ha_action)->execute(
              std::string("climate"), std::string("set_temperature"),
              "{\"entity_id\":\"" + entity +
              "\",\"temperature\":" + buf + "}");
      # -- Same reason as a toggle: the card must not wait for the next
      # -- config poll to show what the person just asked for. --
      - delay: 400ms
      - script.execute: ui_load_room_config

  # Translate the local display labels to the identifiers offered by /api/skins.
  - id: sync_editor_skin
    then:
      - lambda: |-
          const auto &option = id(screen_style).current_option();
          if (option == "Classic") id(room_grid)->set_skin("classic");
          else if (option == "Minimal Ring") id(room_grid)->set_skin("minimal_ring");
          else if (option == "Cover Card") id(room_grid)->set_skin("cover_card");

  # -- The one entity in the payload this device writes. Home Assistant owns
  # -- the value: this asks for a skin and changes nothing locally, and the
  # -- new one arrives back the ordinary way, in settings.player_skin. The
  # -- name was already checked against the skins this build draws before it
  # -- got here, so this route cannot write an arbitrary value. --
  - id: cmd_skin_select
    mode: restart
    parameters:
      skin: string
    then:
      - if:
          condition:
            lambda: return !id(skin_select_entity).empty();
          then:
            - script.execute:
                id: ha_action
                domain: "select"
                service: "select_option"
                payload: !lambda |-
                  return "{\"entity_id\":\"" + id(skin_select_entity) +
                         "\",\"option\":\"" + skin + "\"}";
          else:
            - logger.log: "Home Assistant named no skin entity for this device"

  # -- The four fixed room buttons the interface package draws. Nothing shows
  # -- that page: a panel has been sent no `slots` block since contract
  # -- version 6, and version 9 removed the block from the contract
  # -- altogether, so there is no entity behind a slot number and
  # -- room_page_index points at the grid instead. The scripts stay because
  # -- the interface package names them, and taking the page out means
  # -- rearranging LVGL pages that work; see docs/ROADMAP.md. --
  - id: cmd_slot_toggle
    parameters:
      slot: int
    then:
      - logger.log:
          format: "Slot %d is not used by this firmware; the room grid is"
          args: [slot]
          level: DEBUG

  - id: cmd_slot_brightness
    parameters:
      slot: int
      pct: int
    then:
      - logger.log:
          format: "Slot %d is not used by this firmware; the room grid is"
          args: [slot]
          level: DEBUG

  - id: play_queue_item
    then:
      - lambda: |-
          int idx = id(selected_queue_idx);
          std::string item;
          if (idx >= 0 && idx < (int) id(queue_id_list).size()) {
            item = id(queue_id_list)[idx];
            ESP_LOGD("queue", "Playing queue item: %s", item.c_str());
          }
          id(ha_action)->execute(
              std::string("media_controller"),
              std::string("play_queue_item"),
              "{\"entity_id\":\"" + id(player_entity) +
              "\",\"queue_item_id\":\"" + item + "\"}");
      - script.execute: show_home_page

  # ════════════════════════════════════════════════════════════
  # PAIRING
  # ════════════════════════════════════════════════════════════

  # -- An unpaired device shows its code; a paired one goes straight to the
  # -- interface, which the shared package has already put on screen. --
  - id: show_start_page
    then:
      - if:
          condition:
            lambda: return id(ha_token).empty();
          then:
            - lambda: |-
                if (id(pairing_code).empty()) {
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%06u",
                           (unsigned) (random_uint32() % 1000000));
                  id(pairing_code) = buf;
                  ESP_LOGI("pair", "Pairing code %s", buf);
                }
                if (id(pairing_hint).empty()) {
                  id(pairing_hint) = "Add this device in Home Assistant";
                }
            - script.execute: ui_sync_pairing
            - lvgl.page.show: page_pairing
            # -- The code is only useful while it can be read. Nobody is
            # -- touching a device that has not been set up yet, so the
            # -- inactivity timeout would take the screen away a minute in
            # -- and leave the person looking for a code on a black panel.
            # -- Cleared where the code stops mattering, which is both
            # -- ways round: accept_bootstrap when Home Assistant pushed the
            # -- token, poll_pairing when this device collected it. --
            - lambda: id(screen_keep_awake) = true;
            # -- And a device that was already asleep when its token was
            # -- revoked has to come back: forget_token reaches here too.
            # -- Resumed the way the wake-up touch does it, because sleep is
            # -- the only thing that pauses LVGL and resuming a running one
            # -- would be saying something that is not true. --
            - light.turn_on: backlight
            - if:
                condition:
                  lvgl.is_paused:
                then:
                  - lvgl.resume:
      # -- Outside the branch above, because it has to run in both cases: this
      # -- is the one place that tells the provisioning endpoint what state
      # -- the device is in. Boot reaches it, and so does forget_token, which
      # -- is what reopens the endpoint after a token is revoked. --
      - lambda: |-
          id(panel_provision)->set_state(!id(ha_token).empty(),
                                         id(pairing_code));
      # -- The same question, answered for the other endpoint: a paired device
      # -- accepts pushes and an unpaired one accepts none. --
      - script.execute: apply_push_key

  # -- The key that guards the two push routes, brought into line with
  # -- whether this device is paired. Called from the three places that settle
  # -- that question: show_start_page, which boot and forget_token both reach,
  # -- and the two pairing paths.
  # --
  # -- The key is minted here rather than by Home Assistant so that it is a
  # -- secret of this pair and not a second copy of the token, which never
  # -- leaves this device. Home Assistant learns it from the status report, so
  # -- a device that has just minted one is unreachable by push until that
  # -- report goes out -- which is why the key is kept in flash and a reboot
  # -- re-uses the one Home Assistant already has. --
  - id: apply_push_key
    then:
      - lambda: |-
          if (id(ha_token).empty()) {
            // -- Not paired: nothing may push, and the old key goes with the
            //    old pairing rather than waiting for the next one. --
            if (!id(push_key).empty())
              id(push_key) = "";
            id(panel_push)->set_key("");
            return;
          }
          if (id(push_key).empty()) {
            char buffer[33];
            for (int i = 0; i < 4; i++)
              snprintf(buffer + i * 8, 9, "%08x",
                       (unsigned) random_uint32());
            id(push_key) = std::string(buffer, 32);
          }
          id(panel_push)->set_key(id(push_key));

  # -- What Home Assistant posted to the provisioning endpoint, applied on
  # -- the main loop. The component has already checked the code and the
  # -- shape of all three values; this is where they become the device's. --
  - id: accept_bootstrap
    parameters:
      base_url: string
      token: string
      entity: string
    then:
      - lambda: |-
          id(ha_base) = base_url;
          id(ha_token) = token;
          id(config_entity) = entity;
          id(auth_header) = "Bearer " + token;
          id(pairing_code) = "";
          id(pairing_hint) = "";
          id(last_pairing_status) = 200;
          // -- Paired: the screen goes back to its normal timeout. --
          id(screen_keep_awake) = false;
          id(screen_last_active_ms) = millis();
          // -- The grid component was handed this at boot, when a factory
          //    device had no address to build it out of. It is the one thing
          //    installed into that component that depends on where Home
          //    Assistant is, so it is the one thing to install again. --
          id(room_grid)->set_icon_preview_base(
              id(ha_base) + "/api/media_controller/icon-preview/");
          // -- Closes the provisioning endpoint. Every route but the
          //    read-only identity one answers 409 from here on, until a
          //    revoked token sends this device back through
          //    show_start_page. --
          id(panel_provision)->set_state(true, std::string());
          ESP_LOGI("pair", "Paired by Home Assistant; reading %s",
                   entity.c_str());
      # -- Mints the key the push routes want, now that there is a pairing for
      # -- it to belong to. Home Assistant learns it from the next status
      # -- report and pushes only after that; until then the polls below carry
      # -- the device, which is what they are for. --
      - script.execute: apply_push_key
      - script.execute: ui_load_room_config
      - script.execute: show_home_page

  - id: ui_sync_pairing
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          lv_label_set_text(id(lbl_pairing_code), id(pairing_code).c_str());
          lv_label_set_text(id(lbl_pairing_hint), id(pairing_hint).c_str());

  # -- Home Assistant answers this only while somebody has approved a pairing
  # -- for this device, only for a few minutes, only for the code on this
  # -- screen, and only once. Everything that protects the exchange is on that
  # -- side, in the integration's pairing.py. Here it is a poll and four
  # -- outcomes. --
  - id: poll_pairing
    mode: restart
    then:
      - http_request.post:
          url: !lambda |-
            return id(ha_base) + "/api/media_controller/provision";
          request_headers:
            Content-Type: "application/json"
          body: !lambda |-
            return "{\"panel_id\":\"" + get_mac_address() +
                   "\",\"code\":\"" + id(pairing_code) + "\"}";
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  int code = response->status_code;
                  if (code == 404) {
                    id(pairing_hint) = "Add this device in Home Assistant";
                  } else if (code == 202) {
                    id(pairing_hint) = "Accepted - finish the setup form";
                  } else if (code == 403) {
                    id(pairing_hint) = "Enter this code in Home Assistant";
                  } else if (code != 200) {
                    id(pairing_hint) = "Home Assistant returned an error";
                  }
                  if (code != 200) {
                    // -- One line per change, not one per poll. Home Assistant
                    //    answers 404 for as long as nobody has started adding
                    //    this device, which can be days. --
                    if (code != id(last_pairing_status)) {
                      ESP_LOGI("pair", "Provisioning HTTP %d", code);
                    }
                    id(last_pairing_status) = code;
                    id(ui_sync_pairing)->execute();
                    return;
                  }
                  id(last_pairing_status) = code;

                  std::string token = id(json_field)(body, "token");
                  std::string entity = id(json_field)(body, "config_entity");
                  if (token.empty() || entity.empty()) {
                    ESP_LOGW("pair", "The provisioning answer was incomplete");
                    return;
                  }
                  id(ha_token) = token;
                  id(config_entity) = entity;
                  id(auth_header) = "Bearer " + token;
                  id(pairing_code) = "";
                  // -- The other end of what show_start_page set: there is no
                  //    code on screen to keep readable any more, so the normal
                  //    timeout applies again, counted from now rather than
                  //    from whenever this device was last touched. --
                  id(screen_keep_awake) = false;
                  id(screen_last_active_ms) = millis();
                  // -- Closes the provisioning endpoint, exactly as pairing
                  //    the other way round does. Both directions end in a
                  //    stored token, so both have to say so: an endpoint left
                  //    open on a paired device would accept a second
                  //    bootstrap from anybody who could read the screen. --
                  id(panel_provision)->set_state(true, std::string());
                  ESP_LOGI("pair", "Paired; reading %s", entity.c_str());
              - if:
                  condition:
                    lambda: return !id(ha_token).empty();
                  then:
                    # -- The other way into a pairing, and the same key. --
                    - script.execute: apply_push_key
                    - script.execute: ui_load_room_config
                    - script.execute: show_home_page

  # -- A token Home Assistant no longer accepts is worse than no token: every
  # -- request would fail and the screen would quietly stop moving. Drop it
  # -- and ask again. --
  - id: forget_token
    then:
      - lambda: |-
          ESP_LOGW("pair", "The token was rejected; pairing again");
          id(ha_token) = "";
          id(auth_header) = "";
          id(pairing_code) = "";
          id(pairing_hint) = "Add this device in Home Assistant";
      - script.execute: show_start_page

  # ════════════════════════════════════════════════════════════
  # POLLING
  # ════════════════════════════════════════════════════════════

  # -- The player payload, read in one place because it arrives two ways:
  # -- polled by poll_player below, and posted by Home Assistant to
  # -- /api/push/player when it changes. Both hand the same document --
  # -- the body of /api/states/<player> -- to this, so a field that is
  # -- read one way is read the other, and there is no second parser to
  # -- keep in step. --
  - id: apply_player_payload
    parameters:
      payload: string
    then:
      - lambda: id(parse_start_ms) = millis();
      - lambda: |-
          // -- Nothing new to say: the same document read again would publish
          //    the same values and redraw the same widgets. See the digest
          //    globals for why that is worth a hash. --
          if (!id(payload_digest_moved)(payload,
                                        id(last_player_digest))) {
            return;
          }
          std::string state = id(json_field)(payload, "state");
          if (!state.empty() &&
              state != id(player_state).state) {
            id(player_state).publish_state(state);
          }

          std::string attrs = id(json_object)(payload,
                                              "attributes");
          if (attrs.empty()) return;

          std::string title = id(json_field)(attrs,
                                             "media_title");
          if (title.empty()) title = "No track";
          bool track_changed = title != id(media_title).state;
          if (track_changed) {
            id(media_title).publish_state(title);
          }

          std::string artist = id(json_field)(attrs,
                                              "media_artist");
          if (artist != id(media_artist).state) {
            id(media_artist).publish_state(artist);
          }

          std::string art = id(json_field)(
              attrs, "entity_picture_local");
          if (art.empty()) art = "None";
          if (art != id(entity_picture).state) {
            id(entity_picture).publish_state(art);
          }

          std::string shuffle = id(json_field)(attrs,
                                               "shuffle");
          if (shuffle != id(shuffle_state).state) {
            id(shuffle_state).publish_state(shuffle);
          }

          std::string repeat = id(json_field)(attrs, "repeat");
          if (repeat.empty()) repeat = "off";
          if (repeat != id(repeat_state).state) {
            id(repeat_state).publish_state(repeat);
          }

          std::string vol = id(json_field)(attrs,
                                           "volume_level");
          if (!vol.empty()) {
            float v = atof(vol.c_str());
            if (isnan(id(volume_level).state) ||
                fabsf(v - id(volume_level).state) > 0.001f) {
              id(volume_level).publish_state(v);
            }
          }

          std::string dur = id(json_field)(attrs,
                                           "media_duration");
          float d = dur.empty() ? 0.0f : atof(dur.c_str());
          if (isnan(id(media_duration).state) ||
              fabsf(d - id(media_duration).state) > 0.5f) {
            id(media_duration).publish_state(d);
          }

          std::string pos = id(json_field)(attrs,
                                           "media_position");
          float p = pos.empty() ? 0.0f : atof(pos.c_str());
          // -- The number alone is not enough to tell a stale
          // -- local advance from a still-accurate one. A new
          // -- track starts at the same 0 the last one was
          // -- last polled at, so the difference is nothing
          // -- and the interface would go on counting from
          // -- wherever the previous track had got to,
          // -- clamped to the new duration, which reads as a
          // -- finished track: a full bar and an elapsed time
          // -- equal to the total. The stamp Home Assistant
          // -- writes beside the position is rewritten on
          // -- every seek, resume and track change, so that is
          // -- what a re-sync follows. Players that report no
          // -- stamp fall back to the number changing, as
          // -- before. --
          std::string stamp = id(json_field)(
              attrs, "media_position_updated_at");
          bool resync = track_changed ||
                        isnan(id(media_position).state);
          if (!stamp.empty()) {
            if (stamp != id(last_position_stamp)) {
              id(last_position_stamp) = stamp;
              resync = true;
            }
          } else if (fabsf(p - id(last_polled_position)) >
                     0.5f) {
            resync = true;
          }
          if (resync) {
            id(last_polled_position) = p;
            id(media_position).publish_state(p);
          }
      - lambda: |-
          uint32_t spent = millis() - id(parse_start_ms);
          if (spent > id(parse_max_ms)) id(parse_max_ms) = spent;

  # -- The player, in one request, rather than nine state subscriptions over
  # -- a native API this firmware does not have. --
  - id: poll_player
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(player_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return id(ha_base) + "/api/states/" + id(player_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                max_response_buffer_size: 8192
                on_response:
                  then:
                    # -- Timed whatever the answer was: a request that failed
                    # -- slowly held the loop for just as long as one that
                    # -- succeeded slowly. --
                    - lambda: |-
                        if (response->duration_ms > id(http_max_ms))
                          id(http_max_ms) = response->duration_ms;
                    - if:
                        condition:
                          lambda: |-
                            return response->status_code == 401 ||
                                   response->status_code == 403;
                        then:
                          - lambda: id(forget_token)->execute();
                        else:
                          - if:
                              condition:
                                lambda: |-
                                  return response->status_code == 200;
                              then:
                                - script.execute:
                                    id: apply_player_payload
                                    payload: !lambda return body;
                              else:
                                - lambda: |-
                                    ESP_LOGW("player", "HTTP %d",
                                             response->status_code);

  # -- Every card's state arrives inside the config poll, in the `room_states`
  # -- block the integration renders there. It used to be a template rendered
  # -- by a POST to /api/template, one request for every card on the page —
  # -- but that endpoint answers administrators only, and this device's token
  # -- belongs to a dedicated non-administrator user, so Home Assistant
  # -- refused it with 401 and every card stayed blank. The states are read
  # -- out of the config attributes in ui_load_room_config below, through
  # -- apply_room_states, which costs no request of its own.

  # -- The daily forecast behind the weather blocks. One request names every
  # -- drawn weather entity the component reports, and the answer is parsed
  # -- with no JSON library, the way the registry is: a day-by-day answer is
  # -- kilobytes, and this device has no kilobytes to spend on a document. --
  - id: poll_room_forecast
    mode: restart
    then:
      - lambda: id(pending_forecast_body) = id(room_grid)->forecast_request();
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() &&
                     !id(pending_forecast_body).empty();
          then:
            - http_request.post:
                # -- With the response asked for: without ?return_response
                # -- Home Assistant answers a bare empty list, however much
                # -- forecast it holds. --
                url: !lambda |-
                  return id(ha_base) +
                         "/api/services/weather/get_forecasts?return_response";
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "application/json"
                body: !lambda return id(pending_forecast_body);
                capture_response: true
                # -- Two entities at most, five days each: well under this,
                # -- and an answer that overflows is cut off mid-flight, which
                # -- the parse reads as fewer days rather than an error. --
                max_response_buffer_size: 8192
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - lambda: id(room_grid)->apply_forecast(body);
                          - script.execute: refresh_room_cards
                        else:
                          - lambda: |-
                              ESP_LOGW("room", "Forecast HTTP %d",
                                       response->status_code);

  # ════════════════════════════════════════════════════════════
  # CARD ARTWORK
  # ════════════════════════════════════════════════════════════
  # The pictures a room card draws are downloaded rather than compiled in.
  # Six are still linked into this firmware and they are the fallback: what a
  # card shows before Home Assistant has answered, while it is unreachable,
  # when a download fails, and for an identifier this build has never heard
  # of. A room page that cannot reach Home Assistant is a page with plain
  # artwork on it, never an empty one.
  #
  # Nothing here builds a name out of anything a caller said. The component
  # decides which identifier is worth asking for and hands it over already
  # checked; this half only turns it into a request.

  # -- Which pictures exist, with no image data in any of it. It is asked for
  # -- rarely on purpose: the catalog changes when the integration is
  # -- upgraded and never otherwise, so putting it on the config poll would
  # -- spend a request a second on hundreds of names. That is the same
  # -- reason the layout backup is an endpoint of its own. --
  - id: poll_icon_catalog
    mode: restart
    then:
      - if:
          condition:
            lambda: return !id(ha_token).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return id(ha_base) + "/api/media_controller/icons";
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                # -- Up to 512 rows of an identifier and a label. The current
                # -- 316-row catalog is about 13 kB. Keep headroom without
                # -- reserving a 49 kB request buffer on the ESP32. Names, not
                # -- pictures: the pictures are separate requests, made only
                # -- for the handful a card actually draws. --
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("icons", "Catalog HTTP %d",
                                   response->status_code);
                          id(catalog_poll_interval_ms) = 60000;
                          return;
                        }
                        if (!id(room_grid)->ingest_icon_catalog(body)) {
                          id(catalog_poll_interval_ms) = 60000;
                          return;
                        }
                        id(catalog_poll_interval_ms) = 21600000;

  # -- One picture, at the exact size a card draws it. A pre-rendered variant
  # -- and not a PNG: this build sets LV_COLOR_16_SWAP and leaves
  # -- LV_DRAW_SW_SUPPORT_SWAPPED off, so LVGL cannot transform a source at
  # -- all, and this device has no decoder to spare either. What arrives is
  # -- the bytes LVGL blits, behind eight bytes of header that say so. --
  - id: fetch_room_icon
    mode: restart
    parameters:
      icon: std::string
    then:
      - lambda: id(fetching_icon) = icon;
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(fetching_icon).empty();
          then:
            - http_request.get:
                # -- The identifier is the component's, already checked
                # -- against the shape the integration publishes and against
                # -- the catalog it published. Nothing a caller typed reaches
                # -- this line. --
                url: !lambda |-
                  return id(ha_base) + "/api/media_controller/icon/" +
                         id(fetching_icon) + "/40";
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                # -- 40 x 40 x 4 bytes and an eight-byte header, and one byte
                # -- of headroom so that an answer which is too long is seen
                # -- to be too long rather than silently truncated to exactly
                # -- the right length. --
                max_response_buffer_size: 6409
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("icons", "Icon %s HTTP %d",
                                   id(fetching_icon).c_str(),
                                   response->status_code);
                          // -- Recorded as a failure so that it is left
                          //    alone for a while instead of asked for on
                          //    every tick. The card keeps its fallback. --
                          id(room_grid)->icon_downloaded(id(fetching_icon),
                                                         "");
                          id(fetching_icon) = "";
                          return;
                        }
                        bool drawn = id(room_grid)->icon_downloaded(
                            id(fetching_icon), body);
                        id(fetching_icon) = "";
                        if (drawn) {
                          // -- A card is drawing this one, and it was
                          //    drawing the fallback until now. The page is
                          //    rebuilt so the widget is handed the new
                          //    descriptor; an icon nothing draws changes
                          //    nothing on screen and costs no rebuild. --
                          id(rebuild_room_grid)->execute();
                        }
                on_error:
                  then:
                    - lambda: |-
                        id(room_grid)->icon_downloaded(id(fetching_icon), "");
                        id(fetching_icon) = "";
          else:
            # -- Nothing was asked for, so nothing will answer. Both halves
            # -- have to be told, or the one in flight is never cleared and
            # -- no picture is ever fetched again. --
            - lambda: |-
                id(room_grid)->icon_downloaded(id(fetching_icon), "");
                id(fetching_icon) = "";

  # -- The display name and icon of one card. It is the only thing the
  # -- on-device editor can write into Home Assistant's own data, and the
  # -- body is built by the component, which is the half that knows what may
  # -- be said. This half only puts it on the wire. --
  - id: cmd_write_card
    mode: restart
    parameters:
      document: std::string
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty();
          then:
            - http_request.post:
                # -- The same identifier this device pairs, reports and
                # -- backs its layout up under: the MAC, which is what the
                # -- integration knows it as. --
                url: !lambda |-
                  return id(ha_base) + "/api/media_controller/panel_card/" +
                         get_mac_address();
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "application/json"
                body: !lambda return document;
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(room_grid)->card_write_finished(true, "");
                          // -- The new name arrives back the ordinary way,
                          //    in the next config poll, because Home
                          //    Assistant owns the registry and this device
                          //    only asked. Nothing is written locally. --
                          return;
                        }
                        char buf[72];
                        snprintf(buf, sizeof(buf),
                                 "Home Assistant refused the change (HTTP "
                                 "%d).", response->status_code);
                        id(room_grid)->card_write_finished(false, buf);
                on_error:
                  then:
                    - lambda: |-
                        id(room_grid)->card_write_finished(
                            false, "Home Assistant could not be reached.");
          else:
            - lambda: |-
                id(room_grid)->card_write_finished(
                    false, "This device is not paired with Home Assistant.");

  # -- The config sensor names every other entity, so it is requested every
  # -- cycle rather than as rarely as a layout alone would need: it is also
  # -- the channel Home Assistant turns the screen off through, and a button
  # -- there that took a minute to do anything would read as broken. --
  # -- The config payload, read in one place because it arrives two ways:
  # -- polled by ui_load_room_config below, and posted by Home Assistant
  # -- to /api/push/config when it changes. Both hand the same document --
  # -- the body of /api/states/<config sensor> -- to this, so a setting
  # -- honoured one way is honoured the other, and the commands the sensor
  # -- carries are read by one parser rather than by two that could drift.
  # --
  # -- It resets the three pending_ globals itself rather than trusting the
  # -- caller to: they are how this script talks to the actions below it,
  # -- and a payload that turns out to name nothing must not leave the
  # -- previous one's attributes behind for them to act on. --
  - id: apply_config_payload
    mode: restart
    parameters:
      payload: string
    then:
      - lambda: id(parse_start_ms) = millis();
      - lambda: |-
          id(pending_attributes) = "";
          id(pending_commands) = "";
          id(layout_changed) = false;

          // -- An identical document changes nothing, and the actions after
          //    this one all read the three globals just cleared: with nothing
          //    pending and no flag raised, every one of them is a no-op. So
          //    returning here skips the whole cycle rather than half of it. --
          if (!id(payload_digest_moved)(payload,
                                        id(last_config_digest))) {
            return;
          }

          std::string attrs = id(json_object)(payload,
                                              "attributes");
          if (attrs.empty()) return;

          // -- A payload missing any of the three controller
          //    entities is not usable yet and must be retried,
          //    not cached. --
          std::string player = id(json_field)(attrs, "player");
          std::string queue = id(json_field)(attrs, "queue");
          std::string lists = id(json_field)(attrs,
                                             "playlists");
          if (player.empty() || queue.empty() ||
              lists.empty()) {
            ESP_LOGD("slots", "The config payload is not ready");
            return;
          }
          id(player_entity) = player;
          id(queue_entity) = queue;
          id(playlists_entity) = lists;
          // -- One half of what confirm_boot needs: this build
          //    can read the payload the whole interface is
          //    driven by. The other half is a status report
          //    Home Assistant accepted. --
          id(config_seen) = true;

          // -- This device's half of the version check; the
          //    integration performs the other half on the
          //    report sent above. An integration older than
          //    this firmware sends no contract version at all,
          //    which reads as 0 and compares like any smaller
          //    number. There is nowhere on this screen to say
          //    so without taking space from the interface, so
          //    it goes to the log, where an ESPHome device
          //    reports a configuration problem. Logged once per
          //    version seen: the config sensor is read every
          //    poll cycle, and a line a second would bury
          //    everything else. --
          static int warned_contract = -1;
          int contract = atoi(
              id(json_field)(attrs,
                             "contract_version").c_str());
          if (contract < ${contract_version} &&
              contract != warned_contract) {
            warned_contract = contract;
            ESP_LOGW("config",
                     "Home Assistant speaks contract %d and "
                     "this firmware needs %d: update Media "
                     "Controller",
                     contract, ${contract_version});
          }

          // -- Home Assistant owns both poll rates. Clamp them
          //    here as well as there: a client trusts a payload
          //    no further than it has to. --
          std::string settings = id(json_object)(attrs,
                                                 "settings");
          if (!settings.empty()) {
            std::string v = id(json_field)(settings,
                                           "poll_interval_ms");
            if (!v.empty()) {
              uint32_t ms = (uint32_t) atof(v.c_str());
              if (ms < 500) ms = 500;
              if (ms > 30000) ms = 30000;
              id(poll_interval_ms) = ms;
            }
            v = id(json_field)(
                settings, "playlist_poll_interval_ms");
            if (!v.empty()) {
              uint32_t ms = (uint32_t) atof(v.c_str());
              if (ms < 10000) ms = 10000;
              if (ms > 3600000) ms = 3600000;
              id(playlist_poll_interval_ms) = ms;
            }
            // -- Which home layout to draw. The interface owns
            //    the mapping and ignores a name it does not
            //    know, so this half only has to hand it over.
            //    An absent key leaves the layout restored from
            //    flash alone: Home Assistant has not chosen. --
            id(pending_skin) = id(json_field)(settings,
                                              "player_skin");
            id(pending_rotation) = id(json_field)(settings,
                                                  "screen_rotation");

            // -- How long the backlight stays on. Home
            //    Assistant has owned this since contract
            //    version 3 and this device ignored it until
            //    version 9, because a "Screen Timeout" ESPHome
            //    number of its own was a second owner. That
            //    number went with the native API. 0 is never;
            //    anything else is clamped to the contract's
            //    range, which is wider than the old number's.
            v = id(json_field)(settings, "screen_off_seconds");
            if (!v.empty()) {
              long seconds = atol(v.c_str());
              if (seconds <= 0) {
                seconds = 0;
              } else {
                if (seconds < 5) seconds = 5;
                if (seconds > 3600) seconds = 3600;
              }
              id(screen_off_seconds) = (uint32_t) seconds;
            }
          }

          // -- The theme: eight colours and four opacities.
          //    Every key is optional, and a key this firmware
          //    cannot parse leaves the value it already has
          //    rather than resetting it -- a panel that lost
          //    its colours because one of them arrived
          //    malformed would be worse than one that kept
          //    them. Each is stored in a restoring global, so
          //    a reboot with Home Assistant down comes back
          //    looking the same. --
          std::string theme = id(json_object)(attrs, "theme");
          if (!theme.empty()) {
            auto colour = [&](const char *key,
                              uint32_t *target) {
              std::string raw = id(json_field)(theme, key);
              if (raw.empty()) return;
              if (raw[0] == '#') raw.erase(0, 1);
              if (raw.size() != 6) return;
              char *end = nullptr;
              unsigned long value =
                  strtoul(raw.c_str(), &end, 16);
              if (end == nullptr || *end != '\0') return;
              if (*target == (uint32_t) value) return;
              *target = (uint32_t) value;
              id(theme_changed) = true;
            };
            auto opacity = [&](const char *key, int *target) {
              std::string raw = id(json_field)(theme, key);
              if (raw.empty()) return;
              int value = atoi(raw.c_str());
              if (value < 0) value = 0;
              if (value > 255) value = 255;
              if (*target == value) return;
              *target = value;
              id(theme_changed) = true;
            };

            colour("color_arc", &id(theme_color_arc));
            colour("color_arc_indicator",
                   &id(theme_color_arc_indicator));
            colour("color_decoration",
                   &id(theme_color_decoration));
            colour("color_title", &id(theme_color_title));
            colour("color_artist", &id(theme_color_artist));
            colour("color_volume", &id(theme_color_volume));
            colour("color_buttons", &id(theme_color_buttons));
            colour("color_flat_controls",
                   &id(theme_color_flat_controls));
            opacity("opacity_album_art",
                    &id(theme_opacity_album_art));
            opacity("opacity_arc", &id(theme_opacity_arc));
            opacity("opacity_decoration",
                    &id(theme_opacity_decoration));
            opacity("opacity_buttons",
                    &id(theme_opacity_buttons));
          }

          // -- The Player Skin select on this device's own Home
          //    Assistant device, and the only entity in the
          //    payload this firmware writes. Outside the
          //    revision on purpose: which entity holds the skin
          //    is not layout. --
          id(skin_select_entity) = id(json_field)(
              attrs, "skin_select");
          id(room_grid)->set_skin_writable(
              !id(skin_select_entity).empty());

          // -- The revision covers the layout and nothing else,
          //    so an unchanged one costs no widget work. --
          uint32_t rev = (uint32_t) atof(
              id(json_field)(attrs, "revision").c_str());
          if (rev == 0 || rev != id(config_revision)) {
            id(config_revision) = rev;
            id(layout_changed) = true;
          }

          id(pending_commands) = id(json_object)(attrs,
                                                 "commands");
          id(pending_attributes) = attrs;

          // -- The room states ride this poll, in the block
          //    the integration renders beside the registry. A
          //    template rendered by POST /api/template would
          //    be one request for every card, but that
          //    endpoint answers administrators only and this
          //    device's token belongs to a dedicated
          //    non-administrator user. Applied on every poll:
          //    unlike the registry, states move constantly. --
          std::string states = id(json_object)(
              attrs, "room_states");
          if (!states.empty() &&
              id(room_grid)->apply_room_states(states)) {
            id(refresh_room_cards)->execute();
          }
      - if:
          condition:
            lambda: return !id(pending_skin).empty();
          then:
            - script.execute:
                id: ui_apply_skin
                skin: !lambda return id(pending_skin);
      # -- Once per payload, and only when something actually
      # -- moved: apply_theme walks every widget on every
      # -- layout, and doing that once a second for a colour
      # -- nobody changed is exactly the churn the revision
      # -- exists to avoid elsewhere. --
      - if:
          condition:
            lambda: return id(theme_changed);
          then:
            - lambda: id(theme_changed) = false;
            - script.execute: apply_theme
      - script.execute: read_commands
      - script.execute:
          id: ui_apply_rotation
          angle: !lambda return id(pending_rotation);
      - script.execute: apply_commands
      # -- The registry is handed over only when the revision
      # -- moved. Walking sixty-four elements with ArduinoJson
      # -- once a second would be pure churn for a list that
      # -- changes twice in the life of a device, and the
      # -- revision exists to say when it did. --
      - if:
          condition:
            lambda: return id(layout_changed);
          then:
            - lambda: |-
                if (id(room_grid)->ingest_entities(
                        id(pending_attributes))) {
                  id(rebuild_room_grid)->execute();
                  id(last_forecast_poll_ms) = 0;
                }
      - lambda: |-
          uint32_t spent = millis() - id(parse_start_ms);
          if (spent > id(parse_max_ms)) id(parse_max_ms) = spent;

  - id: ui_load_room_config
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(config_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return id(ha_base) + "/api/states/" + id(config_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                # -- Sixty-four registry elements with Cyrillic names are
                # -- about thirteen kilobytes, and 8192 does not hold them.
                # -- An overflowing buffer is not an error here: the response
                # -- is cut off mid-flight, the parse simply finds less than
                # -- it expected, and nothing appears in the log. That is the
                # -- trap TB-9 left, and this is the same fix.
                # --
                # -- Not 64 kB: the buffer is allocated at its full size on
                # -- every request (http_request.h:517) and the config sensor
                # -- is fetched once per poll_interval_ms, which is once a
                # -- second. --
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - lambda: |-
                        if (response->duration_ms > id(http_max_ms))
                          id(http_max_ms) = response->duration_ms;
                    - if:
                        condition:
                          lambda: |-
                            return response->status_code == 401 ||
                                   response->status_code == 403;
                        then:
                          - lambda: id(forget_token)->execute();
                        else:
                          - if:
                              condition:
                                lambda: |-
                                  return response->status_code == 200;
                              then:
                                - script.execute:
                                    id: apply_config_payload
                                    payload: !lambda return body;
                              else:
                                - lambda: |-
                                    ESP_LOGW("room", "Config sensor HTTP %d",
                                             response->status_code);

  - id: refresh_queue
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(queue_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return id(ha_base) + "/api/states/" + id(queue_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - script.execute:
                              id: rebuild_queue
                              payload: !lambda return body;

  # ════════════════════════════════════════════════════════════
  # PAGE-SCOPED FETCHES
  # ════════════════════════════════════════════════════════════
  # The interface package calls one of these from the on_load of every page,
  # and the poll cycle at the foot of this file asks for a payload only while
  # the page that draws it is the one showing. The two halves belong together:
  # without the on_load fetch a page would open on whatever was last seen —
  # a queue from two tracks ago, or a lamp that has since been switched off —
  # and without the gate the device would spend a request a second on a page
  # nobody is looking at. See "Request only what the active page draws" in
  # docs/CONTRACT.md before adding a request to either half.
  #
  # refresh_queue is above, and is already page-scoped this way: nothing in
  # the poll cycle asks for the queue, so page_queue's on_load is the whole of
  # it.
  #
  # The two that fetch a large payload move the poll cycle's clock forward as
  # well. Without that, opening a page would make the same request twice —
  # once here and once on the tick a moment later — and an http_request blocks
  # the main loop, which is exactly what must not happen under a finger that
  # has just changed page. refresh_player deliberately does not: its clock is
  # the one the config sensor is read on, and the commands Home Assistant
  # sends through that sensor must not be delayed by somebody swiping between
  # pages. Its payload is the small one, and a duplicate costs little.

  - id: refresh_player
    then:
      - script.execute: poll_player

  - id: refresh_playlists
    then:
      - if:
          condition:
            # -- A device that has not been told which sensor to read has
            # -- nothing to fetch, and must not start the clock as though it
            # -- had: the tick fetches the moment the config sensor names
            # -- one. --
            lambda: return !id(playlists_entity).empty();
          then:
            - lambda: id(last_playlist_poll_ms) = millis();
            - script.execute: poll_playlists

  # -- The room card states cost no request of their own: they ride the config
  # -- poll, in its room_states block, so opening the room page brings that
  # -- poll forward instead of asking for anything new. The forecast keeps its
  # -- own half-hourly clock and the next tick fetches it if it went stale
  # -- behind another page. --
  - id: refresh_room
    then:
      - lambda: id(last_poll_ms) = millis();
      - script.execute: ui_load_room_config

  - id: poll_playlists
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() &&
                     !id(playlists_entity).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return id(ha_base) + "/api/states/" + id(playlists_entity);
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - script.execute:
                              id: rebuild_playlists
                              payload: !lambda return body;
                        else:
                          - lambda: |-
                              ESP_LOGW("playlists", "HTTP %d",
                                       response->status_code);

  # ════════════════════════════════════════════════════════════
  # PANEL COMMANDS
  # ════════════════════════════════════════════════════════════
  # A command is a moment, not a message: each carries the millisecond it was
  # issued at, and it is acted on only when that is newer than the last one
  # acted on. That is what makes a poll a safe transport — a command runs once
  # however often it is read, and a restart does not repeat on every boot.
  #
  # Parsing and acting are two scripts because a lambda cannot turn a
  # backlight on; only an action can.

  - id: read_commands
    then:
      - lambda: |-
          const std::string &payload = id(pending_commands);
          id(want_display) = 0;
          id(want_brightness) = -1;
          id(want_restart) = false;
          id(want_page) = "";
          if (payload.empty()) return;

          std::string block = id(json_object)(payload, "display");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_display_at)) {
              id(last_display_at) = at;
              id(want_display) =
                  (id(json_field)(block, "state") == "on") ? 1 : 2;
            }
          }

          block = id(json_object)(payload, "brightness");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_brightness_at)) {
              id(last_brightness_at) = at;
              int value = atoi(id(json_field)(block, "value").c_str());
              if (value >= 1 && value <= 100) id(want_brightness) = value;
            }
          }

          block = id(json_object)(payload, "restart");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_restart_at)) {
              id(last_restart_at) = at;
              id(want_restart) = true;
            }
          }

          block = id(json_object)(payload, "page");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_page_at)) {
              id(last_page_at) = at;
              id(want_page) = id(json_field)(block, "value");
            }
          }

          // -- An update is a command like any other and is watermarked like
          //    any other, which is what stops a panel reinstalling the same
          //    build every time it reads the sensor.
          //
          //    Unlike the others, what it leaves behind is a latch rather
          //    than a value for this pass: want_update_version outlives the
          //    parse, because the work it starts takes two poll cycles and a
          //    minute of writing flash. It is cleared by install_firmware,
          //    or given up on after a few failed manifest calls.
          //
          //    The version this device is already running is refused here as
          //    well as in Home Assistant. A client trusts a payload no
          //    further than it has to, and reinstalling the running build
          //    would be a minute of dead screen for nothing.
          //
          //    So is an update on a build that was configured while it was
          //    compiled, and that one is not a nicety. What Home Assistant
          //    offers is the published factory image, and the whole point of
          //    that image is that it carries nothing personal: no Wi-Fi
          //    credentials, no Home Assistant address, no API key, no OTA
          //    password. A factory-flashed panel loses none of that by
          //    taking it. Its Wi-Fi and its address are in NVS because it
          //    learned them at runtime, and NVS is what an application
          //    update leaves alone -- the contract's "leave everything that
          //    is not the application alone" -- and it never had the other
          //    two at all. A package build had all four, and had them from
          //    its own compile rather than from NVS, so installing an image
          //    built from somebody else's checkout is what deletes them.
          //    The panel comes back with no network at all, raises its
          //    recovery access point and is offline until somebody walks up
          //    to it.
          //
          //    ha_url is the one thing that tells the two apart from inside
          //    the firmware, and it is the same test on_boot uses to decide
          //    whether this device knows where Home Assistant is before
          //    pairing: empty means the factory image, which learns
          //    everything at runtime and can therefore be replaced by
          //    another copy of itself. A build with an address in it is
          //    updated by the ESPHome that built it, over the OTA password
          //    its owner chose -- see "Keeping a package build in the
          //    ESPHome dashboard" in docs/ESP32_PAIRED_CONTROLLER.md. The
          //    watermark is still taken, so this says so once rather than on
          //    every poll for as long as the command stands. --
          block = id(json_object)(payload, "update");
          if (!block.empty()) {
            double at = atof(id(json_field)(block, "at").c_str());
            if (at > id(last_update_at)) {
              id(last_update_at) = at;
              std::string version = id(json_field)(block, "version");
              if (std::string("${ha_url}").size() > 0) {
                ESP_LOGW("ota",
                         "Home Assistant offered firmware %s; this build was "
                         "configured when it was compiled and is updated by "
                         "the ESPHome that built it, so it is not installed",
                         version.c_str());
              } else if (!version.empty() && version.size() <= 32 &&
                         version != "${firmware_version}") {
                id(want_update_version) = version;
                id(update_next_try_ms) = millis();
                id(update_attempts) = 0;
                ESP_LOGI("ota", "Home Assistant has firmware %s waiting",
                         version.c_str());
              }
            }
          }

  - id: apply_commands
    then:
      - if:
          condition:
            lambda: return id(want_display) == 2;
          then:
            - lvgl.pause:
            - light.turn_off: backlight
      - if:
          condition:
            lambda: return id(want_display) == 1;
          then:
            - light.turn_on: backlight
            - lvgl.resume:
            - lambda: id(screen_last_active_ms) = millis();
      - if:
          condition:
            lambda: return id(want_brightness) >= 0;
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda return id(want_brightness) / 100.0f;
      - if:
          condition:
            lambda: return id(want_page) == "player";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_page) == "queue";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_page) == "playlists";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_page) == "room";
          then:
            - script.execute:
                id: show_panel_page
                page: !lambda return id(want_page);
      - if:
          condition:
            lambda: return id(want_restart);
          then:
            # -- Long enough for the watermark to reach flash, so the restart
            # -- is not replayed on the next boot. --
            - delay: 2s
            - lambda: App.safe_reboot();
      # -- The two halves of an update, one poll cycle apart on purpose. The
      # -- manifest call answers asynchronously, so the second condition is
      # -- false on the pass that started it and true on the next one. That
      # -- also keeps the write out of an HTTP response callback, which is
      # -- not a place to stall the main loop for a minute. --
      - if:
          condition:
            lambda: |-
              return !id(want_update_version).empty() &&
                     id(update_url).empty() &&
                     (int32_t) (millis() - id(update_next_try_ms)) >= 0;
          then:
            - script.execute: start_firmware_update
      - if:
          condition:
            and:
              - lambda: return !id(update_url).empty();
              # -- The install spends a second on screen and then a minute
              # -- inside the update client, and this runs every poll. Asking
              # -- whether it is already going keeps a warning per second out
              # -- of the log of a device that is doing exactly the right
              # -- thing. --
              - not:
                  script.is_running: install_firmware
          then:
            - script.execute: install_firmware

  # ════════════════════════════════════════════════════════════
  # THE ROOM GRID
  # ════════════════════════════════════════════════════════════
  # Eight columns by eight rows of exactly 60 px, over the whole 480x480
  # screen. That is why page_room_grid carries no heading and no "tap to
  # toggle" hint: with them the work area is about 405 px and a row collapses
  # to 50. The hint stops being true the moment a person arranges the page
  # themselves, anyway.
  #
  # This page is drawn here rather than in media-controller-ui.yaml for the
  # same reason page_pairing is: it is about talking to Home Assistant rather
  # than about widgets, and the interface package names no entity and makes no
  # call. See docs/ESP32_PAIRED_CONTROLLER.md. The interface
  # keeps its four fixed buttons, and this firmware points room_page_index
  # here instead.
  #
  # Cards are built when the layout or the registry changes and at no other
  # time. Rebuilding a grid of sixty-four cards per frame would be exactly the
  # unbounded heap churn AGENTS.md forbids; LVGL takes its memory from the
  # heap here (ESPHome sets LV_USE_STDLIB_MALLOC to LV_STDLIB_CUSTOM), which
  # makes the churn possible rather than acceptable.

  - id: rebuild_room_grid
    then:
      - lambda: |-
          // -- LVGL widgets exist only after the interface package's on_boot
          //    has run. Everything that gets here earlier is redone by the
          //    explicit call at the end of this firmware's own on_boot. --
          if (!id(ui_ready)) return;

          lv_obj_t *root = (lv_obj_t *) id(room_grid_root);
          lv_obj_clean(root);

          // -- An empty grid says so rather than showing a blank screen that
          //    reads as a broken device. --
          const auto &cards = id(room_grid)->cards();
          lv_obj_t *empty[] = {
            (lv_obj_t *) id(lbl_room_grid_empty),
            (lv_obj_t *) id(lbl_room_grid_hint),
          };
          for (auto *label : empty) {
            if (cards.empty()) {
              lv_obj_remove_flag(label, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(label, LV_OBJ_FLAG_HIDDEN);
            }
          }

          for (size_t i = 0; i < cards.size(); i++) {
            const auto &card = cards[i];
            const auto *entry = id(room_grid)->entry(card.rid);

            // -- The cell is exactly 60 px. The card leaves three of them on
            //    each side unpainted, so two neighbours read as two cards
            //    rather than one slab; the geometry underneath is still whole
            //    cells. --
            lv_obj_t *tile = lv_obj_create(root);
            lv_obj_set_pos(tile, card.x() * 60 + 3, card.y() * 60 + 3);
            lv_obj_set_size(tile, card.w() * 60 - 6, card.h() * 60 - 6);
            lv_obj_set_user_data(tile, (void *) (uintptr_t) i);
            lv_obj_remove_flag(tile, LV_OBJ_FLAG_SCROLLABLE);
            // -- lv_obj_create leaves an object unclickable, and a card that
            //    is not clickable gets no long press either. A reading card
            //    stays unclickable on purpose: weather, a sensor, or anything
            //    Home Assistant offered no action for never shows a pressed
            //    state for a tap that acts on nothing, exactly like the T560
            //    panel. A card whose element has not arrived yet keeps the
            //    default and is corrected by the rebuild the registry poll
            //    triggers. --
            bool is_reading =
                entry != nullptr &&
                media_controller_grid::entry_is_reading(*entry);
            bool actionable =
                !is_reading &&
                (entry == nullptr || entry->togglable || entry->dimmable ||
                 entry->settable_temp);
            if (actionable) {
              lv_obj_add_flag(tile, LV_OBJ_FLAG_CLICKABLE);
            }
            // -- So a drag across a card still reaches the page and changes
            //    it, exactly as it does over the four fixed buttons. --
            lv_obj_add_flag(tile, LV_OBJ_FLAG_GESTURE_BUBBLE);

            // -- The palette of the room page, which apply_theme deliberately
            //    does not touch: the four fixed buttons are not themed
            //    either, and a card that repainted itself would be a second
            //    owner for a colour that already has one. A weather block
            //    wears its own sky rather than the off grey, the way the
            //    T560 panel draws it: it is information, not a switch left
            //    off. --
            bool is_weather =
                entry != nullptr &&
                entry->domain == media_controller_grid::DOMAIN_WEATHER;
            lv_obj_set_style_pad_all(tile, 0, 0);
            lv_obj_set_style_radius(tile, card.w() >= 2 ? 18 : 12, 0);
            lv_obj_set_style_bg_color(tile,
                                      is_weather ? lv_color_hex(0x2e5d8f)
                                                 : lv_color_hex(0x303050),
                                      0);
            lv_obj_set_style_bg_grad_color(tile,
                                           is_weather ? lv_color_hex(0x122540)
                                                      : lv_color_hex(0x11111f),
                                           0);
            lv_obj_set_style_bg_grad_dir(tile, LV_GRAD_DIR_VER, 0);
            lv_obj_set_style_bg_opa(tile, LV_OPA_COVER, 0);
            lv_obj_set_style_border_width(tile, 2, 0);
            lv_obj_set_style_border_color(tile,
                                          is_weather ? lv_color_hex(0x6fb3e8)
                                                     : lv_color_hex(0x505078),
                                          0);
            // -- A pressed face only where a press acts: a reading never
            //    shows one, because a tap on it acts on nothing. --
            if (actionable) {
              lv_obj_set_style_bg_color(tile, lv_color_hex(0x151526),
                                        LV_STATE_PRESSED);
              lv_obj_set_style_bg_grad_color(tile, lv_color_hex(0x272742),
                                             LV_STATE_PRESSED);
              lv_obj_set_style_border_color(tile, lv_color_hex(0x00cfff),
                                            LV_STATE_PRESSED);
            }

            // -- The artwork, in three steps and in this order.
            //
            //    1. the picture the person chose, downloaded from the
            //       catalog the integration publishes. It is decoded once
            //       per identifier and shared by every card that names it,
            //       so a page of sixty-four cards naming three pictures
            //       holds three of them;
            //    2. the same six pictures this firmware has always carried
            //       in flash, for a card whose choice has not arrived yet,
            //       for a device that cannot reach Home Assistant, and for
            //       a layout document that still names one of them itself;
            //    3. the domain's own suggestion, which is what makes a card
            //       useful before anybody has opened the editor. A switch
            //       borrows the fan and a thermostat the air conditioner,
            //       the way the T560 panel does; a blind has its own.
            //
            //    A sensor or a weather block names none where it counts: the
            //    icon object below stays hidden unless a person chose one in
            //    the editor, and the card draws its value as type rather
            //    than artwork, again the way the T560 panel does.
            //
            //    Never scaled at draw time, downloaded or not: every source
            //    here is already 40x40, because this build sets
            //    LV_COLOR_16_SWAP and LVGL cannot transform a swapped
            //    RGB565 source. That is also why the download is a
            //    pre-rendered variant rather than a PNG. --
            bool sensor_card =
                entry != nullptr &&
                entry->domain == media_controller_grid::DOMAIN_SENSOR;
            // -- Whether this card has a picture of its own at all, chosen
            //    in the editor or named by the layout document. It is what
            //    decides whether a reading shows artwork. --
            bool chosen_icon =
                !id(room_grid)->card_icon_id(card, entry).empty();
            const lv_image_dsc_t *downloaded =
                id(room_grid)->icon_for(card, entry);
            image::Image *art = id(card_icon_light1);
            if (card.icon == 1) art = id(card_icon_light1);
            else if (card.icon == 2) art = id(card_icon_light2);
            else if (card.icon == 3) art = id(card_icon_fan);
            else if (card.icon == 4) art = id(card_icon_ac);
            else if (card.icon == 5) art = id(card_icon_weather);
            else if (card.icon == 6) art = id(card_icon_blind);
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_WEATHER) {
              art = id(card_icon_weather);
            }
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_SWITCH) {
              art = id(card_icon_fan);
            }
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_CLIMATE) {
              art = id(card_icon_ac);
            }
            else if (entry != nullptr &&
                     entry->domain == media_controller_grid::DOMAIN_COVER) {
              art = id(card_icon_blind);
            }

            // -- A one-cell card is 54 px of paint and has room for the icon
            //    or the name, not both. The icon is the half that still says
            //    what the card is at a glance. That rule is the same for
            //    every card type but two: a sensor or a weather block at one
            //    cell says its value, with the name where it fits beside it
            //    — see `compact` below. Anything else at one cell is a
            //    picture and a tap, and everything it has to say needs two. --
            bool labelled = media_controller_grid::card_is_labelled(card);
            bool reads = media_controller_grid::card_shows_reading(card, entry);
            // -- A sensor below the labelled size still says its value: the
            //    name goes on top and the value under it, and where both do
            //    not fit the name is dropped and the value stays, because
            //    the value outranks the name. --
            bool compact = media_controller_grid::card_shows_compact(card, entry);
            // -- Large weather cards list the coming days under the current
            //    reading, as many rows as the card has cells for. The count
            //    is a fact about the card's size, so the refresh below
            //    builds the same children back by asking the same question.
            // --
            uint8_t forecast_rows =
                media_controller_grid::card_forecast_rows(card, entry);
            // -- A large weather card draws the T560 headed layout: the name
            //    on top, the hero temperature large beneath it, the condition
            //    line under the hero and the coming days at the bottom. A
            //    compact weather block keeps the compact layout every reading
            //    shares. --
            bool weather_large = is_weather && labelled && !compact;

            const lv_font_t *room_font = id(roboto_16)->get_lv_font();
            int line_h = lv_font_get_line_height(room_font);
            int tile_h = card.h() * 60 - 6;
            int tile_w = card.w() * 60 - 6;

            lv_obj_t *icon = lv_image_create(tile);
            // -- The downloaded picture where there is one, and the flash
            //    fallback where there is not. The descriptor belongs to the
            //    component's cache and stays alive for as long as a card
            //    draws it: an identifier a card uses is pinned there and
            //    never evicted from under this widget. --
            lv_image_set_src(icon, downloaded != nullptr
                                       ? (const void *) downloaded
                                       : (const void *) art->get_lv_image_dsc());
            lv_obj_remove_flag(icon, LV_OBJ_FLAG_CLICKABLE);
            // -- No icon where the value is the picture: on a compact card
            //    54 px hold the name and the value and nothing else, and on
            //    a sensor or a weather card the reading says more than
            //    artwork ever could — the T560 panel draws no icon-table
            //    artwork on a reading either — unless a person chose an
            //    icon for it in the editor, which wins. The object stays —
            //    child 0 is the icon on every card, and the refresh below
            //    walks children by index. --
            bool hide_icon =
                compact ||
                ((sensor_card || is_weather) && !chosen_icon);
            if (hide_icon) {
              lv_obj_add_flag(icon, LV_OBJ_FLAG_HIDDEN);
            }
            int icon_y = !labelled ? 0
                                   : (-12 - (reads ? 8 : 0) -
                                      (int) forecast_rows * 20);
            lv_obj_align(icon, LV_ALIGN_CENTER, 0, icon_y);

            // -- Decided before anything it places is created: the value
            //    needs one line and the name needs one, and where both do
            //    not fit the name is dropped and the value stays. --
            bool show_name = true;
            int value_y = 0;
            if (compact) {
              int need = 4 + line_h + 2 + line_h + 4;
              show_name = need <= tile_h;
              int zone_top = show_name ? 4 + line_h + 2 : 4;
              int zone_bottom = tile_h - 4;
              int slack = zone_bottom - zone_top - line_h;
              value_y = zone_top + (slack > 0 ? slack / 2 : 0);
            }

            // -- Child 1 on every labelled card of a known domain; see the
            //    child order in media_controller_grid.h. It is created empty
            //    because the registry arriving and the state arriving are two
            //    different polls, and refresh_room_cards fills it: the
            //    reading on a thermostat, sensor or cover card, and ON/OFF
            //    on a light or switch card. A large weather card instead
            //    carries the hero temperature in child 1 and the condition
            //    line in child 2, the way the T560 panel stacks them. --
            lv_obj_t *reading = nullptr;
            lv_obj_t *weather_sub = nullptr;
            if (weather_large) {
              const lv_font_t *hero_font =
                  tile_w >= 174 ? id(roboto_36)->get_lv_font()
                                : id(roboto_30)->get_lv_font();
              int hero_line = lv_font_get_line_height(hero_font);
              int name_bottom = 4 + line_h + 2;
              int forecast_top = forecast_rows > 0
                                     ? tile_h - 4 -
                                           (46 + (forecast_rows - 1) * 20 +
                                            line_h)
                                     : tile_h - 4;
              int total = hero_line + 4 + line_h;
              int slack = forecast_top - name_bottom - total;
              int hero_y = name_bottom + (slack > 0 ? slack / 2 : 0);

              reading = lv_label_create(tile);
              lv_label_set_long_mode(reading, LV_LABEL_LONG_DOT);
              lv_obj_set_width(reading, tile_w - 16);
              lv_obj_set_style_text_align(reading, LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_font(reading, hero_font, 0);
              lv_obj_set_style_text_color(reading, lv_color_hex(0xffffff), 0);
              lv_label_set_text(reading, "");
              lv_obj_align(reading, LV_ALIGN_TOP_MID, 0, hero_y);

              weather_sub = lv_label_create(tile);
              lv_label_set_long_mode(weather_sub, LV_LABEL_LONG_DOT);
              lv_obj_set_width(weather_sub, tile_w - 16);
              lv_obj_set_style_text_align(weather_sub, LV_TEXT_ALIGN_CENTER,
                                          0);
              lv_obj_set_style_text_font(weather_sub, room_font, 0);
              lv_obj_set_style_text_color(weather_sub,
                                          lv_color_hex(0xcfe3f7), 0);
              lv_label_set_text(weather_sub, "");
              lv_obj_align(weather_sub, LV_ALIGN_TOP_MID, 0,
                           hero_y + hero_line + 4);
            } else if (reads || compact) {
              reading = lv_label_create(tile);
              lv_label_set_long_mode(reading, LV_LABEL_LONG_DOT);
              lv_obj_set_width(reading, card.w() * 60 - 16);
              lv_obj_set_style_text_align(reading, LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_font(reading, room_font, 0);
              lv_obj_set_style_text_color(reading, compact ? lv_color_hex(0xffffff)
                                                           : lv_color_hex(0x8f8fb4), 0);
              lv_label_set_text(reading, "");
              if (compact) {
                lv_obj_align(reading, LV_ALIGN_TOP_MID, 0, value_y);
              } else if (sensor_card) {
                // -- Nothing above it: the icon is hidden, so the value
                //    moves to the middle of the card and the name keeps the
                //    bottom line. --
                lv_obj_align(reading, LV_ALIGN_CENTER, 0, -8);
              } else {
                lv_obj_align(reading, LV_ALIGN_BOTTOM_MID, 0, -26);
              }
            }

            // -- One label per forecast row, created empty: the registry
            //    arriving, the state arriving and the forecast arriving are
            //    three different polls, and refresh_room_cards fills them.
            //    On a weather card the rows draw in the T560 colours — the
            //    weekday muted, the high orange, the low blue — through
            //    recolor spans (see forecast_text_colored). --
            for (uint8_t row = 0; row < forecast_rows; row++) {
              lv_obj_t *forecast = lv_label_create(tile);
              lv_label_set_long_mode(forecast, LV_LABEL_LONG_DOT);
              lv_obj_set_width(forecast, card.w() * 60 - 16);
              lv_obj_set_style_text_align(forecast, LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_font(forecast, id(roboto_16)->get_lv_font(), 0);
              lv_obj_set_style_text_color(forecast, weather_large ? lv_color_hex(0xa9c3e0)
                                                                  : lv_color_hex(0x8f8fb4), 0);
              if (weather_large) {
                lv_label_set_recolor(forecast, true);
              }
              lv_label_set_text(forecast, "");
              lv_obj_align(forecast, LV_ALIGN_BOTTOM_MID, 0,
                           -46 - (int) row * 20);
            }

            if (labelled || (compact && show_name)) {
              lv_obj_t *name = lv_label_create(tile);
              lv_label_set_long_mode(name, LV_LABEL_LONG_WRAP);
              lv_obj_set_width(name, card.w() * 60 - 16);
              lv_obj_set_style_text_align(name, LV_TEXT_ALIGN_CENTER, 0);
              // -- roboto_16 and not montserrat: a registry name is whatever
              //    the user typed, and the Roboto faces in this build carry
              //    the Cyrillic glyphs the built-in fonts do not. --
              lv_obj_set_style_text_font(name, room_font, 0);
              lv_obj_set_style_text_color(name, lv_color_hex(0xd8d8f0), 0);
              lv_label_set_text(name, entry != nullptr && !entry->name.empty()
                                          ? entry->name.c_str()
                                          : "—");
              if (compact) {
                // -- On top, single line: the value below outranks it, and
                //    at this size there is no second line to give. --
                lv_label_set_long_mode(name, LV_LABEL_LONG_DOT);
                lv_obj_align(name, LV_ALIGN_TOP_MID, 0, 4);
              } else if (weather_large) {
                // -- A reading is headed by its name, the way the T560 panel
                //    draws it: the location first, then the current
                //    conditions, then the coming days. Single line, so the
                //    hero below never moves. --
                lv_label_set_long_mode(name, LV_LABEL_LONG_DOT);
                lv_obj_set_style_text_color(name, lv_color_hex(0xf1f6fd), 0);
                lv_obj_align(name, LV_ALIGN_TOP_MID, 0, 4);
              } else {
                lv_obj_align(name, LV_ALIGN_BOTTOM_MID, 0, -6);
                // -- A long name wraps onto a second line where the card
                //    has room for it, rather than being ellipsized where it
                //    does not have to be. Exactly two lines are kept: the
                //    name identifies the card, it is not the content. What
                //    sits above it moves up by one line with it. --
                lv_obj_update_layout(name);
                uint32_t lines =
                    (lv_obj_get_height(name) + (uint32_t) line_h - 1) /
                    (uint32_t) line_h;
                if (lines != 2) {
                  lv_label_set_long_mode(name, LV_LABEL_LONG_DOT);
                } else if (!sensor_card && !weather_large) {
                  if (reading != nullptr) {
                    lv_obj_align(reading, LV_ALIGN_BOTTOM_MID, 0,
                                 -26 - line_h);
                  }
                  for (uint8_t row = 0; row < forecast_rows; row++) {
                    lv_obj_t *day = lv_obj_get_child(tile, 2 + (int32_t) row);
                    if (day == nullptr) break;
                    lv_obj_align(day, LV_ALIGN_BOTTOM_MID, 0,
                                 -46 - (int) row * 20 - line_h);
                  }
                  icon_y -= line_h;
                  lv_obj_align(icon, LV_ALIGN_CENTER, 0, icon_y);
                }
              }
            }

            // -- One callback per actionable card. Which card it is comes from
            //    the index in the object's user data, and the entity behind
            //    it from the registry, so nothing about a card is captured
            //    and nothing goes stale when the registry moves under it. A
            //    reading carries none at all: without CLICKABLE no press is
            //    ever sent, and without a callback no tap can become a
            //    service call even if one were. --
            if (actionable) {
              lv_obj_add_event_cb(tile, [](lv_event_t *e) {
              lv_obj_t *pressed =
                  (lv_obj_t *) lv_event_get_current_target(e);
              size_t index =
                  (size_t) (uintptr_t) lv_obj_get_user_data(pressed);
              const auto &placed = id(room_grid)->cards();
              if (index >= placed.size()) return;
              auto *entry = id(room_grid)->entry(placed[index].rid);
              if (entry == nullptr) return;

              switch (lv_event_get_code(e)) {
                case LV_EVENT_PRESSED:
                  id(room_card_long_active) = false;
                  id(room_card_swept) = false;
                  break;
                case LV_EVENT_LONG_PRESSED:
                  id(room_card_long_active) = true;
                  break;
                case LV_EVENT_LONG_PRESSED_REPEAT: {
                  // -- This device has one gesture beyond a tap, and each
                  //    card type spends it on the one value it has: a light
                  //    on its brightness, a thermostat on its setpoint. The
                  //    sweep runs up, turns round at the top and comes back
                  //    down, exactly as the four fixed buttons do; the value
                  //    is local because a light reports the brightness it
                  //    reached, not the one the finger is heading for. --
                  if (entry->dimmable) {
                    float pct = entry->pct + entry->direction * 4.0f;
                    if (pct >= 100.0f) { pct = 100.0f; entry->direction = -1; }
                    if (pct <= 1.0f) { pct = 1.0f; entry->direction = 1; }
                    entry->pct = pct;
                    id(cmd_entity_brightness)->execute(entry->entity,
                                                       (int) pct);
                    break;
                  }
                  // -- Not while it is off. The card of an off thermostat
                  //    shows the room temperature and not the setpoint,
                  //    because it is heading nowhere, so a sweep there would
                  //    move a number with nothing on screen changing — the
                  //    one thing a sweep must never do. Turning it on is a
                  //    tap, and the sweep is there the moment it runs. --
                  if (!entry->settable_temp ||
                      !media_controller_grid::entry_is_on(*entry)) break;

                  // -- Nothing is sent from here. The setpoint moves on the
                  //    device and goes to Home Assistant once, on release:
                  //    see cmd_entity_set_temperature for why a thermostat
                  //    is not swept the way a lamp is. --
                  float target = std::isnan(entry->setpoint)
                                     ? (entry->min_temp + entry->max_temp) / 2.0f
                                     : entry->setpoint;
                  target += entry->direction * entry->temp_step;
                  if (target >= entry->max_temp) {
                    target = entry->max_temp;
                    entry->direction = -1;
                  }
                  if (target <= entry->min_temp) {
                    target = entry->min_temp;
                    entry->direction = 1;
                  }
                  entry->setpoint = target;
                  id(room_card_swept) = true;

                  // -- Only this card is repainted, not the page: a full
                  //    refresh_room_cards at the long-press repeat rate
                  //    would invalidate sixty-four tiles ten times a second
                  //    for one number. Child 1 is the reading; see the child
                  //    order in media_controller_grid.h. --
                  if (media_controller_grid::card_shows_reading(placed[index],
                                                                entry)) {
                    lv_obj_t *reading = lv_obj_get_child(pressed, 1);
                    std::string text = media_controller_grid::card_reading(*entry);
                    if (reading != NULL && !text.empty())
                      lv_label_set_text(reading, text.c_str());
                  }
                  break;
                }
                case LV_EVENT_RELEASED:
                  // -- Where a setpoint sweep is committed. RELEASED and not
                  //    CLICKED, because a finger that slides off the card
                  //    still ends the sweep and still means it; LVGL sends
                  //    RELEASED in both cases and CLICKED in only one. --
                  if (id(room_card_swept) && !std::isnan(entry->setpoint)) {
                    id(cmd_entity_set_temperature)->execute(entry->entity,
                                                            entry->setpoint);
                  }
                  id(room_card_swept) = false;
                  break;
                case LV_EVENT_CLICKED:
                  // -- A release that ended a sweep, or one that happened
                  // -- while the page was already sliding away, is not a
                  // -- tap. Neither is a tap on an element Home Assistant
                  // -- offered no `toggle` for: a thermostat that cannot be
                  // -- turned off is a card that reads rather than acts. A
                  // -- reading never toggles even if one were offered, the
                  // -- way the T560 panel never acts on a weather block. --
                  if (!id(room_card_long_active) &&
                      !id(switches_swipe_active) && entry->togglable &&
                      !media_controller_grid::entry_is_reading(*entry)) {
                    id(cmd_entity_toggle)->execute(entry->entity);
                  }
                  id(room_card_long_active) = false;
                  break;
                default:
                  break;
              }
            }, LV_EVENT_ALL, nullptr);
            }
          }

          ESP_LOGD("room", "Built %u room card(s)",
                   (unsigned) cards.size());
      - script.execute: refresh_room_cards

  # -- What a state poll changes, and the only thing it changes: the cards
  # -- themselves are not rebuilt, because nothing about their geometry moved.
  # -- Children are walked by index, which is the order rebuild_room_grid
  # -- created them in. --
  - id: refresh_room_cards
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          lv_obj_t *root = (lv_obj_t *) id(room_grid_root);
          const auto &cards = id(room_grid)->cards();
          uint32_t built = lv_obj_get_child_count(root);

          for (size_t i = 0; i < cards.size() && i < built; i++) {
            lv_obj_t *tile = lv_obj_get_child(root, (int32_t) i);
            const auto *entry = id(room_grid)->entry(cards[i].rid);

            // -- Three states and not two. A card whose element Home
            //    Assistant no longer carries, or whose entity is
            //    unavailable, must not read as "off": off is a fact and this
            //    is the absence of one.
            // --
            // -- What counts as "on" is the component's to answer, because a
            //    thermostat's state is a mode rather than the word "on" and
            //    card_reading has to agree with this line. --
            bool known = entry != nullptr &&
                         media_controller_grid::entry_is_known(*entry);
            bool on = known && media_controller_grid::entry_is_on(*entry);
            // -- A weather block and a sensor block wear their own sky
            //    rather than the off grey: they are information, not a
            //    switch left off. A weather block keeps the T560 sky border
            //    it was built with; a sensor keeps the dimmer one. --
            bool is_weather =
                entry != nullptr &&
                entry->domain == media_controller_grid::DOMAIN_WEATHER;
            bool reading =
                entry != nullptr &&
                media_controller_grid::entry_is_reading(*entry);

            lv_obj_set_style_border_color(
                tile,
                !known ? lv_color_hex(0x59303c)
                       : (on ? lv_color_hex(0x00cfff)
                             : (is_weather ? lv_color_hex(0x6fb3e8)
                                : (reading ? lv_color_hex(0x3d6a99)
                                           : lv_color_hex(0x505078)))),
                0);
            // -- An active card reads at a glance: a wider accent border on
            //    top of the colour, the way the four fixed buttons glow. --
            lv_obj_set_style_border_width(tile, on ? 3 : 2, 0);

            lv_obj_t *icon = lv_obj_get_child(tile, 0);
            if (icon != NULL) {
              lv_obj_set_style_img_recolor(icon, lv_color_hex(0x1a1a2c), 0);
              lv_obj_set_style_img_recolor_opa(icon, on ? LV_OPA_TRANSP : 150,
                                               0);
              lv_obj_set_style_img_opa(icon, known ? LV_OPA_COVER : 90, 0);
            }

            // -- The value line. Child 1 on every labelled card of a known
            //    domain and on a compact sensor or weather card; see the
            //    child order in media_controller_grid.h: the reading on a
            //    thermostat, sensor or cover card, ON/OFF on a light or
            //    switch card, and the hero temperature on a large weather
            //    card, with the condition line in child 2 beneath it.
            // --
            // -- The guard is "has this element ever been answered", not
            //    "is the new reading empty". Skipping an empty reading would
            //    leave a thermostat that was just switched off showing the
            //    setpoint it used to have; skipping until the first answer
            //    is what actually stops a card being blanked before the poll
            //    has said anything about it. --
            bool weather_large =
                is_weather &&
                media_controller_grid::card_is_labelled(cards[i]) &&
                !media_controller_grid::card_shows_compact(cards[i], entry);
            if (weather_large) {
              lv_obj_t *hero = lv_obj_get_child(tile, 1);
              lv_obj_t *sub = lv_obj_get_child(tile, 2);
              if (hero != NULL && entry != nullptr &&
                  !entry->state.empty()) {
                std::string hero_text =
                    media_controller_grid::weather_hero(*entry);
                // -- Written unconditionally, the way the reading is: an
                //    empty string keeps the hero blank until the state poll
                //    answers, and overwrites a stale one the moment it
                //    does. --
                lv_label_set_text(hero, hero_text.c_str());
              }
              if (sub != NULL && entry != nullptr &&
                  !entry->state.empty()) {
                lv_label_set_text(
                    sub,
                    media_controller_grid::weather_sub(*entry).c_str());
              }
            } else if (media_controller_grid::card_shows_reading(cards[i],
                                                                  entry) ||
                       media_controller_grid::card_shows_compact(cards[i],
                                                                 entry)) {
              lv_obj_t *reading = lv_obj_get_child(tile, 1);
              if (reading != NULL && !entry->state.empty()) {
                lv_label_set_text(
                    reading,
                    media_controller_grid::card_reading(*entry).c_str());
                // -- ON on a lamp, a socket or a blind draws in the accent;
                //    OFF stays in the dim reading grey. --
                if (entry->domain == media_controller_grid::DOMAIN_LIGHT ||
                    entry->domain == media_controller_grid::DOMAIN_SWITCH ||
                    entry->domain == media_controller_grid::DOMAIN_COVER) {
                  bool on_value =
                      media_controller_grid::entry_is_on(*entry);
                  lv_obj_set_style_text_color(
                      reading,
                      on_value ? lv_color_hex(0x00cfff)
                               : lv_color_hex(0x8f8fb4),
                      0);
                }
              }
            }

            // -- The coming days on a large weather card, children 3 and up
            //    (child 1 is the hero, child 2 the condition); see the child
            //    order in media_controller_grid.h. Written unconditionally,
            //    the way the reading is: an empty string keeps a row blank
            //    until its forecast poll answers, and overwrites a stale one
            //    the moment it does. --
            uint8_t forecast_rows =
                media_controller_grid::card_forecast_rows(cards[i], entry);
            for (uint8_t row = 0; row < forecast_rows; row++) {
              lv_obj_t *forecast = lv_obj_get_child(tile, 3 + (int32_t) row);
              if (forecast == NULL)
                break;
              std::string text;
              if (entry != nullptr && !entry->state.empty())
                text = media_controller_grid::forecast_text_colored(*entry,
                                                                     row);
              lv_label_set_text(forecast, text.c_str());
            }
          }

  # ════════════════════════════════════════════════════════════
  # THE ROOM LAYOUT BACKUP
  # ════════════════════════════════════════════════════════════
  # The grid lives on this device: it is edited here, in the page the grid
  # component serves, and Home Assistant has no opinion about it. What Home
  # Assistant has is somewhere durable to put a copy, which is the one thing
  # this device cannot provide for itself — erasing flash, or replacing the
  # board, loses the NVS blob. The panel_id is derived from the MAC, the same
  # one this device paired and reports with, so a reflashed device finds its
  # own copy again and no other device can read it.
  #
  # The body is the layout document, byte for byte. Home Assistant never
  # parses it: the grid format belongs to the client that draws it.

  - id: backup_room_layout
    mode: restart
    parameters:
      document: string
    then:
      - if:
          condition:
            lambda: return !id(ha_token).empty();
          then:
            - http_request.send:
                method: PUT
                url: !lambda |-
                  return id(ha_base) + "/api/media_controller/panel_layout/" +
                         get_mac_address();
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "text/plain"
                body: !lambda return document;
                capture_response: false

  # -- Asked for by the editor, answered on the main loop. An http_request on
  # -- ESP-IDF blocks it, so this cannot run inside the HTTP handler that was
  # -- asked; the component takes the request, answers "queued", and hears
  # -- the outcome here. --
  - id: restore_room_layout
    mode: restart
    then:
      - if:
          condition:
            lambda: return !id(ha_token).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return id(ha_base) + "/api/media_controller/panel_layout/" +
                         get_mac_address();
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                # -- The ceiling the backup endpoint itself enforces. --
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(room_grid)->restore_finished(true, body, "");
                        } else if (response->status_code == 404) {
                          id(room_grid)->restore_finished(
                              false, "",
                              "Home Assistant holds no copy of this layout.");
                        } else {
                          char buf[64];
                          snprintf(buf, sizeof(buf),
                                   "Home Assistant answered HTTP %d.",
                                   response->status_code);
                          id(room_grid)->restore_finished(false, "", buf);
                        }
                on_error:
                  then:
                    - lambda: |-
                        id(room_grid)->restore_finished(
                            false, "", "Home Assistant could not be reached.");
          else:
            - lambda: |-
                id(room_grid)->restore_finished(
                    false, "", "This device is not paired yet.");

  # ════════════════════════════════════════════════════════════
  # FIRMWARE UPDATES
  # ════════════════════════════════════════════════════════════
  # Two scripts and two poll cycles. The first asks Home Assistant, with this
  # device's token, where the image is; the second fetches it and writes it.
  #
  # The split is not decoration. ESPHome's update client cannot send an
  # Authorization header -- its flash action takes a URL, an MD5 and HTTP
  # Basic credentials, and nothing else -- so the request that proves who this
  # device is and the request that carries two megabytes cannot be the same
  # request. The manifest call is the authenticated one and it answers with a
  # path carrying a single-use nonce; the download presents that. The nonce is
  # not the token: it names one panel and one version, it is spent the first
  # time it is used, and it expires on its own a few minutes later.

  - id: start_firmware_update
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_token).empty() && !id(want_update_version).empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return id(ha_base) +
                         "/api/media_controller/panel_firmware/" +
                         get_mac_address();
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  then:
                    - lambda: |-
                        id(update_url) = "";
                        id(update_md5) = "";
                        id(update_attempts) = id(update_attempts) + 1;
                        // -- Half a minute before asking again, and five
                        //    attempts in all. Home Assistant verifies the
                        //    image before it asks for anything, so a "not
                        //    ready" here means it restarted in between and
                        //    the request no longer stands. --
                        id(update_next_try_ms) = millis() + 30000;

                        if (response->status_code == 401 ||
                            response->status_code == 403) {
                          // -- The same answer every other endpoint gives a
                          //    revoked token, and the same response to it. --
                          id(want_update_version) = "";
                          id(forget_token)->execute();
                          return;
                        }
                        if (response->status_code != 200) {
                          ESP_LOGW("ota", "Firmware manifest HTTP %d",
                                   response->status_code);
                        } else {
                          std::string status = id(json_field)(body, "status");
                          std::string version = id(json_field)(body,
                                                               "version");
                          std::string path = id(json_field)(body, "path");
                          std::string md5 = id(json_field)(body, "md5");
                          if (status != "ok") {
                            ESP_LOGW("ota", "Home Assistant answered '%s'",
                                     status.c_str());
                          } else if (version != id(want_update_version)) {
                            // -- Home Assistant is offering something other
                            //    than what this device was told to install.
                            //    Nothing good comes of guessing which is
                            //    right, so neither is installed. --
                            ESP_LOGW("ota",
                                     "Asked for %s and offered %s; not "
                                     "installing either",
                                     id(want_update_version).c_str(),
                                     version.c_str());
                            id(want_update_version) = "";
                          } else if (md5.size() != 32 ||
                                     path.rfind(
                                         "/api/media_controller/panel_firmware/",
                                         0) != 0) {
                            // -- The path is a path on this Home Assistant
                            //    and on this route. It is joined to ha_base
                            //    below, so an answer naming anywhere else is
                            //    refused here rather than fetched. --
                            ESP_LOGW("ota", "The firmware manifest is not "
                                            "usable");
                          } else {
                            id(update_url) = id(ha_base) + path;
                            id(update_md5) = md5;
                          }
                        }

                        if (id(update_url).empty() &&
                            id(update_attempts) >= 5) {
                          ESP_LOGE("ota", "Giving up on firmware %s",
                                   id(want_update_version).c_str());
                          id(want_update_version) = "";
                        }
                on_error:
                  then:
                    - lambda: |-
                        id(update_attempts) = id(update_attempts) + 1;
                        id(update_next_try_ms) = millis() + 30000;
                        if (id(update_attempts) >= 5) {
                          id(want_update_version) = "";
                        }
                        ESP_LOGW("ota", "Home Assistant could not be reached "
                                        "for the firmware manifest");

  - id: install_firmware
    mode: single
    then:
      - lambda: |-
          id(update_target_version) = id(want_update_version);
          id(want_update_version) = "";
          ESP_LOGW("ota", "Installing firmware %s",
                   id(update_target_version).c_str());
      # -- The screen has to say what is happening before the loop stops
      # -- running it. Everything after the delay below blocks: ESPHome writes
      # -- the inactive application slot from the main loop, feeding only the
      # -- watchdog, so LVGL's refresh timer never runs, touch does nothing
      # -- and this device answers nothing for the minute or so it takes.
      # -- What still moves is the bar on that frame, and only because the
      # -- update client hands a percentage back about once a second and the
      # -- on_progress trigger on the ota component above repaints the screen
      # -- by hand. Nothing else on this device is redrawn in that window.
      # --
      # -- The screen is woken first for the same reason. A panel that was
      # -- asleep when the update started would otherwise spend the write
      # -- black, and be indistinguishable from one that had died. --
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
      - light.turn_on: backlight
      - lambda: |-
          id(screen_keep_awake) = true;
          std::string hint = "Installing " + id(update_target_version) +
                             " - do not switch this off";
          lv_label_set_text(id(lbl_update_hint), hint.c_str());
          // -- An empty bar rather than whatever a previous attempt left on
          // -- it: this page is shown again on a retry, and a bar that
          // -- started at the last failure's 60% would be a lie about the
          // -- write that is only starting now. --
          id(update_progress_shown) = -1;
          lv_bar_set_value(id(bar_update_progress), 0, LV_ANIM_OFF);
          lv_label_set_text(id(lbl_update_percent), "0%");
      - lvgl.page.show: page_updating
      # -- Long enough for LVGL to render the page above and for the target
      # -- version to reach flash. Both matter: the frame is what the person
      # -- in the room sees for the next minute, and the version in flash is
      # -- the only thing the *next* boot can use to tell an update that
      # -- worked from one the bootloader rolled back. --
      - delay: 1s
      - lambda: global_preferences->sync();
      - delay: 200ms
      - ota.http_request.flash:
          id: panel_ota
          url: !lambda return id(update_url);
          md5: !lambda return id(update_md5);

  # -- What tells the bootloader to keep this image, and the only thing that
  # -- does: safe_mode's own timer is set long enough that it cannot get there
  # -- first. It asks for more than "the loop is still running", because a
  # -- build that runs and cannot reach Home Assistant is exactly the build
  # -- this whole mechanism exists to undo. Both halves have to be true: the
  # -- config sensor parsed, and a status report accepted. --
  - id: confirm_boot
    then:
      - if:
          condition:
            lambda: return !id(boot_confirmed) && id(config_seen);
          then:
            - lambda: |-
                id(boot_confirmed) = true;
                id(update_proving) = false;
                if (!id(update_target_version).empty()) {
                  ESP_LOGI("ota",
                           "Firmware %s reached Home Assistant; the "
                           "bootloader will keep it",
                           id(update_target_version).c_str());
                  id(update_target_version) = "";
                  id(screen_keep_awake) = false;
                }
            - safe_mode.mark_successful:

  # -- Home Assistant cannot ask this device anything, so what it knows about
  # -- it is pushed. There is no battery to report; the integration expects an
  # -- absent one. --
  - id: report_status
    mode: restart
    then:
      - if:
          condition:
            lambda: return !id(ha_token).empty();
          then:
            # -- The heap figures below are whatever the debug component
            # -- last read on its own five-minute clock, and this deliberately
            # -- does not ask it for a fresh one. Reading them stalls the
            # -- display -- see the debug component in the interface half --
            # -- and a report goes out on a page change, so asking here ran
            # -- that stall on the beat of somebody touching the screen. The
            # -- display counters further down are not affected: they are
            # -- kept by the panel's own interrupts and cost nothing to read.
            - http_request.post:
                url: !lambda |-
                  return id(ha_base) + "/api/media_controller/panel_status";
                request_headers:
                  Authorization: !lambda return id(auth_header).c_str();
                  Content-Type: "application/json"
                # -- No battery and no signal strength: this device is mains
                # -- powered, and the importing configuration decides whether
                # -- it is on Wi-Fi or Ethernet at all, so the package cannot
                # -- declare a wifi_signal sensor. Both are optional in the
                # -- contract, and the report is what keeps
                # -- binary_sensor.<panel>_connected honest. --
                body: !lambda |-
                  // -- Sized for the longest single snprintf below, which
                  // -- is the display block: four keys whose ceilings in
                  // -- the contract add up past a hundred characters. A
                  // -- short buffer here does not warn, it truncates, and
                  // -- a truncated key is a report Home Assistant rejects
                  // -- as unusable. --
                  char buf[160];
                  std::string json =
                    std::string("{\"panel_id\":\"") + get_mac_address() +
                    "\",\"version\":\"${firmware_version}\","
                    // -- The release number above says when this build
                    // -- shipped; this says what it understands, and is what
                    // -- lets Home Assistant notice a device running a build
                    // -- older than the contract it speaks. --
                    "\"contract_version\":${contract_version},"
                    "\"page\":\"" + id(current_page) + "\","
                    "\"uptime_seconds\":" +
                    std::to_string((unsigned) (millis() / 1000));
                  int rssi = isnan(id(wifi_signal_dbm).state)
                               ? -127 : (int) id(wifi_signal_dbm).state;
                  if (rssi != -127) {
                    snprintf(buf, sizeof(buf), ",\"wifi_dbm\":%d", rssi);
                    json += buf;
                  }
                  if (!isnan(id(esp32_temperature).state)) {
                    snprintf(buf, sizeof(buf), ",\"temperature_c\":%.1f",
                             id(esp32_temperature).state);
                    json += buf;
                  }
                  // -- Where the layout editor this device serves answers,
                  // -- so that Home Assistant can offer it on this device's
                  // -- panel page. The address is the device's own and
                  // -- nowhere else: the port belongs to the grid component
                  // -- and the routable interface is only known here. A
                  // -- device that has no address yet sends nothing. --
                  std::string editor = id(room_grid)->editor_url();
                  if (!editor.empty())
                    json += ",\"editor_url\":\"" + editor + "\"";
                  // -- What Home Assistant has to put on a push for this
                  // -- device to listen to it. Sent on every report rather
                  // -- than once, because this is the only channel it travels
                  // -- on: a Home Assistant that was restored from a backup
                  // -- taken before the last pairing would otherwise never
                  // -- learn the current one. It is hex from the device's own
                  // -- generator and means nothing anywhere else.
                  // --
                  // -- Sent even when it is empty, and that is the point. This
                  // -- device has no log anybody can read -- contract version
                  // -- 9 removed the native API, so there is no ESPHome device
                  // -- page and no way to reach a console short of a cable to
                  // -- a panel on a wall. The report is the only channel out.
                  // -- An absent key and an empty one are different faults --
                  // -- a build too old to have one, against a build that has
                  // -- one and did not mint it -- and a field that vanishes
                  // -- when empty makes them look identical from the far end.
                  json += ",\"push_key\":\"" + id(push_key) + "\"";
                  // -- The diagnostics block: what the seven ESPHome debug
                  // -- entities used to publish over the native API, in the
                  // -- report that was already going. Each key is omitted
                  // -- when the reading is not available yet, because the
                  // -- contract reads an absent key as "not reported" and a
                  // -- zero as a measurement. --
                  json += ",\"diagnostics\":{";
                  bool first = true;
                  auto number = [&](const char *key, float value,
                                    const char *format) {
                    if (isnan(value) || value < 0) return;
                    snprintf(buf, sizeof(buf), format, value);
                    if (!first) json += ",";
                    json += std::string("\"") + key + "\":" + buf;
                    first = false;
                  };
                  number("heap_free", id(debug_heap_free).state, "%.0f");
                  number("heap_max_block", id(debug_heap_max_block).state,
                         "%.0f");
                  number("heap_min_free", id(debug_heap_min_free).state,
                         "%.0f");
                  number("heap_fragmentation",
                         id(debug_heap_fragmentation).state, "%.0f");
                  number("psram_free", id(debug_psram_free).state, "%.0f");
                  number("loop_time", id(debug_loop_time).state, "%.0f");
                  // -- Reset as it is read, so that each report covers the
                  // -- window since the last one rather than the whole
                  // -- uptime. Reported even when it is zero: a window with
                  // -- no request in it is a real measurement and not a
                  // -- missing one. --
                  snprintf(buf, sizeof(buf), "%u",
                           (unsigned) id(http_max_ms));
                  if (!first) json += ",";
                  json += std::string("\"http_ms\":") + buf;
                  first = false;
                  id(http_max_ms) = 0;
                  snprintf(buf, sizeof(buf), "%u",
                           (unsigned) id(parse_max_ms));
                  json += std::string(",\"parse_ms\":") + buf;
                  id(parse_max_ms) = 0;
                  // -- What the display peripheral itself did since the last
                  // -- report, read and reset in one call. This is the only
                  // -- way anybody sees these: they are counted in the VSYNC
                  // -- and frame-complete interrupts, on a device with no log
                  // -- and no ESPHome device page. `desyncs` is the one that
                  // -- matters -- every count is a restarted DMA channel and
                  // -- a frame that visibly jumped -- and `fps` is what says
                  // -- whether a pixel clock raised in the interface half
                  // -- actually arrived. --
                  auto lcd = id(tft_display)->take_stats();
                  snprintf(buf, sizeof(buf),
                           ",\"display_fps\":%.1f,\"display_desyncs\":%u,"
                           "\"display_flushes\":%u,\"display_jitter_us\":%u",
                           lcd.fps, (unsigned) lcd.desyncs,
                           (unsigned) lcd.flushes, (unsigned) lcd.jitter_us);
                  json += buf;
                  const std::string &reason =
                      id(debug_reset_reason).state;
                  if (!reason.empty()) {
                    if (!first) json += ",";
                    json += "\"reset_reason\":\"" + reason + "\"";
                  }
                  json += "}";
                  snprintf(buf, sizeof(buf),
                           ",\"display\":{\"available\":true,\"on\":%s,"
                           "\"brightness\":%d}}",
                           id(backlight).remote_values.is_on() ? "true"
                                                               : "false",
                           (int) (id(backlight).remote_values.get_brightness()
                                  * 100.0f));
                  json += buf;
                  id(last_report_page) = id(current_page);
                  return json;
                capture_response: false
                on_response:
                  then:
                    # -- The second half of what confirms a new image. A
                    # -- report Home Assistant accepted proves the token, the
                    # -- address and the network are all still good on this
                    # -- build, which is the whole of what a rollback would
                    # -- otherwise have to guess at. --
                    - lambda: |-
                        if (response->status_code >= 200 &&
                            response->status_code < 300) {
                          id(confirm_boot)->execute();
                        }

# -------------------- THE POLL CYCLE --------------------
# ESPHome cannot retune an interval at runtime, so the tick is fixed and each
# job decides for itself whether enough time has passed. Home Assistant owns
# the two intervals; they arrive in the config sensor.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          uint32_t now = millis();

          if (id(ha_token).empty()) {
            // -- A device that was never told where Home Assistant is cannot
            //    ask it for anything. That is the factory image: it waits on
            //    the provisioning endpoint instead, and Home Assistant finds
            //    it over mDNS. --
            if (id(ha_base).empty()) {
              return;
            }
            // -- 404 means Home Assistant has never heard of this device, and
            //    that can last for days: an unopened box on a shelf must not
            //    poll every three seconds, because each request blocks the
            //    main loop and ESPHome logs every non-2xx answer as an error.
            //    Any other answer means somebody is adding it right now, so
            //    the fast rate comes straight back. The first two minutes are
            //    always fast, for the common case of flashing a device and
            //    adding it immediately. --
            uint32_t wait = 3000;
            if (id(last_pairing_status) == 404 && now > 120000) {
              wait = 15000;
            }
            if (id(last_pairing_poll_ms) == 0 ||
                now - id(last_pairing_poll_ms) >= wait) {
              id(last_pairing_poll_ms) = now;
              id(poll_pairing)->execute();
            }
            return;
          }

          // -- The two payloads the screen is drawn from go in the SAME
          //    tick, deliberately, and the jobs behind them are what yield.
          //
          //    Every job below blocks the main loop from the moment it is
          //    executed until the response is parsed: http_request has no
          //    asynchronous form, and the ESP-IDF client is built and torn
          //    down around each call, so a request is a connection as well as
          //    a transfer. The main task is pinned to CPU0 and so is the
          //    interrupt that refills the display's bounce buffer, so a
          //    request competes with the one job that cannot wait; miss
          //    enough EOFs and the VSYNC interrupt resets the DMA channel,
          //    which is the recovery working as designed and also the twitch
          //    that is seen.
          //
          //    This was written the other way round first -- one request per
          //    tick, so that no single iteration cost two of them -- and that
          //    is the wrong thing to minimise. It halved the longest stall
          //    and doubled the number of them, and what a person watching the
          //    screen counts is disturbances, not milliseconds: two stalls a
          //    quarter of a second apart read as two twitches, and one stall
          //    of twice the length reads as one. So the player and the config
          //    sensor are asked for together, and everything rarer than they
          //    are waits for a tick they are not using.
          bool spent = false;

          // -- What Home Assistant is delivering does not need asking for.
          //    While pushes are arriving, the two polls below drop to a
          //    heartbeat: they stop being how the screen keeps up and become
          //    how this device notices that the pushes stopped -- an
          //    integration that was disabled, a Home Assistant that was
          //    restored from a backup older than this pairing, a key that no
          //    longer matches. Thirty seconds of a stale title is the worst
          //    that costs, and only in the window where delivery has already
          //    failed.
          //
          //    The two windows are deliberately different sizes, and the
          //    first version of this got that wrong in a way worth recording:
          //    it trusted a push for exactly as long as the fallback interval,
          //    so a panel went back to asking every second thirty seconds
          //    after the last change. On a track that is playing steadily
          //    nothing changes for minutes at a time, so that is most of the
          //    time -- and the fast polling it fell back into is what was
          //    being watched on the screen. Delivery working looks like
          //    silence, and silence must not be read as failure.
          //
          //    So the trust window is minutes and the fallback rate is
          //    seconds. A push inside the last five minutes means Home
          //    Assistant is still there and still delivering, and a heartbeat
          //    every thirty seconds is enough to notice when it stops.
          //
          //    last_push_ms is zero until the first one lands, and that is
          //    checked rather than subtracted from -- millis() is small
          //    enough early after a boot that the arithmetic alone would read
          //    as recent. The interval is only ever slowed, never sped up: a
          //    configuration that already asks less often than the fallback
          //    is honoured as it stands. --
          const uint32_t PUSH_TRUSTED_MS = 300000;
          const uint32_t PUSH_FALLBACK_MS = 30000;
          uint32_t interval = id(poll_interval_ms);
          if (id(last_push_ms) != 0 &&
              now - id(last_push_ms) < PUSH_TRUSTED_MS &&
              interval < PUSH_FALLBACK_MS) {
            interval = PUSH_FALLBACK_MS;
          }

          // -- The player first: it is the payload the eye is on, and it is
          //    the small one. It is drawn by the three home layouts, and the
          //    queue page follows it too: a title change is what tells this
          //    device that the queue behind the page it is showing has moved
          //    on. Nothing on the playlists page mentions the player, and the
          //    room page mentions it even less. --
          if ((id(current_page) == "player" ||
               id(current_page) == "queue") &&
              now - id(last_player_poll_ms) >= interval) {
            id(last_player_poll_ms) = now;
            spent = true;
            id(poll_player)->execute();
          }
          // -- Deliberately not behind `spent`: this is the other half of the
          //    same tick, not a job competing for it. --

          // -- The config sensor is the one payload with no page of its own.
          //    It is read every cycle whatever is showing, because it is also
          //    the channel Home Assistant sends display, brightness, page and
          //    restart commands through, and it carries the room card states.
          //    It is also the largest response this device reads, which is
          //    why it yields the tick to the player rather than the other way
          //    round. Both clocks run at poll_interval_ms, so after the first
          //    contested tick they settle a tick apart and neither waits
          //    again. --
          if (now - id(last_poll_ms) >= interval) {
            id(last_poll_ms) = now;
            spent = true;
            id(ui_load_room_config)->execute();
          }

          // -- Room states need no poll of their own: they ride the config
          //    poll above, in the room_states block, because the template
          //    endpoint they used to come through answers administrators
          //    only. --

          // -- The forecast behind the weather blocks: at once when the
          //    room page is the one showing and there is something to ask
          //    for, then every half hour for as long as it stays showing.
          //    The clock does not start until the component names an
          //    entity, so a page with no weather on it never pays for one,
          //    and a clock that went stale behind another page is due the
          //    moment the room page opens again. --
          if (!spent && !id(ha_token).empty() &&
              id(current_page) == "room" &&
              (id(last_forecast_poll_ms) == 0 ||
               now - id(last_forecast_poll_ms) >= 1800000)) {
            id(last_forecast_poll_ms) = now;
            spent = true;
            id(poll_room_forecast)->execute();
          }

          // -- Which pictures exist: once after pairing and then every
          //    six hours. It changes when the integration is upgraded and
          //    never otherwise, so anything oftener would be a request
          //    spent on an answer that is always the same. Not scoped to
          //    the room page, and neither is the picture fetch below: both
          //    are one-shot fills that stop of their own accord, and the
          //    layout editor this device serves lists the catalog whatever
          //    page the screen is on. --
          if (!spent && !id(ha_token).empty() &&
              (id(last_catalog_poll_ms) == 0 ||
               now - id(last_catalog_poll_ms) >=
                   id(catalog_poll_interval_ms))) {
            id(last_catalog_poll_ms) = now;
            spent = true;
            id(poll_icon_catalog)->execute();
          }

          // -- One picture at a time, and only when the component says it
          //    wants one: only artwork used by layout cards. Each is six
          //    kilobytes through a request that blocks the main loop, so
          //    they are spread over the tick rather than fetched in a burst
          //    that would be felt as a stall under a finger. --
          if (!spent && id(fetching_icon).empty()) {
            std::string wanted = id(room_grid)->next_wanted_icon();
            if (!wanted.empty()) {
              spent = true;
              id(fetch_room_icon)->execute(wanted);
            }
          }

          // -- Fetched only behind the page that lists them: as soon as
          //    the config sensor has named the playlists entity, then on
          //    its own interval. The clock does not start until there is
          //    something to ask for, so a device that is paired while the
          //    playlists page is open does not show it empty for a minute,
          //    and refresh_playlists brings the first fetch forward to the
          //    moment the page opens. --
          if (!spent && !id(playlists_entity).empty() &&
              id(current_page) == "playlists" &&
              (id(last_playlist_poll_ms) == 0 ||
               now - id(last_playlist_poll_ms) >=
                   id(playlist_poll_interval_ms))) {
            id(last_playlist_poll_ms) = now;
            spent = true;
            id(poll_playlists)->execute();
          }

          if (!spent &&
              (id(last_report_page) != id(current_page) ||
               id(last_report_ms) == 0 ||
               now - id(last_report_ms) >= 60000)) {
            id(last_report_ms) = now;
            spent = true;
            id(report_status)->execute();
          }

          // -- The failure the bootloader cannot see. It rolls an image back
          //    when the device resets before that image was confirmed, so a
          //    build that crashes or bootloops is covered without anything
          //    here. A build that boots, runs, and can never reach Home
          //    Assistant again is not: nothing resets, so nothing rolls
          //    back, and a panel on a wall is stranded on it.
          //
          //    Ten minutes, and then this resets on purpose. The reset is
          //    the mechanism -- it hands the decision to the bootloader,
          //    which still has the previous image and still has this one
          //    marked unverified. It runs only on the first boot after an
          //    update, so a panel whose Home Assistant is simply down does
          //    not reboot itself every ten minutes forever. --
          if (id(update_proving) && !id(boot_confirmed) &&
              now - id(update_proving_since_ms) >= 600000) {
            id(update_proving) = false;
            ESP_LOGE("ota",
                     "Firmware ${firmware_version} did not reach Home "
                     "Assistant within ten minutes; restarting so the "
                     "bootloader rolls back");
            App.safe_reboot();
          }

# -------------------- ROOM CARD ARTWORK --------------------
# The same four files the interface already draws at 128 px, decoded again at
# the size a grid card uses. A second asset rather than a scale: this build
# sets LV_COLOR_16_SWAP and leaves LV_DRAW_SW_SUPPORT_SWAPPED off, so LVGL
# cannot transform a swapped RGB565 source at all. Declared here beside the
# grid that draws them.
image:
  - platform: file
    file: "${asset_base_url}/1lamp.png"
    id: card_icon_light1
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/2lamps.png"
    id: card_icon_light2
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/fan.png"
    id: card_icon_fan
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/ac.png"
    id: card_icon_ac
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/blind.png"
    id: card_icon_blind
    resize: 40x40
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/weather.png"
    id: card_icon_weather
    resize: 40x40
    type: RGB
    transparency: alpha_channel

# -------------------- THE PAGES THIS FILE ADDS --------------------
# Appended to the pages the interface package defines, because both are about
# Home Assistant rather than about widgets. The room grid replaces the four
# fixed buttons the interface draws, and the pairing screen is what a person
# sees before the device belongs to a Home Assistant.
lvgl:
  pages:
    # -- The room grid. Empty at compile time on purpose: what is on it comes
    # -- from the layout in flash and the registry in the config sensor, and
    # -- rebuild_room_grid is the only thing that puts anything here.
    # --
    # -- No heading and no hint. Eight rows of exactly 60 px need all 480, and
    # -- "tap to toggle | hold lights to dim" stops being true the moment the
    # -- person arranging the page decides what is on it. --
    - id: page_room_grid
      # -- Stated rather than assumed. A cell is exactly 60 px only if the
      # -- grid starts at the very top left of the screen, and a page that
      # -- inherited any padding would push all eight columns inwards and
      # -- clip the eighth. --
      pad_all: 0
      border_width: 0
      on_load:
        - lambda: id(current_page) = "room";
        - lambda: id(switches_swipe_active) = false;
        - script.execute: refresh_room
      on_swipe_right:
        - lambda: id(switches_swipe_active) = true;
        - script.execute: nav_home_move_right
      on_swipe_left:
        - lambda: id(switches_swipe_active) = true;
        - script.execute: nav_home_move_left
      widgets:
        - obj:
            id: room_grid_root
            width: 480
            height: 480
            align: TOP_LEFT
            x: 0
            y: 0
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            clickable: false
            scrollable: false
            gesture_bubble: true

        - label:
            id: lbl_room_grid_empty
            text: "No room controls yet"
            text_font: roboto_22
            text_color: 0x77779a
            align: CENTER
            hidden: true

        - label:
            id: lbl_room_grid_hint
            text: "Add them to this device in Home Assistant"
            text_font: roboto_16
            text_color: 0x55556f
            align: CENTER
            y: 34
            hidden: true

    - id: page_pairing
      widgets:
        - label:
            text: "MEDIA CONTROLLER"
            text_font: roboto_16
            text_color: 0x5588cc
            align: TOP_MID
            y: 90

        - label:
            id: lbl_pairing_code
            text: "------"
            text_font: roboto_36
            text_color: 0xffffff
            align: CENTER
            y: -20

        - label:
            id: lbl_pairing_hint
            text: "Add this device in Home Assistant"
            text_font: roboto_16
            text_color: 0x77779A
            align: CENTER
            y: 60

    # -- The last frame this device draws before an update, and the one that
    # -- stays on the glass for the whole write. The wording is an
    # -- instruction rather than a status because pulling the power here is
    # -- the one thing a person watching can do that makes matters worse, and
    # -- a minute of an unchanging screen is exactly what makes somebody
    # -- reach for the switch -- which is what the bar below is for. It is
    # -- the only widget on this device that moves while the flash is being
    # -- written, and it moves only because the ota component's on_progress
    # -- repaints this page by hand. --
    - id: page_updating
      widgets:
        - label:
            text: "MEDIA CONTROLLER"
            text_font: roboto_16
            text_color: 0x5588cc
            align: TOP_MID
            y: 90

        - label:
            text: "UPDATING"
            text_font: roboto_36
            text_color: 0xffffff
            align: CENTER
            y: -20

        - label:
            id: lbl_update_hint
            text: "Installing new firmware"
            text_font: roboto_16
            text_color: 0x77779A
            align: CENTER
            y: 60

        - bar:
            id: bar_update_progress
            width: 280
            height: 8
            align: CENTER
            y: 108
            min_value: 0
            max_value: 100
            value: 0
            # -- No animation, and it matters here rather than being a
            # -- preference: an animated bar is moved by an LVGL timer, and
            # -- no timer runs during the write. It would sit at whatever
            # -- fraction of the first step it managed. --
            animated: false
            radius: 4
            bg_color: 0x1a1a35
            bg_opa: COVER
            indicator:
              bg_color: 0x00cfff
              radius: 4

        - label:
            id: lbl_update_percent
            text: "0%"
            text_font: roboto_16
            text_color: 0x5588cc
            align: CENTER
            y: 134
