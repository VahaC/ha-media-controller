# Reference only. If ESPHome already has a global secrets.yaml, do not create a
# second file: merge only missing keys into the existing file, or change the
# !secret references in the device YAML to match your current key names.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Generate an ESPHome API encryption key; do not reuse this placeholder.
media_controller_api_encryption_key: "REPLACE_WITH_A_GENERATED_BASE64_KEY"
media_controller_ota_password: "REPLACE_WITH_A_UNIQUE_OTA_PASSWORD"
media_controller_fallback_ap_password: "REPLACE_WITH_A_UNIQUE_FALLBACK_PASSWORD"

# Dedicated Home Assistant long-lived access token required by the v1 REST
# queue/playlist/album-art transport. Never commit the real token.
media_controller_ha_token: "REPLACE_WITH_A_DEDICATED_LONG_LIVED_HA_TOKEN"
