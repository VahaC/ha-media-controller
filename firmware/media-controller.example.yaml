substitutions:
  device_name: media-controller
  friendly_name: Media Controller

  # Select the same Music Assistant player used in the integration Config Flow.
  player_entity: media_player.your_music_assistant_player

  # Copy the entity IDs created by the VahaC Media Controller integration.
  queue_entity: sensor.your_controller_queue
  playlists_entity: sensor.your_controller_playlists
  light1_entity: light.your_controller_light_1
  light2_entity: light.your_controller_light_2
  fan_entity: switch.your_controller_fan
  ac_entity: switch.your_controller_ac

  # Keep the URL local to Home Assistant. The v1 REST transport still needs a
  # dedicated long-lived HA token stored only in secrets.yaml.
  ha_url: "http://homeassistant.local:8123"
  ha_token: !secret media_controller_ha_token

  # Repository-local assets for development and validation.
  asset_base_url: assets

packages:
  media_controller: !include media-controller.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Media Controller Fallback"
    password: !secret media_controller_fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret media_controller_api_encryption_key

ota:
  - platform: esphome
    password: !secret media_controller_ota_password
