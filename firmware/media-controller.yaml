substitutions:
  device_name: media-controller
  friendly_name: Media Controller
  player_entity: media_player.replace_me
  queue_entity: sensor.replace_me_queue
  playlists_entity: sensor.replace_me_playlists
  light1_entity: light.replace_me_light_1
  light2_entity: light.replace_me_light_2
  fan_entity: switch.replace_me_fan
  ac_entity: switch.replace_me_ac
  config_entity: sensor.replace_me_config
  ha_url: "http://homeassistant.local:8123"
  ha_token: "replace_me"
  asset_base_url: "https://raw.githubusercontent.com/VahaC/ha-media-controller/main/firmware/assets"

# The interface — display, touchscreen, LVGL pages, theme — is shared with
# media-controller-paired.yaml and lives next to this file. See its header for
# the names the two halves agree on.
packages:
  ui: !include media-controller-ui.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: media_controller.esp32s3
    version: "0.9.0"

api:
  on_client_connected:
    then:
      - lambda: |-
          // -- Force reload album art on HA reconnect --
          std::string pic = id(entity_picture).state;
          if (pic != "None" && !pic.empty()) {
            std::string full_url = "${ha_url}" + pic;
            ESP_LOGD("img", "Reloading art on reconnect: %s", full_url.c_str());
            id(album_art).set_url(full_url.c_str());
            id(album_art_small).set_url(full_url.c_str());
          }
      - script.execute: ui_load_album_art
      - script.execute: ui_load_room_config
      - delay: 2s
      # -- Re-apply switches page button colors from the states HA just pushed on connect --
      - script.execute: apply_light1_style
      - script.execute: apply_light2_style
      - script.execute: apply_fan_style
      - script.execute: apply_ac_style
      - http_request.get:
          url: "${ha_url}/api/states/${playlists_entity}"
          request_headers:
            Authorization: "Bearer ${ha_token}"
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - script.execute:
                        id: rebuild_playlists
                        payload: !lambda return body;
                  else:
                    - lambda: |-
                        ESP_LOGW("playlists", "HTTP %d",
                                 response->status_code);

# -------------------- PLAYLIST FETCH --------------------
interval:
  # -- Fetch playlists from HA REST API every 5 minutes --
  - interval: 300s
    then:
      - http_request.get:
          url: "${ha_url}/api/states/${playlists_entity}"
          request_headers:
            Authorization: "Bearer ${ha_token}"
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - script.execute:
                        id: rebuild_playlists
                        payload: !lambda return body;
                  else:
                    - lambda: |-
                        ESP_LOGW("playlists", "HTTP %d",
                                 response->status_code);

script:
  - id: ui_load_room_config
    then:
      - http_request.get:
          url: "${ha_url}/api/states/${config_entity}"
          request_headers:
            Authorization: "Bearer ${ha_token}"
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - script.execute:
                        id: apply_slots
                        payload: !lambda return body;
                  else:
                    - lambda: |-
                        ESP_LOGW("slots", "Config sensor HTTP %d",
                                 response->status_code);

  - id: refresh_queue
    mode: restart
    then:
      - http_request.get:
          url: "${ha_url}/api/states/${queue_entity}"
          request_headers:
            Authorization: "Bearer ${ha_token}"
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - script.execute:
                        id: rebuild_queue
                        payload: !lambda return body;

  - id: play_queue_item
    then:
      - lambda: |-
          int idx = id(selected_queue_idx);
          if (idx >= 0 && idx < (int)id(queue_id_list).size()) {
            ESP_LOGD("queue", "Playing queue item: %s",
                     id(queue_id_list)[idx].c_str());
          }
      - homeassistant.service:
          service: media_controller.play_queue_item
          data:
            entity_id: ${player_entity}
            queue_item_id: !lambda |-
              int idx = id(selected_queue_idx);
              if (idx >= 0 && idx < (int)id(queue_id_list).size()) {
                return id(queue_id_list)[idx];
              }
              return std::string("");
      - script.execute: show_home_page

  # ════════════════════════════════════════════════════════════
  # COMMANDS
  # ════════════════════════════════════════════════════════════
  # Every action a widget performs on Home Assistant goes through one of these,
  # so that no widget names a transport. That is what lets the whole interface
  # be shared with the paired firmware, which defines the same names as HTTP
  # requests against the REST API instead of as native API calls.
  #
  # Renaming one of these, or changing what it takes, changes the interface
  # package too. Treat the set below as the boundary between the two halves.
  #
  # They are parallel because a widget must not swallow a second tap while the
  # first is still in flight; in the paired firmware each of these waits on a
  # network round trip.

  - id: cmd_prev
    mode: parallel
    max_runs: 4
    then:
      - homeassistant.service:
          service: media_player.media_previous_track
          data:
            entity_id: ${player_entity}

  - id: cmd_play_pause
    mode: parallel
    max_runs: 4
    then:
      - homeassistant.service:
          service: media_player.media_play_pause
          data:
            entity_id: ${player_entity}

  - id: cmd_next
    mode: parallel
    max_runs: 4
    then:
      - homeassistant.service:
          service: media_player.media_next_track
          data:
            entity_id: ${player_entity}

  - id: cmd_volume_down
    mode: parallel
    max_runs: 4
    then:
      - homeassistant.service:
          service: media_player.volume_down
          data:
            entity_id: ${player_entity}

  - id: cmd_volume_up
    mode: parallel
    max_runs: 4
    then:
      - homeassistant.service:
          service: media_player.volume_up
          data:
            entity_id: ${player_entity}

  # -- The slider reports 0-100; Home Assistant wants 0.00-1.00. --
  - id: cmd_volume_set
    mode: parallel
    max_runs: 4
    parameters:
      level: int
    then:
      - homeassistant.service:
          service: media_player.volume_set
          data:
            entity_id: ${player_entity}
            volume_level: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.2f", level / 100.0f);
              return std::string(buf);

  - id: cmd_shuffle_set
    mode: parallel
    max_runs: 4
    parameters:
      state: string
    then:
      - homeassistant.service:
          service: media_player.shuffle_set
          data:
            entity_id: ${player_entity}
            shuffle: !lambda return state;

  - id: cmd_repeat_set
    mode: parallel
    max_runs: 4
    parameters:
      mode: string
    then:
      - homeassistant.service:
          service: media_player.repeat_set
          data:
            entity_id: ${player_entity}
            repeat: !lambda return mode;

  # -- The playlist roller holds the selection; only the index travels. --
  - id: cmd_play_playlist
    mode: parallel
    max_runs: 4
    then:
      - homeassistant.service:
          service: music_assistant.play_media
          data:
            entity_id: ${player_entity}
            media_id: !lambda |-
              int idx = id(selected_playlist_idx);
              if (idx >= 0 && idx < (int)id(playlist_uris).size()) {
                return id(playlist_uris)[idx];
              }
              return std::string("");
            media_type: playlist

  # -- Slots are addressed by number, never by entity, because the interface
  # -- package must not know which entity sits behind a button. Here each
  # -- number resolves to a compile-time substitution; in the paired firmware
  # -- it resolves to whatever Home Assistant put in the config sensor. --
  - id: cmd_slot_toggle
    mode: parallel
    max_runs: 4
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: return slot == 1;
          then:
            - homeassistant.service:
                service: light.toggle
                data:
                  entity_id: ${light1_entity}
      - if:
          condition:
            lambda: return slot == 2;
          then:
            - homeassistant.service:
                service: light.toggle
                data:
                  entity_id: ${light2_entity}
      - if:
          condition:
            lambda: return slot == 3;
          then:
            - homeassistant.service:
                service: switch.toggle
                data:
                  entity_id: ${fan_entity}
      - if:
          condition:
            lambda: return slot == 4;
          then:
            - homeassistant.service:
                service: switch.toggle
                data:
                  entity_id: ${ac_entity}

  # -- Only slots 1 and 2 are lights on this client, so 3 and 4 do nothing. --
  - id: cmd_slot_brightness
    mode: parallel
    max_runs: 4
    parameters:
      slot: int
      pct: int
    then:
      - if:
          condition:
            lambda: return slot == 1;
          then:
            - homeassistant.service:
                service: light.turn_on
                data:
                  entity_id: ${light1_entity}
                  brightness_pct: !lambda return pct;
      - if:
          condition:
            lambda: return slot == 2;
          then:
            - homeassistant.service:
                service: light.turn_on
                data:
                  entity_id: ${light2_entity}
                  brightness_pct: !lambda return pct;

# -------------------- HA SENSORS --------------------
sensor:
  # -- Speaker volume level (0.0 - 1.0) --
  - platform: homeassistant
    id: volume_level
    entity_id: ${player_entity}
    attribute: volume_level
    on_value:
      then:
        - script.execute: ui_sync_volume

  # -- Track total duration in seconds --
  - platform: homeassistant
    id: media_duration
    entity_id: ${player_entity}
    attribute: media_duration
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("progress", "Duration received: %.1f", x);

  # -- Current playback position in seconds --
  # -- On each update from HA, arc is snapped to accurate position --
  - platform: homeassistant
    id: media_position
    entity_id: ${player_entity}
    attribute: media_position
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("progress", "Position received: %.1f", x);
        - script.execute: ui_sync_progress

text_sensor:
  # -- Page commands are exposed as the config sensor's JSON attribute by the
  # -- integration. Native API delivers the changed attribute as text. --
  - platform: homeassistant
    id: panel_commands
    entity_id: ${config_entity}
    attribute: commands
    on_value:
      then:
        - script.execute:
            id: show_panel_page
            page: !lambda |-
              size_t page_pos = x.find("\"page\":");
              if (page_pos == std::string::npos) return std::string("");
              size_t value_pos = x.find("\"value\":\"", page_pos);
              if (value_pos == std::string::npos) return std::string("");
              value_pos += 9;
              size_t end = x.find('"', value_pos);
              if (end == std::string::npos) return std::string("");
              return x.substr(value_pos, end - value_pos);

  # -- Track title --
  - platform: homeassistant
    id: media_title
    entity_id: ${player_entity}
    attribute: media_title
    on_value:
      then:
        - script.execute: ui_sync_title
        # The integration refreshes the queue three seconds after a title
        # change. Fetch after that debounce so the ESP32 does not read stale data.
        - delay: 4s
        - script.execute: refresh_queue

  # -- Album art URL (relative path from HA) --
  # -- Prefixed with ha_url substitution to form full URL --
  - platform: homeassistant
    id: entity_picture
    entity_id: ${player_entity}
    attribute: entity_picture_local
    on_value:
      then:
        - lambda: |-
            if (x == "None" || x.empty()) {
              ESP_LOGD("img", "No album art available, skipping");
              return;
            }
            std::string full_url = "${ha_url}" + x;
            ESP_LOGD("img", "Loading art: %s", full_url.c_str());
            id(album_art).set_url(full_url.c_str());
            id(album_art_small).set_url(full_url.c_str());
        - script.execute: ui_load_album_art

  # -- Artist name --
  - platform: homeassistant
    id: media_artist
    entity_id: ${player_entity}
    attribute: media_artist
    on_value:
      then:
        - script.execute: ui_sync_artist

  # -- Player state: playing / paused / idle --
  - platform: homeassistant
    id: player_state
    entity_id: ${player_entity}
    on_value:
      then:
        - lambda: id(screen_last_active_ms) = millis();
        - script.execute: ui_sync_play_state

  # -- Shuffle state (on/off) --
  - platform: homeassistant
    id: shuffle_state
    entity_id: ${player_entity}
    attribute: shuffle
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("shuffle", "Shuffle state: '%s'", x.c_str());
        - script.execute: ui_sync_shuffle

  # -- Repeat state (off/all/one) --
  - platform: homeassistant
    id: repeat_state
    entity_id: ${player_entity}
    attribute: repeat
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("repeat", "Repeat state: '%s'", x.c_str());
        - script.execute: ui_sync_repeat

# -------------------- SWITCHES PAGE STATE --------------------
binary_sensor:
  - platform: homeassistant
    id: light1_state
    entity_id: ${light1_entity}
    on_state:
      then:
        - script.execute: apply_light1_style

  - platform: homeassistant
    id: light2_state
    entity_id: ${light2_entity}
    on_state:
      then:
        - script.execute: apply_light2_style

  - platform: homeassistant
    id: fan_switch_state
    entity_id: ${fan_entity}
    on_state:
      then:
        - script.execute: apply_fan_style

  - platform: homeassistant
    id: ac_switch_state
    entity_id: ${ac_entity}
    on_state:
      then:
        - script.execute: apply_ac_style
