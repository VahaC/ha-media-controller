# -------------------- PARSERS AND UI STATE --------------------
globals:
  # Captureless function pointer: the same parser formerly provided by the
  # local playlist_parser.h, which ESPHome Git packages cannot resolve.
  - id: json_string_array_parser
    type: std::vector<std::string> (*)(const std::string &)
    restore_value: no
    initial_value: |-
      [](const std::string &json) -> std::vector<std::string> {
        std::vector<std::string> result;
        std::string s = json;
        size_t pos = s.find('[');
        if (pos == std::string::npos) return result;
        s = s.substr(pos + 1);

        while (true) {
          size_t start = s.find('"');
          if (start == std::string::npos) break;
          s = s.substr(start + 1);

          std::string item;
          size_t i = 0;
          while (i < s.size()) {
            if (s[i] == '\\' && i + 1 < s.size()) {
              if (s[i + 1] == '"') item += '"';
              else if (s[i + 1] == 'n') item += '\n';
              else if (s[i + 1] == '\\') item += '\\';
              else item += s[i + 1];
              i += 2;
            } else if (s[i] == '"') {
              i++;
              break;
            } else {
              item += s[i];
              i++;
            }
          }
          result.push_back(item);
          s = s.substr(i);

          size_t next = s.find_first_not_of(" ,\n\r\t");
          if (next != std::string::npos && s[next] == ']') break;
        }
        return result;
      }

  # Reads one slot label out of the config sensor payload. The firmware has
  # no JSON library, so this walks the "slots" array by brace depth while
  # skipping string literals, the same hand-rolled style as the playlist
  # parser above. Returns an empty string when the slot is not configured,
  # which is what hides the tile.
  - id: slot_label_parser
    type: std::string (*)(const std::string &, int)
    restore_value: no
    initial_value: |-
      [](const std::string &body, int slot) -> std::string {
        size_t slots_pos = body.find("\"slots\":");
        if (slots_pos == std::string::npos) return std::string();
        size_t i = body.find('[', slots_pos);
        if (i == std::string::npos) return std::string();

        int depth = 0;
        size_t object_start = std::string::npos;
        for (; i < body.size(); i++) {
          char c = body[i];
          if (c == '"') {
            // -- Skip a string literal so a label containing a brace
            //    cannot break the depth count. --
            i++;
            while (i < body.size()) {
              if (body[i] == '\\') { i++; }
              else if (body[i] == '"') break;
              i++;
            }
            continue;
          }
          if (c == '{') {
            if (depth == 0) object_start = i;
            depth++;
            continue;
          }
          if (c == '}') {
            depth--;
            if (depth != 0 || object_start == std::string::npos) continue;
            std::string object = body.substr(object_start,
                                             i - object_start + 1);
            object_start = std::string::npos;
            size_t slot_pos = object.find("\"slot\":");
            if (slot_pos == std::string::npos) continue;
            if (atoi(object.c_str() + slot_pos + 7) != slot) continue;
            size_t label_pos = object.find("\"label\":\"");
            if (label_pos == std::string::npos) return std::string();
            label_pos += 9;
            std::string label;
            for (size_t k = label_pos; k < object.size(); k++) {
              if (object[k] == '\\' && k + 1 < object.size()) {
                label += object[k + 1];
                k++;
                continue;
              }
              if (object[k] == '"') break;
              label += object[k];
            }
            return label;
          }
          if (c == ']' && depth == 0) break;
        }
        return std::string();
      }

  - id: playlist_names
    type: std::vector<std::string>
    restore_value: no

  - id: playlist_uris
    type: std::vector<std::string>
    restore_value: no

  - id: selected_playlist_idx
    type: int
    restore_value: no
    initial_value: '0'

  - id: queue_title_list
    type: std::vector<std::string>
    restore_value: no

  - id: queue_artist_list
    type: std::vector<std::string>
    restore_value: no

  - id: queue_id_list
    type: std::vector<std::string>
    restore_value: no

  - id: queue_current_idx
    type: int
    restore_value: no
    initial_value: '0'

  - id: queue_window_start
    type: int
    restore_value: no
    initial_value: '0'

  - id: selected_queue_idx
    type: int
    restore_value: no
    initial_value: '-1'

  - id: light1_pct
    type: float
    restore_value: no
    initial_value: '50.0'

  - id: light1_dir
    type: int
    restore_value: no
    initial_value: '1'

  - id: light2_pct
    type: float
    restore_value: no
    initial_value: '50.0'

  - id: light2_dir
    type: int
    restore_value: no
    initial_value: '1'

  - id: light1_long_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: light2_long_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # Set as soon as PAGE 4 recognizes a swipe. Button release events use it
  # to avoid toggling a device after the page has already started moving.
  - id: switches_swipe_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: screen_last_active_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Restored text/number/select values are published while components are still
  # setting up. Every script that touches LVGL checks this first, and on_boot
  # (priority -100) applies the full state once the widget tree exists.
  - id: ui_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: current_page
    type: std::string
    restore_value: no
    initial_value: '"player"'

  # Which LVGL page the room controls are on, as an index into the pages list.
  # -1 means the four fixed buttons on page_switches, which is all the classic
  # firmware can ever have. A firmware that builds its room page at runtime
  # appends it to lvgl.pages and writes its index here at boot. See
  # show_room_page and the header of this file.
  - id: room_page_index
    type: int
    restore_value: no
    initial_value: '-1'

  # Timestamp of the last swipe-driven page change. A screen load animation runs
  # for 300 ms, and a single drag can otherwise be recognised again by the page
  # it just loaded, which navigates straight back. See the nav_* scripts.
  - id: last_nav_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Set while the Cover Card volume slider is being dragged. Incoming volume
  # updates from Home Assistant are ignored briefly afterwards so the knob does
  # not fight the finger, and does not snap back before HA has caught up.
  - id: volume_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# -------------------- LVGL UI --------------------
lvgl:
  displays:
    - tft_display
  touchscreens:
    - tft_touch
  # -- Do not let LVGL auto-resume from the same input that wakes the backlight.
  # -- We explicitly resume in touchscreen.on_release instead.
  resume_on_input: false
  color_depth: 16
  bg_color: 0x0a0a14
  default_font: roboto_22

  style_definitions:
    # -- Default control button style --
    - id: style_ctrl_btn
      bg_color: 0x12122a
      bg_opa: COVER
      border_color: 0x00cfff
      border_width: 1
      radius: 40
      text_color: 0xffffff
      shadow_width: 0
      pad_all: 0

    # -- Control button pressed state --
    - id: style_ctrl_btn_pressed
      bg_color: 0x00cfff
      text_color: 0x0a0a14

    # -- Decoration circle style --
    - id: style_play_btn
      bg_color: 0x00cfff
      bg_opa: COVER
      border_width: 0
      radius: 50
      text_color: 0x0a0a14
      shadow_width: 20
      shadow_color: 0x00cfff
      shadow_opa: 80%
      pad_all: 0

    # -- Decoration circle pressed state --
    - id: style_play_btn_pressed
      bg_color: 0x0090bb
      shadow_width: 5

    # -- Volume button style --
    - id: style_vol_btn
      bg_color: 0x1a1a35
      bg_opa: COVER
      border_color: 0x2a2a55
      border_width: 1
      radius: 8
      text_color: 0x00cfff
      shadow_width: 0
      pad_all: 0

    # -- Volume button pressed state --
    - id: style_vol_btn_pressed
      bg_color: 0x2a2a55

    # -- Playlists button style --
    - id: style_playlist_btn
      bg_color: 0x0a0a14
      bg_opa: COVER
      border_color: 0x2a2a55
      border_width: 1
      radius: 20
      text_color: 0x5555aa
      shadow_width: 0
      pad_all: 0

    # -- Playlists button pressed state --
    - id: style_playlist_btn_pressed
      bg_color: 0x12122a
      text_color: 0x00cfff

    # -- Switches page toggle card: raised glass slab --
    - id: style_switch_btn
      bg_color: 0x303050
      bg_grad_color: 0x11111f
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x505078
      border_width: 2
      radius: 26
      text_color: 0xd8d8f0
      shadow_width: 20
      shadow_color: 0x000000
      shadow_opa: 80%
      shadow_offset_y: 12
      shadow_spread: 1
      outline_color: 0x7777a8
      outline_width: 1
      outline_opa: 35%
      outline_pad: 0
      pad_all: 0

    # -- Switches page toggle card: physically pushed down --
    - id: style_switch_btn_pressed
      bg_color: 0x151526
      bg_grad_color: 0x272742
      border_color: 0x00cfff
      shadow_width: 6
      shadow_opa: 60%
      shadow_offset_y: 3
      translate_y: 8
      outline_color: 0x00cfff
      outline_opa: 55%

    # -- Minimal Ring: bare glyph, no chrome at all --
    - id: style_min_ghost
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      radius: 0
      pad_all: 0
      text_color: 0xd8dce6

    - id: style_min_ghost_pressed
      bg_color: 0xffffff
      bg_opa: 12%
      radius: 20

    # -- Minimal Ring: play/pause sits in a thin outlined circle --
    - id: style_min_circle
      bg_opa: TRANSP
      border_color: 0xd8dce6
      border_width: 1
      radius: 34
      shadow_width: 0
      pad_all: 0
      text_color: 0xd8dce6

    - id: style_min_circle_pressed
      bg_color: 0xffffff
      bg_opa: 14%

    # -- Cover Card: flat control glyph, chrome only while pressed --
    - id: style_cover_ghost
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      radius: 22
      pad_all: 0
      text_color: 0xd8dce6

    - id: style_cover_ghost_pressed
      bg_color: 0xffffff
      bg_opa: 12%

    # -- Cover Card: the single filled accent control --
    - id: style_cover_play
      bg_color: 0x00cfff
      bg_opa: COVER
      border_width: 0
      radius: 33
      pad_all: 0
      text_color: 0x05060c
      shadow_width: 14
      shadow_color: 0x00cfff
      shadow_opa: 55%

    - id: style_cover_play_pressed
      bg_color: 0x00a6cc
      shadow_width: 6

  pages:
    # ════════════════════════════════════════
    # PAGE 1 — Player
    # ════════════════════════════════════════
    - id: page_player
      on_load:
        - lambda: id(current_page) = "player";
      on_swipe_left:
        - script.execute: nav_to_switches_move_left
      on_swipe_right:
        - script.execute: nav_to_switches_move_right
      widgets:

        # -- Album art background (full screen, dimmed with recolor) --
        - image:
            id: album_art_img
            src: album_art
            align: CENTER
            y: 0
            width: 480
            height: 480
            image_recolor: 0x0a0a14
            image_recolor_opa: 60%

        # -- Progress arc (shows track playback position) --
        - arc:
            id: progress_arc
            width: 400
            height: 400
            align: CENTER
            y: -30
            value: 0
            min_value: 0
            max_value: 100
            start_angle: 150
            end_angle: 30
            arc_color: 0x1a1a35
            arc_width: 4
            indicator:
              arc_color: 0x00cfff
              arc_width: 4
            adjustable: false

        # -- Open queue page --
        - button:
            id: btn_to_queue
            styles: style_playlist_btn
            pressed:
              styles: style_playlist_btn_pressed
            width: 140
            height: 38
            align: CENTER
            x: 0
            y: -180
            bg_opa: 60%
            widgets:
              - label:
                  text: !lambda return (std::string(LV_SYMBOL_AUDIO) + "   Queue").c_str();
                  text_font: montserrat_14
                  align: CENTER
            on_click:
              - lvgl.page.show: page_queue

        # -- Decoration circle (background for title/artist/volume) --
        - button:
            id: btn_decoration
            width: 320
            height: 190
            align: CENTER
            y: -40
            styles: style_play_btn
            bg_opa: 60%
            checkable: false
            clickable: false
            widgets:
              - label:
                  text: ""
                  align: CENTER

        # -- Track title (scrolls if too long) --
        - label:
            id: lbl_title
            text: "No track"
            text_color: 0xffffff
            text_font: roboto_36
            align: CENTER
            y: -95
            width: 300
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER

        # -- Artist name (scrolls if too long) --
        - label:
            id: lbl_artist
            text: "Unknown"
            text_color: 0x5588cc
            text_font: roboto_30
            align: CENTER
            y: -35
            width: 300
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER

        # -- Volume percentage label --
        - label:
            id: lbl_volume
            text: "--"
            text_color: 0x334466
            text_font: montserrat_24
            align: CENTER
            y: 15

        # -- Shuffle button --
        - button:
            id: btn_shuffle
            styles: style_ctrl_btn
            pressed:
              styles: style_ctrl_btn_pressed
            width: 60
            height: 60
            align: CENTER
            x: -200
            y: -200
            bg_opa: 60%
            widgets:
              - image:
                  id: img_shuffle_off
                  src: icon_shuffle_off
                  align: CENTER
                  hidden: false
              - image:
                  id: img_shuffle_on
                  src: icon_shuffle_on
                  align: CENTER
                  hidden: true
            on_click:
              - if:
                  condition:
                    lambda: |-
                      return (id(shuffle_state).state == "on" ||
                              id(shuffle_state).state == "True" ||
                              id(shuffle_state).state == "true");
                  then:
                    - script.execute:
                        id: cmd_shuffle_set
                        state: "off"
                  else:
                    - script.execute:
                        id: cmd_shuffle_set
                        state: "on"

        # -- Repeat button (cycles: off -> all -> one -> off) --
        - button:
            id: btn_repeat
            styles: style_ctrl_btn
            pressed:
              styles: style_ctrl_btn_pressed
            width: 60
            height: 60
            align: CENTER
            x: 200
            y: -200
            bg_opa: 60%
            widgets:
              - image:
                  id: img_repeat_off
                  src: icon_repeat_off
                  align: CENTER
                  hidden: false
              - image:
                  id: img_repeat_all
                  src: icon_repeat_all
                  align: CENTER
                  hidden: true
              - image:
                  id: img_repeat_one
                  src: icon_repeat_one
                  align: CENTER
                  hidden: true
            on_click:
              - if:
                  condition:
                    lambda: return id(repeat_state).state == "off";
                  then:
                    - script.execute:
                        id: cmd_repeat_set
                        mode: "all"
              - if:
                  condition:
                    lambda: return id(repeat_state).state == "all";
                  then:
                    - script.execute:
                        id: cmd_repeat_set
                        mode: "one"
              - if:
                  condition:
                    lambda: return id(repeat_state).state == "one";
                  then:
                    - script.execute:
                        id: cmd_repeat_set
                        mode: "off"

        # -- Previous track button --
        - button:
            id: btn_prev
            styles: style_ctrl_btn
            pressed:
              styles: style_ctrl_btn_pressed
            width: 80
            height: 80
            align: CENTER
            x: -155
            y: 130
            bg_opa: 60%
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_PREV);
                  text_font: montserrat_24
                  text_color: 0x00cfff
                  align: CENTER
            on_click:
              - logger.log: "Prev button pressed"
              - lambda: |-
                  // -- media_previous_track always restarts playback at position 0
                  //    (either the current track or the actual previous one), so
                  //    reset the arc immediately instead of waiting for HA's next poll --
                  id(media_position).publish_state(0);
                  lv_arc_set_value(id(progress_arc), 0);
              - script.execute: cmd_prev

        # -- Play / Pause button --
        - button:
            id: btn_play_pause
            styles: style_ctrl_btn
            pressed:
              styles: style_ctrl_btn_pressed
            width: 100
            height: 100
            align: CENTER
            y: 130
            bg_opa: 60%
            widgets:
              - label:
                  id: lbl_play_pause
                  text: !lambda return std::string(LV_SYMBOL_PLAY);
                  text_font: montserrat_28
                  text_color: 0x00cfff
                  align: CENTER
            on_click:
              - logger.log: "Play/Pause button pressed"
              - script.execute: cmd_play_pause

        # -- Next track button --
        - button:
            id: btn_next
            styles: style_ctrl_btn
            pressed:
              styles: style_ctrl_btn_pressed
            width: 80
            height: 80
            align: CENTER
            x: 155
            y: 130
            bg_opa: 60%
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_NEXT);
                  text_font: montserrat_24
                  text_color: 0x00cfff
                  align: CENTER
            on_click:
              - logger.log: "Next track button pressed"
              - script.execute: cmd_next

        # -- Volume down button --
        - button:
            id: btn_vol_down
            styles: style_vol_btn
            pressed:
              styles: style_vol_btn_pressed
            width: 90
            height: 45
            align: BOTTOM_LEFT
            x: 20
            y: -5
            bg_opa: 60%
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_VOLUME_MID);
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - logger.log: "Vol - button pressed"
              - script.execute: cmd_volume_down

        # -- Volume up button --
        - button:
            id: btn_vol_up
            styles: style_vol_btn
            pressed:
              styles: style_vol_btn_pressed
            width: 90
            height: 45
            align: BOTTOM_RIGHT
            x: -20
            y: -5
            bg_opa: 60%
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_VOLUME_MAX);
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - logger.log: "Vol + button pressed"
              - script.execute: cmd_volume_up

        # -- Open playlists page --
        - button:
            id: btn_to_playlists
            styles: style_playlist_btn
            pressed:
              styles: style_playlist_btn_pressed
            width: 140
            height: 38
            align: BOTTOM_MID
            x: 0
            y: -5
            bg_opa: 60%
            widgets:
              - label:
                  id: lbl_playlist
                  text: !lambda return (std::string(LV_SYMBOL_LIST) + "   Playlists").c_str();
                  text_font: montserrat_14
                  align: CENTER
            on_click:
              - lvgl.page.show: page_playlists

    # ════════════════════════════════════════
    # PAGE 1B — Player, "Minimal Ring" layout
    # ════════════════════════════════════════
    # Selected through the "Screen Style" select. Album art becomes a disc
    # inside the progress ring; everything that is not a transport control
    # moves behind the "..." overlay.
    - id: page_player_minimal
      bg_color: 0x05060c
      bg_opa: COVER
      on_load:
        - lambda: id(current_page) = "player";
      on_swipe_left:
        - script.execute: nav_to_switches_move_left
      on_swipe_right:
        - script.execute: nav_to_switches_move_right
      widgets:

        # -- Progress ring. The 270 degree sweep leaves its gap at the bottom,
        # -- exactly where the transport row starts. --
        - arc:
            id: progress_arc_m
            width: 300
            height: 300
            align: CENTER
            y: -78
            value: 0
            min_value: 0
            max_value: 100
            start_angle: 135
            end_angle: 45
            arc_color: 0x1a1a35
            arc_width: 4
            indicator:
              arc_color: 0x00cfff
              arc_width: 4
            adjustable: false

        # -- Album art disc. The container does the circular clipping and the
        # -- source is decoded at exactly this size, so nothing has to be
        # -- transformed at draw time. --
        - obj:
            id: art_clip_m
            width: 244
            height: 244
            align: CENTER
            y: -78
            radius: 122
            clip_corner: true
            bg_color: 0x0d0f16
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - image:
                  id: album_art_circle
                  src: album_art_small
                  align: CENTER

        # -- Ring knob. A non-adjustable arc has its knob part removed, so the
        # -- dot is a separate widget positioned by ui_sync_progress. --
        - obj:
            id: progress_dot_m
            width: 14
            height: 14
            align: CENTER
            x: -104
            y: 26
            radius: 7
            bg_color: 0x00cfff
            bg_opa: COVER
            border_width: 0
            shadow_width: 10
            shadow_color: 0x00cfff
            shadow_opa: 70%
            scrollable: false
            clickable: false

        # -- Previous track --
        - button:
            id: btn_prev_m
            gesture_bubble: true
            styles: style_min_ghost
            pressed:
              styles: style_min_ghost_pressed
            width: 54
            height: 54
            align: CENTER
            x: -100
            y: 98
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_PREV);
                  text_font: montserrat_24
                  align: CENTER
            on_click:
              - logger.log: "Prev button pressed (minimal)"
              # -- Same reasoning as the Classic layout: media_previous_track
              # -- restarts at position 0, so do not wait for HA to catch up. --
              - lambda: id(media_position).publish_state(0);
              - script.execute: cmd_prev

        # -- Play / Pause --
        - button:
            id: btn_play_pause_m
            gesture_bubble: true
            styles: style_min_circle
            pressed:
              styles: style_min_circle_pressed
            width: 68
            height: 68
            align: CENTER
            y: 98
            widgets:
              - label:
                  id: lbl_play_pause_m
                  text: !lambda return std::string(LV_SYMBOL_PLAY);
                  text_font: montserrat_24
                  align: CENTER
            on_click:
              - logger.log: "Play/Pause button pressed (minimal)"
              - script.execute: cmd_play_pause

        # -- Next track --
        - button:
            id: btn_next_m
            gesture_bubble: true
            styles: style_min_ghost
            pressed:
              styles: style_min_ghost_pressed
            width: 54
            height: 54
            align: CENTER
            x: 100
            y: 98
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_NEXT);
                  text_font: montserrat_24
                  align: CENTER
            on_click:
              - logger.log: "Next track button pressed (minimal)"
              - script.execute: cmd_next

        # -- Track title --
        - label:
            id: lbl_title_m
            text: "No track"
            text_color: 0xffffff
            text_font: roboto_22
            align: CENTER
            y: 152
            width: 300
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER

        # -- Artist --
        - label:
            id: lbl_artist_m
            text: "Unknown"
            text_color: 0x5588cc
            text_font: roboto_16
            align: CENTER
            y: 180
            width: 300
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER

        # -- Volume down --
        - button:
            id: btn_vol_down_m
            gesture_bubble: true
            styles: style_min_ghost
            pressed:
              styles: style_min_ghost_pressed
            width: 54
            height: 38
            align: BOTTOM_LEFT
            x: 14
            y: -10
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_VOLUME_MID);
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - script.execute: cmd_volume_down

        # -- Volume up --
        - button:
            id: btn_vol_up_m
            gesture_bubble: true
            styles: style_min_ghost
            pressed:
              styles: style_min_ghost_pressed
            width: 54
            height: 38
            align: BOTTOM_RIGHT
            x: -14
            y: -10
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_VOLUME_MAX);
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - script.execute: cmd_volume_up

        # -- Everything that is not transport lives behind this --
        - button:
            id: btn_more_m
            gesture_bubble: true
            styles: style_min_ghost
            pressed:
              styles: style_min_ghost_pressed
            width: 72
            height: 32
            align: BOTTOM_MID
            y: -12
            widgets:
              - label:
                  text: "..."
                  text_font: montserrat_24
                  align: CENTER
                  y: -8
            on_click:
              - lvgl.widget.show: overlay_more

        # -- "..." overlay: shuffle, repeat, queue, playlists.
        # -- Full-screen and hidden by default, so while it is open it also
        # -- blocks swipes and transport taps. Tapping the backdrop closes it. --
        - obj:
            id: overlay_more
            width: 480
            height: 480
            align: CENTER
            hidden: true
            radius: 0
            pad_all: 0
            bg_color: 0x05060c
            bg_opa: 94%
            border_width: 0
            scrollable: false
            clickable: true
            on_click:
              - lvgl.widget.hide: overlay_more
            on_swipe_left:
              - lvgl.widget.hide: overlay_more
            on_swipe_right:
              - lvgl.widget.hide: overlay_more
            widgets:
              - label:
                  text: "MORE"
                  text_font: montserrat_14
                  text_color: 0x77779a
                  align: TOP_MID
                  y: 44

              # -- Shuffle --
              - button:
                  id: btn_shuffle_m
                  styles: style_ctrl_btn
                  pressed:
                    styles: style_ctrl_btn_pressed
                  width: 96
                  height: 96
                  align: CENTER
                  x: -70
                  y: -60
                  widgets:
                    - image:
                        id: img_shuffle_off_m
                        src: icon_shuffle_off
                        align: CENTER
                        hidden: false
                    - image:
                        id: img_shuffle_on_m
                        src: icon_shuffle_on
                        align: CENTER
                        hidden: true
                  on_click:
                    - if:
                        condition:
                          lambda: |-
                            return (id(shuffle_state).state == "on" ||
                                    id(shuffle_state).state == "True" ||
                                    id(shuffle_state).state == "true");
                        then:
                          - script.execute:
                              id: cmd_shuffle_set
                              state: "off"
                        else:
                          - script.execute:
                              id: cmd_shuffle_set
                              state: "on"

              # -- Repeat (cycles: off -> all -> one -> off) --
              - button:
                  id: btn_repeat_m
                  styles: style_ctrl_btn
                  pressed:
                    styles: style_ctrl_btn_pressed
                  width: 96
                  height: 96
                  align: CENTER
                  x: 70
                  y: -60
                  widgets:
                    - image:
                        id: img_repeat_off_m
                        src: icon_repeat_off
                        align: CENTER
                        hidden: false
                    - image:
                        id: img_repeat_all_m
                        src: icon_repeat_all
                        align: CENTER
                        hidden: true
                    - image:
                        id: img_repeat_one_m
                        src: icon_repeat_one
                        align: CENTER
                        hidden: true
                  on_click:
                    - if:
                        condition:
                          lambda: return id(repeat_state).state == "off";
                        then:
                          - script.execute:
                              id: cmd_repeat_set
                              mode: "all"
                    - if:
                        condition:
                          lambda: return id(repeat_state).state == "all";
                        then:
                          - script.execute:
                              id: cmd_repeat_set
                              mode: "one"
                    - if:
                        condition:
                          lambda: return id(repeat_state).state == "one";
                        then:
                          - script.execute:
                              id: cmd_repeat_set
                              mode: "off"

              # -- Queue --
              - button:
                  id: btn_queue_m
                  styles: style_playlist_btn
                  pressed:
                    styles: style_playlist_btn_pressed
                  width: 240
                  height: 56
                  align: CENTER
                  y: 60
                  widgets:
                    - label:
                        text: !lambda return (std::string(LV_SYMBOL_AUDIO) + "   Queue").c_str();
                        text_font: montserrat_16
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: overlay_more
                    - lvgl.page.show: page_queue

              # -- Playlists --
              - button:
                  id: btn_playlists_m
                  styles: style_playlist_btn
                  pressed:
                    styles: style_playlist_btn_pressed
                  width: 240
                  height: 56
                  align: CENTER
                  y: 130
                  widgets:
                    - label:
                        text: !lambda return (std::string(LV_SYMBOL_LIST) + "   Playlists").c_str();
                        text_font: montserrat_16
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: overlay_more
                    - lvgl.page.show: page_playlists

              # -- Close --
              - button:
                  id: btn_close_more_m
                  styles: style_playlist_btn
                  pressed:
                    styles: style_playlist_btn_pressed
                  width: 160
                  height: 46
                  align: BOTTOM_MID
                  y: -22
                  widgets:
                    - label:
                        text: !lambda return (std::string(LV_SYMBOL_CLOSE) + "   Close").c_str();
                        text_font: montserrat_14
                        align: CENTER
                  on_click:
                    - lvgl.widget.hide: overlay_more

    # ════════════════════════════════════════
    # PAGE 1C — Player, "Cover Card" layout
    # ════════════════════════════════════════
    # A rounded cover card with the full transport underneath: elapsed and
    # remaining time, a linear progress bar, shuffle and repeat inline, and a
    # volume slider. Nothing is hidden behind an overlay. Reuses the pre-sized
    # album_art_small source, so this layout costs no extra image buffer and no
    # extra download.
    - id: page_player_cover
      bg_color: 0x05060c
      bg_opa: COVER
      on_load:
        - lambda: id(current_page) = "player";
      on_swipe_left:
        - script.execute: nav_to_switches_move_left
      on_swipe_right:
        - script.execute: nav_to_switches_move_right
      widgets:

        # -- Queue --
        - button:
            id: btn_to_queue_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 44
            height: 44
            align: TOP_LEFT
            x: 10
            y: 8
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_AUDIO);
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - lvgl.page.show: page_queue

        # -- Playlists --
        - button:
            id: btn_to_playlists_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 44
            height: 44
            align: TOP_RIGHT
            x: -10
            y: 8
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_LIST);
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - lvgl.page.show: page_playlists

        # -- Cover card. Same 244 px source as the Minimal Ring disc, clipped to
        # -- a rounded square instead of a circle. No transform, see the
        # -- album_art_small comment. --
        - obj:
            id: art_clip_c
            width: 244
            height: 244
            align: CENTER
            y: -104
            radius: 24
            clip_corner: true
            bg_color: 0x0d0f16
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            shadow_width: 0
            scrollable: false
            clickable: false
            widgets:
              - image:
                  id: album_art_cover
                  src: album_art_small
                  align: CENTER

        # -- Track title --
        - label:
            id: lbl_title_c
            text: "No track"
            text_color: 0xffffff
            text_font: roboto_30
            align: CENTER
            y: 48
            width: 420
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER

        # -- Artist --
        - label:
            id: lbl_artist_c
            text: "Unknown"
            text_color: 0x5588cc
            text_font: roboto_22
            align: CENTER
            y: 82
            width: 420
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER

        # -- Elapsed time --
        - label:
            id: lbl_elapsed_c
            text: "0:00"
            text_color: 0x77779a
            text_font: montserrat_14
            align: CENTER
            x: -186
            y: 112

        # -- Linear progress --
        - bar:
            id: progress_bar_c
            width: 300
            height: 6
            align: CENTER
            y: 112
            min_value: 0
            max_value: 100
            value: 0
            animated: false
            radius: 3
            bg_color: 0x1a1a35
            bg_opa: COVER
            indicator:
              bg_color: 0x00cfff
              radius: 3

        # -- Track length --
        - label:
            id: lbl_total_c
            text: "0:00"
            text_color: 0x77779a
            text_font: montserrat_14
            align: CENTER
            x: 186
            y: 112

        # -- Shuffle --
        - button:
            id: btn_shuffle_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 44
            height: 44
            align: CENTER
            x: -175
            y: 156
            widgets:
              - image:
                  id: img_shuffle_off_c
                  src: icon_shuffle_off
                  align: CENTER
                  hidden: false
              - image:
                  id: img_shuffle_on_c
                  src: icon_shuffle_on
                  align: CENTER
                  hidden: true
            on_click:
              - if:
                  condition:
                    lambda: |-
                      return (id(shuffle_state).state == "on" ||
                              id(shuffle_state).state == "True" ||
                              id(shuffle_state).state == "true");
                  then:
                    - script.execute:
                        id: cmd_shuffle_set
                        state: "off"
                  else:
                    - script.execute:
                        id: cmd_shuffle_set
                        state: "on"

        # -- Previous track --
        - button:
            id: btn_prev_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 52
            height: 52
            align: CENTER
            x: -95
            y: 156
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_PREV);
                  text_font: montserrat_24
                  align: CENTER
            on_click:
              - logger.log: "Prev button pressed (cover)"
              # -- media_previous_track restarts at position 0; reset the bar now
              # -- instead of waiting for the next Home Assistant poll. --
              - lambda: id(media_position).publish_state(0);
              - script.execute: cmd_prev

        # -- Play / Pause, the one filled accent control on this layout --
        - button:
            id: btn_play_pause_c
            gesture_bubble: true
            styles: style_cover_play
            pressed:
              styles: style_cover_play_pressed
            width: 66
            height: 66
            align: CENTER
            y: 156
            widgets:
              - label:
                  id: lbl_play_pause_c
                  text: !lambda return std::string(LV_SYMBOL_PLAY);
                  text_font: montserrat_28
                  align: CENTER
            on_click:
              - logger.log: "Play/Pause button pressed (cover)"
              - script.execute: cmd_play_pause

        # -- Next track --
        - button:
            id: btn_next_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 52
            height: 52
            align: CENTER
            x: 95
            y: 156
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_NEXT);
                  text_font: montserrat_24
                  align: CENTER
            on_click:
              - logger.log: "Next track button pressed (cover)"
              - script.execute: cmd_next

        # -- Repeat (cycles: off -> all -> one -> off) --
        - button:
            id: btn_repeat_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 44
            height: 44
            align: CENTER
            x: 175
            y: 156
            widgets:
              - image:
                  id: img_repeat_off_c
                  src: icon_repeat_off
                  align: CENTER
                  hidden: false
              - image:
                  id: img_repeat_all_c
                  src: icon_repeat_all
                  align: CENTER
                  hidden: true
              - image:
                  id: img_repeat_one_c
                  src: icon_repeat_one
                  align: CENTER
                  hidden: true
            on_click:
              - if:
                  condition:
                    lambda: return id(repeat_state).state == "off";
                  then:
                    - script.execute:
                        id: cmd_repeat_set
                        mode: "all"
              - if:
                  condition:
                    lambda: return id(repeat_state).state == "all";
                  then:
                    - script.execute:
                        id: cmd_repeat_set
                        mode: "one"
              - if:
                  condition:
                    lambda: return id(repeat_state).state == "one";
                  then:
                    - script.execute:
                        id: cmd_repeat_set
                        mode: "off"

        # -- Volume down. The glyph doubles as a step button so the slider is
        # -- not the only way to change volume on this layout. --
        - button:
            id: btn_vol_down_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 44
            height: 40
            align: CENTER
            x: -168
            y: 210
            widgets:
              - label:
                  id: lbl_vol_min_c
                  text: !lambda return std::string(LV_SYMBOL_VOLUME_MID);
                  text_font: montserrat_14
                  align: CENTER
            on_click:
              - script.execute: cmd_volume_down

        # -- Horizontal drags on the slider must move the knob, never the page,
        # -- so this one widget does not bubble gestures. Home Assistant is
        # -- called on release rather than on every step of the drag. --
        - slider:
            id: slider_volume_c
            gesture_bubble: false
            width: 268
            height: 8
            align: CENTER
            y: 210
            min_value: 0
            max_value: 100
            value: 0
            radius: 4
            bg_color: 0x1a1a35
            bg_opa: COVER
            indicator:
              bg_color: 0x00cfff
              radius: 4
            knob:
              bg_color: 0xffffff
              radius: 9
              pad_all: 6
            on_press:
              - lambda: id(volume_touch_ms) = millis();
            on_release:
              - lambda: id(volume_touch_ms) = millis();
              - script.execute:
                  id: cmd_volume_set
                  level: !lambda return (int) lv_slider_get_value(id(slider_volume_c));

        # -- Volume up --
        - button:
            id: btn_vol_up_c
            gesture_bubble: true
            styles: style_cover_ghost
            pressed:
              styles: style_cover_ghost_pressed
            width: 44
            height: 40
            align: CENTER
            x: 168
            y: 210
            widgets:
              - label:
                  id: lbl_vol_max_c
                  text: !lambda return std::string(LV_SYMBOL_VOLUME_MAX);
                  text_font: montserrat_14
                  align: CENTER
            on_click:
              - script.execute: cmd_volume_up
    # ════════════════════════════════════════
    # PAGE 2 — Playlists
    # ════════════════════════════════════════
    - id: page_playlists
      on_load:
        - lambda: id(current_page) = "playlists";
      widgets:
        - label:
            text: "Playlists"
            text_color: 0xffffff
            text_font: roboto_22
            align: TOP_MID
            y: 15

        # -- Back to player --
        - button:
            id: btn_back_playlists
            styles: style_vol_btn
            pressed:
              styles: style_vol_btn_pressed
            width: 100
            height: 40
            align: TOP_LEFT
            x: 10
            y: 10
            widgets:
              - label:
                  text: "< Back"
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - script.execute: show_home_page

        # -- Scrollable playlist roller --
        - roller:
            id: playlist_roller
            align: CENTER
            y: -10
            width: 420
            height: 380
            options: "Loading..."
            visible_row_count: 8
            selected_index: 0
            text_font: roboto_22
            text_align: LEFT
            bg_color: 0x9d9d9d
            selected:
              text_color: 0x00cfff
              bg_color: 0x12122a
            on_change:
              - lambda: |-
                  id(selected_playlist_idx) = lv_roller_get_selected(
                    (lv_obj_t*)id(playlist_roller)->obj);

        # -- Play selected playlist --
        - button:
            id: btn_play_playlist
            styles: style_ctrl_btn
            pressed:
              styles: style_ctrl_btn_pressed
            width: 200
            height: 55
            align: BOTTOM_MID
            y: -10
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_PLAY) + " Play";
                  text_font: montserrat_22
                  align: CENTER
            on_click:
              - lambda: |-
                  int idx = id(selected_playlist_idx);
                  if (idx >= 0 && idx < (int)id(playlist_uris).size()) {
                    std::string uri = id(playlist_uris)[idx];
                    std::string name = id(playlist_names)[idx];
                    ESP_LOGD("playlist", "Playing: %s (%s)",
                             name.c_str(), uri.c_str());
                  }
              - script.execute: cmd_play_playlist
              - script.execute: show_home_page

    # ════════════════════════════════════════
    # PAGE 3 — Queue
    # ════════════════════════════════════════
    - id: page_queue
      on_load:
        - lambda: id(current_page) = "queue";
        - script.execute: refresh_queue
      widgets:
        - label:
            text: "Queue"
            text_color: 0xffffff
            text_font: roboto_22
            align: TOP_MID
            y: 15

        - button:
            id: btn_back_queue
            styles: style_vol_btn
            pressed:
              styles: style_vol_btn_pressed
            width: 100
            height: 40
            align: TOP_LEFT
            x: 10
            y: 10
            widgets:
              - label:
                  text: "< Back"
                  text_font: montserrat_16
                  align: CENTER
            on_click:
              - script.execute: show_home_page

        # -- Scrollable container — кнопки генеруються динамічно в лямбді --
        - obj:
            id: queue_container
            align: TOP_MID
            y: 55
            width: 440
            height: 365
            bg_color: 0x0a0a14
            bg_opa: COVER
            border_width: 0
            pad_all: 2
            scrollable: true
            scroll_dir: VER
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: START
              flex_align_track: START
            widgets: []

        # -- Play selected track --
        - button:
            id: btn_play_queue_item
            styles: style_ctrl_btn
            pressed:
              styles: style_ctrl_btn_pressed
            width: 200
            height: 50
            align: BOTTOM_MID
            y: -5
            widgets:
              - label:
                  text: !lambda return std::string(LV_SYMBOL_PLAY) + " Play";
                  text_font: montserrat_22
                  align: CENTER
            on_click:
              - script.execute: play_queue_item

    # ════════════════════════════════════════
    # PAGE 4 — Switches (світло + розетки)
    # ════════════════════════════════════════
    - id: page_switches
      on_load:
        - lambda: id(current_page) = "room";
        - lambda: id(switches_swipe_active) = false;
      on_swipe_right:
        - lambda: id(switches_swipe_active) = true;
        - script.execute: nav_home_move_right
      on_swipe_left:
        - lambda: id(switches_swipe_active) = true;
        - script.execute: nav_home_move_left
      widgets:
        # -- Compact scene header --
        - label:
            text: "ROOM CONTROLS"
            text_font: roboto_22
            text_color: 0xf4f4ff
            align: TOP_MID
            y: 12

        - label:
            text: "Tap to toggle  |  hold lights to dim"
            text_font: montserrat_14
            text_color: 0x77779a
            align: TOP_MID
            y: 43

        # -- Light 1 --
        - button:
            id: btn_light1
            gesture_bubble: true
            styles: style_switch_btn
            pressed:
              styles: style_switch_btn_pressed
            width: 190
            height: 140
            align: TOP_LEFT
            x: 25
            y: 75
            widgets:
              # Specular highlight sells the raised glass surface.
              - obj:
                  width: 146
                  height: 4
                  align: TOP_MID
                  y: 10
                  bg_color: 0xffffff
                  bg_opa: 22%
                  border_width: 0
                  radius: 2
                  clickable: false
                  scrollable: false
              - label:
                  id: lbl_light1_status
                  text: "OFF"
                  text_font: montserrat_14
                  text_color: 0x77779a
                  align: TOP_RIGHT
                  x: -13
                  y: 17
              - image:
                  id: img_light1
                  src: icon_light1
                  align: CENTER
                  y: -18
              - label:
                  id: lbl_slot1_name
                  text: "LIGHT 1"
                  text_font: montserrat_16
                  align: CENTER
                  y: 50
            on_press:
              - lambda: id(light1_long_active) = false;
            on_long_press:
              - lambda: id(light1_long_active) = true;
            on_long_press_repeat:
              - lambda: |-
                  float step = 4.0f;
                  float pct = id(light1_pct) + id(light1_dir) * step;
                  if (pct >= 100.0f) { pct = 100.0f; id(light1_dir) = -1; }
                  if (pct <= 1.0f) { pct = 1.0f; id(light1_dir) = 1; }
                  id(light1_pct) = pct;
              - script.execute:
                  id: cmd_slot_brightness
                  slot: 1
                  pct: !lambda return (int) id(light1_pct);
            on_click:
              - if:
                  condition:
                    lambda: return !id(light1_long_active) && !id(switches_swipe_active);
                  then:
                    - script.execute:
                        id: cmd_slot_toggle
                        slot: 1
              - lambda: id(light1_long_active) = false;

        # -- Light 2 --
        - button:
            id: btn_light2
            gesture_bubble: true
            styles: style_switch_btn
            pressed:
              styles: style_switch_btn_pressed
            width: 190
            height: 140
            align: TOP_RIGHT
            x: -25
            y: 75
            widgets:
              - obj:
                  width: 146
                  height: 4
                  align: TOP_MID
                  y: 10
                  bg_color: 0xffffff
                  bg_opa: 22%
                  border_width: 0
                  radius: 2
                  clickable: false
                  scrollable: false
              - label:
                  id: lbl_light2_status
                  text: "OFF"
                  text_font: montserrat_14
                  text_color: 0x77779a
                  align: TOP_RIGHT
                  x: -13
                  y: 17
              - image:
                  id: img_light2
                  src: icon_light2
                  align: CENTER
                  y: -18
              - label:
                  id: lbl_slot2_name
                  text: "LIGHT 2"
                  text_font: montserrat_16
                  align: CENTER
                  y: 50
            on_press:
              - lambda: id(light2_long_active) = false;
            on_long_press:
              - lambda: id(light2_long_active) = true;
            on_long_press_repeat:
              - lambda: |-
                  float step = 4.0f;
                  float pct = id(light2_pct) + id(light2_dir) * step;
                  if (pct >= 100.0f) { pct = 100.0f; id(light2_dir) = -1; }
                  if (pct <= 1.0f) { pct = 1.0f; id(light2_dir) = 1; }
                  id(light2_pct) = pct;
              - script.execute:
                  id: cmd_slot_brightness
                  slot: 2
                  pct: !lambda return (int) id(light2_pct);
            on_click:
              - if:
                  condition:
                    lambda: return !id(light2_long_active) && !id(switches_swipe_active);
                  then:
                    - script.execute:
                        id: cmd_slot_toggle
                        slot: 2
              - lambda: id(light2_long_active) = false;

        # -- Fan socket --
        - button:
            id: btn_switch_fan
            gesture_bubble: true
            styles: style_switch_btn
            pressed:
              styles: style_switch_btn_pressed
            width: 190
            height: 140
            align: BOTTOM_LEFT
            x: 25
            y: -35
            widgets:
              - obj:
                  width: 146
                  height: 4
                  align: TOP_MID
                  y: 10
                  bg_color: 0xffffff
                  bg_opa: 22%
                  border_width: 0
                  radius: 2
                  clickable: false
                  scrollable: false
              - label:
                  id: lbl_fan_status
                  text: "OFF"
                  text_font: montserrat_14
                  text_color: 0x77779a
                  align: TOP_RIGHT
                  x: -13
                  y: 17
              - image:
                  id: img_fan
                  src: icon_fan
                  align: CENTER
                  y: -18
              - label:
                  id: lbl_slot3_name
                  text: "FAN"
                  text_font: montserrat_16
                  align: CENTER
                  y: 50
            on_click:
              - if:
                  condition:
                    lambda: return !id(switches_swipe_active);
                  then:
                    - script.execute:
                        id: cmd_slot_toggle
                        slot: 3

        # -- AC socket --
        - button:
            id: btn_switch_ac
            gesture_bubble: true
            styles: style_switch_btn
            pressed:
              styles: style_switch_btn_pressed
            width: 190
            height: 140
            align: BOTTOM_RIGHT
            x: -25
            y: -35
            widgets:
              - obj:
                  width: 146
                  height: 4
                  align: TOP_MID
                  y: 10
                  bg_color: 0xffffff
                  bg_opa: 22%
                  border_width: 0
                  radius: 2
                  clickable: false
                  scrollable: false
              - label:
                  id: lbl_ac_status
                  text: "OFF"
                  text_font: montserrat_14
                  text_color: 0x77779a
                  align: TOP_RIGHT
                  x: -13
                  y: 17
              - image:
                  id: img_ac
                  src: icon_ac
                  align: CENTER
                  y: -18
              - label:
                  id: lbl_slot4_name
                  text: "AC"
                  text_font: montserrat_16
                  align: CENTER
                  y: 50
            on_click:
              - if:
                  condition:
                    lambda: return !id(switches_swipe_active);
                  then:
                    - script.execute:
                        id: cmd_slot_toggle
                        slot: 4
