# Media Controller — shared interface package
#
# Everything both firmwares draw: the panel, the touchscreen, the three LVGL
# screen styles, the theme entities, and the scripts that move widgets around.
# It contains no Home Assistant entity ID and performs no Home Assistant call.
#
# Two files include it:
#
#   media-controller.yaml         entity IDs and a token in substitutions,
#                                 state over the ESPHome native API
#   media-controller-paired.yaml  paired from Home Assistant, state over REST
#
# The seam between this file and either of them is a set of names, and both
# halves have to agree on them:
#
#   Commands this file calls.     cmd_prev, cmd_play_pause, cmd_next,
#                                 cmd_volume_up, cmd_volume_down,
#                                 cmd_volume_set(level), cmd_shuffle_set(state),
#                                 cmd_repeat_set(mode), cmd_play_playlist,
#                                 cmd_slot_toggle(slot),
#                                 cmd_slot_brightness(slot, pct)
#   Fetches this file calls.      refresh_queue, ui_load_room_config,
#                                 play_queue_item
#   Scripts this file offers.     ui_apply_skin(skin) — the layout named in
#                                 the config sensor, in contract spelling
#   Globals this file offers.     room_page_index — which LVGL page the room
#                                 controls live on, as an index into the
#                                 lvgl pages list. -1, the default, means the
#                                 four fixed buttons this file draws. A
#                                 firmware that builds its own room page
#                                 appends it to lvgl.pages and writes its
#                                 index here at boot; navigation then goes
#                                 there instead. See show_room_page.
#   State this file reads.        media_title, media_artist, player_state,
#                                 volume_level, media_position, media_duration,
#                                 entity_picture, shuffle_state, repeat_state,
#                                 light1_state, light2_state,
#                                 fan_switch_state, ac_switch_state
#
# Renaming any of those is a change to both firmwares. Adding a widget that
# talks to Home Assistant directly is what this split exists to prevent: give
# it a cmd_ script instead.
#
# Two substitutions are expected from whichever file includes this one:
# ha_url and asset_base_url.
#
# This file is reached by a relative !include from a file devices fetch by raw
# URL, so its path is frozen for the same reason media-controller.yaml is.
# See docs/MERGE.md.

esphome:
  on_boot:
    priority: -100
    then:
      # -- LVGL widgets exist from here on. Restored text/number values that were
      # -- published earlier during setup were skipped by the ui_ready guard, so
      # -- the full theme is applied once here instead. --
      - lambda: id(ui_ready) = true;
      - script.execute: apply_theme
      # -- Honour the screen style restored from flash before the first frame. --
      - script.execute: show_home_page

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# The importing user configuration supplies Wi-Fi or Ethernet. Declaring the
# shared network component keeps this maintained package valid on its own.
network:

logger:

# -------------------- DEBUG / STABILITY DIAGNOSTICS --------------------
debug:
  update_interval: 5s

spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47
  interface: hardware
  id: spihwd

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true

# -------------------- BACKLIGHT --------------------
output:
  - platform: ledc
    pin: GPIO38
    id: backlight_output
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_output
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON

# -------------------- DISPLAY (ST7701S RGB) --------------------
display:
  - platform: st7701s
    id: tft_display
    spi_id: spihwd
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    auto_clear_enabled: false
    update_interval: never
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

# -------------------- TOUCHSCREEN --------------------
touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    on_touch:
      - lambda: |-
          // -- Any touch counts as activity: reset the sleep timer --
          id(screen_last_active_ms) = millis();
      - if:
          condition:
            lambda: return !id(backlight).remote_values.is_on();
          then:
            # -- Wake-up touch is consumed: turn on only the backlight.
            # -- Keep LVGL paused until the finger/gesture is fully released,
            # -- so this same interaction cannot click, long-press or swipe anything.
            - light.turn_on: backlight
    on_release:
      - lambda: |-
          // -- Start the inactivity timeout from the end of the wake gesture --
          id(screen_last_active_ms) = millis();
      - if:
          condition:
            lvgl.is_paused:
          then:
            # -- Resume only after release; the wake gesture is already finished. --
            - lvgl.resume:

# -------------------- ICON IMAGES --------------------
image:
  - platform: file
    file: "${asset_base_url}/icon_repeat_off.png"
    id: icon_repeat_off
    resize: 20x20
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/icon_repeat_all.png"
    id: icon_repeat_all
    resize: 20x20
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/icon_repeat_one.png"
    id: icon_repeat_one
    resize: 20x20
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/icon_shuffle_off.png"
    id: icon_shuffle_off
    resize: 20x20
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/icon_shuffle_on.png"
    id: icon_shuffle_on
    resize: 20x20
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/1lamp.png"
    id: icon_light1
    resize: 128x128
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/2lamps.png"
    id: icon_light2
    resize: 128x128
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/fan.png"
    id: icon_fan
    resize: 128x128
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "${asset_base_url}/ac.png"
    id: icon_ac
    resize: 128x128
    type: RGB
    transparency: alpha_channel
    
# -- Initial URL is a placeholder; real URL is set dynamically via entity_picture sensor --
# -- Classic layout source, decoded straight to the size of the screen. Without
# -- resize the buffer is whatever Home Assistant served (2 MB of PSRAM for a
# -- 1000x1000 cover) and the 480x480 widget shows a centre crop of it; at this
# -- size the whole cover is visible and the decode is cheaper. --
  - platform: online_image
    url: "${ha_url}/"
    id: album_art
    format: JPEG
    type: RGB565
    resize: 480x480
    update_interval: never
    buffer_size: 4096
    on_download_finished:
      then:
        - lvgl.image.update:
            id: album_art_img
            src: album_art
    on_error:
      then:
        - logger.log: Album art download failed

# -- Minimal Ring layout source. A separate image decoded straight to the size
# -- of the disc, rather than the Classic image scaled down at draw time: LVGL
# -- is built here with LV_COLOR_16_SWAP and without LV_DRAW_SW_SUPPORT_SWAPPED,
# -- so the software renderer cannot transform a swapped RGB565 source and
# -- produces corrupted output if asked to. resize preserves the aspect ratio,
# -- so non-square art is letterboxed in the disc instead of stretched. Only the
# -- source belonging to the active layout is downloaded; see ui_load_album_art.
  - platform: online_image
    url: "${ha_url}/"
    id: album_art_small
    format: JPEG
    type: RGB565
    resize: 244x244
    update_interval: never
    buffer_size: 4096
    on_download_finished:
      then:
        - lvgl.image.update:
            id: album_art_circle
            src: album_art_small
        - lvgl.image.update:
            id: album_art_cover
            src: album_art_small
    on_error:
      then:
        - logger.log: Album art (disc) download failed

# -------------------- COLOR CONTROLS --------------------
text:
  # -- Progress ring background color (hex, e.g. 1a1a35) --
  - platform: template
    name: "Progress Ring Color"
    id: color_arc
    mode: text
    initial_value: "1a1a35"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Progress ring fill (indicator) color --
  - platform: template
    name: "Progress Ring Fill Color"
    id: color_arc_indicator
    mode: text
    initial_value: "00cfff"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Decoration circle background color --
  - platform: template
    name: "Decoration Color"
    id: color_decoration
    mode: text
    initial_value: "00cfff"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Track title text color --
  - platform: template
    name: "Title Color"
    id: color_title
    mode: text
    initial_value: "ffffff"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Artist name text color --
  - platform: template
    name: "Artist Color"
    id: color_artist
    mode: text
    initial_value: "5588cc"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Volume label text color --
  - platform: template
    name: "Volume Color"
    id: color_volume
    mode: text
    initial_value: "334466"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Control buttons border and icon color --
  - platform: template
    name: "Buttons Color"
    id: color_buttons
    mode: text
    initial_value: "00cfff"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Transport glyph colour for the Minimal Ring and Cover Card layouts.
  # -- Kept separate from "Buttons Color" because both layouts deliberately
  # -- reserve the accent for the progress indicator and one play button, and
  # -- render everything else in neutral grey. --
  - platform: template
    name: "Flat Controls Color"
    id: color_flat_controls
    mode: text
    initial_value: "d8dce6"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

# -------------------- SCREEN STYLE --------------------
# -- Selecting a different option swaps the whole home layout at runtime.
# -- The value survives reboots, so no reflash is needed to change it. --
select:
  - platform: template
    name: "Screen Style"
    id: screen_style
    optimistic: true
    restore_value: true
    initial_option: "Classic"
    options:
      - "Classic"
      - "Minimal Ring"
      - "Cover Card"
    on_value:
      then:
        - script.execute: apply_screen_style

# -------------------- OPACITY CONTROLS --------------------
number:
  # -- Screen sleep timeout (seconds of no playback + no touch before backlight turns off) --
  - platform: template
    name: "Screen Timeout"
    id: screen_timeout
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 15
    unit_of_measurement: s
    optimistic: true
    restore_value: true

  # -- Album art image opacity --
  - platform: template
    name: "Album Art Opacity"
    id: album_art_opacity
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Progress ring opacity --
  - platform: template
    name: "Progress Ring Opacity"
    id: arc_opacity
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Decoration circle opacity --
  - platform: template
    name: "Decoration Opacity"
    id: deco_opacity
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 153
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

  # -- Control buttons background opacity --
  - platform: template
    name: "Buttons Opacity"
    id: btn_opacity
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 153
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_theme

# -------------------- ALBUM ART TRANSPORT --------------------
# online_image needs an HTTP client, so it is configured here rather than in
# either firmware: both would declare the same thing.
http_request:
  verify_ssl: false
  timeout: 10s

# -------------------- PLAYBACK PROGRESS (updates arc every second) --------------------
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(player_state).state == "playing";
          then:
            # -- publish_state fires media_position.on_value, which redraws the
            # -- progress ring on every home layout via ui_sync_progress. --
            - lambda: |-
                float pos = id(media_position).state + 1.0f;
                float dur = id(media_duration).state;
                if (dur > 0) {
                  if (pos > dur) pos = dur;
                  id(media_position).publish_state(pos);
                }
      - if:
          condition:
            lambda: |-
              bool is_playing = id(player_state).state == "playing";
              uint32_t timeout_ms = (uint32_t)(id(screen_timeout).state * 1000.0f);
              uint32_t elapsed = millis() - id(screen_last_active_ms);
              return !is_playing && elapsed >= timeout_ms && id(backlight).remote_values.is_on();
          then:
            # -- Pause LVGL input processing so buttons/swipes can't react while the screen is off --
            - lvgl.pause:
            - light.turn_off: backlight

script:
  # ════════════════════════════════════════════════════════════
  # HOME LAYOUT SELECTION
  # ════════════════════════════════════════════════════════════
  # Every home layout is a full LVGL page. Navigation never names a page
  # directly any more: it asks these scripts, which resolve the page from the
  # "Screen Style" select. Adding another layout means adding a page, an
  # option, and one branch here.

  - id: show_home_page
    then:
      # -- Never return to a home layout with its overlay still open. --
      - lvgl.widget.hide: overlay_more
      - if:
          condition:
            lambda: return id(screen_style).current_option() == "Minimal Ring";
          then:
            - lvgl.page.show: page_player_minimal
          else:
            - if:
                condition:
                  lambda: return id(screen_style).current_option() == "Cover Card";
                then:
                  - lvgl.page.show: page_player_cover
                else:
                  - lvgl.page.show: page_player

  - id: show_panel_page
    parameters:
      page: string
    then:
      - lambda: id(current_page) = page;
      - if:
          condition:
            lambda: return page == "player";
          then:
            - script.execute: show_home_page
      - if:
          condition:
            lambda: return page == "queue";
          then:
            - lvgl.page.show: page_queue
      - if:
          condition:
            lambda: return page == "playlists";
          then:
            - lvgl.page.show: page_playlists
      - if:
          condition:
            lambda: return page == "room";
          then:
            - script.execute:
                id: show_room_page
                animation: 0

  # -- The room controls are the one page a firmware may replace. This file
  # -- draws four fixed buttons, which is everything the classic firmware can
  # -- ever have: it resolves entity IDs while compiling, so a card it was not
  # -- flashed with cannot exist. A firmware that learns its room controls at
  # -- runtime appends a page of its own and points room_page_index at it.
  # --
  # -- Resolved through the page index rather than by naming a page, because
  # -- naming one would mean this file knowing about a page only one firmware
  # -- compiles. `animation` is 0 for none, 1 to move left, 2 to move right;
  # -- an int rather than an enum because a script parameter cannot be one. --
  - id: show_room_page
    parameters:
      animation: int
    then:
      - lambda: |-
          lvgl::LvPageType *fallback = id(page_switches);
          size_t index = id(room_page_index) >= 0
                             ? (size_t) id(room_page_index)
                             : fallback->index;
          lv_screen_load_anim_t anim = LV_SCREEN_LOAD_ANIM_NONE;
          if (animation == 1) anim = LV_SCREEN_LOAD_ANIM_MOVE_LEFT;
          else if (animation == 2) anim = LV_SCREEN_LOAD_ANIM_MOVE_RIGHT;
          fallback->get_parent()->show_page(
              index, anim, anim == LV_SCREEN_LOAD_ANIM_NONE ? 0 : 300);

  # -- Swipe navigation entry points. Every page-to-page swipe goes through one
  # -- of these so the debounce applies uniformly in both directions. --
  - id: nav_to_switches_move_left
    then:
      - if:
          condition:
            lambda: |-
              // -- One drag must cause one page change. A screen load animation
              // -- runs for 300 ms and the page it loads can otherwise recognise
              // -- the same drag again and navigate straight back. --
              uint32_t now = millis();
              if (now - id(last_nav_ms) < 500) return false;
              id(last_nav_ms) = now;
              return true;
          then:
            - script.execute:
                id: show_room_page
                animation: 1

  - id: nav_to_switches_move_right
    then:
      - if:
          condition:
            lambda: |-
              // -- One drag must cause one page change. A screen load animation
              // -- runs for 300 ms and the page it loads can otherwise recognise
              // -- the same drag again and navigate straight back. --
              uint32_t now = millis();
              if (now - id(last_nav_ms) < 500) return false;
              id(last_nav_ms) = now;
              return true;
          then:
            - script.execute:
                id: show_room_page
                animation: 2

  - id: nav_home_move_left
    then:
      - if:
          condition:
            lambda: |-
              // -- One drag must cause one page change. A screen load animation
              // -- runs for 300 ms and the page it loads can otherwise recognise
              // -- the same drag again and navigate straight back. --
              uint32_t now = millis();
              if (now - id(last_nav_ms) < 500) return false;
              id(last_nav_ms) = now;
              return true;
          then:
            - script.execute: show_home_page_move_left

  - id: nav_home_move_right
    then:
      - if:
          condition:
            lambda: |-
              // -- One drag must cause one page change. A screen load animation
              // -- runs for 300 ms and the page it loads can otherwise recognise
              // -- the same drag again and navigate straight back. --
              uint32_t now = millis();
              if (now - id(last_nav_ms) < 500) return false;
              id(last_nav_ms) = now;
              return true;
          then:
            - script.execute: show_home_page_move_right

  - id: show_home_page_move_left
    then:
      - lvgl.widget.hide: overlay_more
      - if:
          condition:
            lambda: return id(screen_style).current_option() == "Minimal Ring";
          then:
            - lvgl.page.show:
                id: page_player_minimal
                animation: MOVE_LEFT
                time: 300ms
          else:
            - if:
                condition:
                  lambda: return id(screen_style).current_option() == "Cover Card";
                then:
                  - lvgl.page.show:
                      id: page_player_cover
                      animation: MOVE_LEFT
                      time: 300ms
                else:
                  - lvgl.page.show:
                      id: page_player
                      animation: MOVE_LEFT
                      time: 300ms

  - id: show_home_page_move_right
    then:
      - lvgl.widget.hide: overlay_more
      - if:
          condition:
            lambda: return id(screen_style).current_option() == "Minimal Ring";
          then:
            - lvgl.page.show:
                id: page_player_minimal
                animation: MOVE_RIGHT
                time: 300ms
          else:
            - if:
                condition:
                  lambda: return id(screen_style).current_option() == "Cover Card";
                then:
                  - lvgl.page.show:
                      id: page_player_cover
                      animation: MOVE_RIGHT
                      time: 300ms
                else:
                  - lvgl.page.show:
                      id: page_player
                      animation: MOVE_RIGHT
                      time: 300ms

  # -- The skin Home Assistant asks for, in the spelling docs/CONTRACT.md
  # -- uses. Only the paired firmware calls this, from the config sensor;
  # -- the classic firmware has no settings block and never does.
  # --
  # -- The select below stays the local fallback and the thing that actually
  # -- holds the value, exactly as config.ini is for the tablet: it restores
  # -- across reboots and decides until a payload names a layout. Writing to
  # -- it rather than switching pages directly means one owner for the value,
  # -- and Home Assistant sees what the device settled on.
  # --
  # -- A name this build does not know is ignored, not treated as an error,
  # -- so a layout added to the integration cannot strand a flashed device. --
  - id: ui_apply_skin
    parameters:
      skin: string
    then:
      - lambda: |-
          const char *option = nullptr;
          if (skin == "classic") option = "Classic";
          else if (skin == "minimal_ring") option = "Minimal Ring";
          else if (skin == "cover_card") option = "Cover Card";
          if (option == nullptr) return;
          if (id(screen_style).current_option() == option) return;
          auto call = id(screen_style).make_call();
          call.set_option(option);
          call.perform();

  # -- Switch layouts only while a home layout is on screen. Changing the
  # -- select from Home Assistant must not yank the user off the queue,
  # -- playlists or room controls page. --
  - id: apply_screen_style
    then:
      - if:
          condition:
            lambda: |-
              if (!id(ui_ready)) return false;
              return id(page_player)->is_showing() ||
                     id(page_player_minimal)->is_showing() ||
                     id(page_player_cover)->is_showing();
          then:
            - script.execute: show_home_page
            - script.execute: ui_load_album_art

  # ════════════════════════════════════════════════════════════
  # UI SYNCHRONISATION
  # ════════════════════════════════════════════════════════════
  # Player state is written to every home layout, including hidden ones, so a
  # layout is already correct the instant it is shown. Sensors call these
  # scripts instead of touching widgets directly.

  - id: ui_sync_title
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const char *t = id(media_title).state.c_str();
          lv_obj_t *labels[] = { id(lbl_title), id(lbl_title_m), id(lbl_title_c) };
          for (auto *l : labels) {
            lv_label_set_text(l, t);
            lv_obj_set_style_text_align(l, LV_TEXT_ALIGN_CENTER, 0);
          }

  - id: ui_sync_artist
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const char *a = id(media_artist).state.c_str();
          lv_obj_t *labels[] = { id(lbl_artist), id(lbl_artist_m), id(lbl_artist_c) };
          for (auto *l : labels) {
            lv_label_set_text(l, a);
            lv_obj_set_style_text_align(l, LV_TEXT_ALIGN_CENTER, 0);
          }

  - id: ui_sync_play_state
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const char *sym = (id(player_state).state == "playing")
                            ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY;
          lv_label_set_text(id(lbl_play_pause), sym);
          lv_label_set_text(id(lbl_play_pause_m), sym);
          lv_label_set_text(id(lbl_play_pause_c), sym);

  - id: ui_sync_volume
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          int pct = (int)(id(volume_level).state * 100.0f);
          std::string vol = "Volume: " + to_string(pct) + "%";
          lv_label_set_text(id(lbl_volume), vol.c_str());
          // -- Do not move the Cover Card knob out from under a finger that is
          // -- still on it, nor snap it back before HA has applied the change. --
          if (millis() - id(volume_touch_ms) > 2000) {
            lv_slider_set_value(id(slider_volume_c), pct, LV_ANIM_OFF);
          }

  # -- Both rings share one source of truth. The Minimal Ring layout also
  # -- carries a knob dot that has to be placed on the ring by hand, because
  # -- the arc knob part is removed for non-adjustable arcs. --
  - id: ui_sync_progress
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          float dur = id(media_duration).state;
          int progress = 0;
          if (dur > 0) {
            progress = (int)((id(media_position).state / dur) * 100.0f);
            if (progress < 0) progress = 0;
            if (progress > 100) progress = 100;
          }
          lv_arc_set_value(id(progress_arc), progress);
          lv_arc_set_value(id(progress_arc_m), progress);
          lv_bar_set_value(id(progress_bar_c), progress, LV_ANIM_OFF);

          // -- Cover Card time readout --
          auto fmt = [](int secs) {
            if (secs < 0) secs = 0;
            char buf[12];
            snprintf(buf, sizeof(buf), "%d:%02d", secs / 60, secs % 60);
            return std::string(buf);
          };
          if (dur > 0) {
            lv_label_set_text(id(lbl_elapsed_c), fmt((int)id(media_position).state).c_str());
            lv_label_set_text(id(lbl_total_c), fmt((int)dur).c_str());
          } else {
            lv_label_set_text(id(lbl_elapsed_c), "--:--");
            lv_label_set_text(id(lbl_total_c), "--:--");
          }

          // -- Ring geometry of the Minimal Ring layout, kept in sync with the
          // -- arc widget below: 300 px across, 4 px stroke, centred at y=-78. --
          const float MIN_RING_RADIUS = 148.0f;
          const int   MIN_RING_CENTER_Y = -78;
          const float MIN_ARC_START_DEG = 135.0f;
          const float MIN_ARC_SWEEP_DEG = 270.0f;

          float deg = MIN_ARC_START_DEG + MIN_ARC_SWEEP_DEG * (progress / 100.0f);
          float rad = deg * (float)M_PI / 180.0f;
          lv_obj_align(id(progress_dot_m), LV_ALIGN_CENTER,
                       (int)(MIN_RING_RADIUS * cosf(rad)),
                       MIN_RING_CENTER_Y + (int)(MIN_RING_RADIUS * sinf(rad)));

  - id: ui_sync_shuffle
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const std::string &x = id(shuffle_state).state;
          bool is_on = (x == "on" || x == "True" || x == "true" || x == "1");
          lv_obj_t *offs[] = { id(img_shuffle_off), id(img_shuffle_off_m), id(img_shuffle_off_c) };
          lv_obj_t *ons[]  = { id(img_shuffle_on),  id(img_shuffle_on_m),  id(img_shuffle_on_c)  };
          for (size_t i = 0; i < sizeof(offs) / sizeof(offs[0]); i++) {
            if (is_on) {
              lv_obj_add_flag(offs[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(ons[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_remove_flag(offs[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(ons[i], LV_OBJ_FLAG_HIDDEN);
            }
          }

  - id: ui_sync_repeat
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const std::string &x = id(repeat_state).state;
          lv_obj_t *offs[] = { id(img_repeat_off), id(img_repeat_off_m), id(img_repeat_off_c) };
          lv_obj_t *alls[] = { id(img_repeat_all), id(img_repeat_all_m), id(img_repeat_all_c) };
          lv_obj_t *ones[] = { id(img_repeat_one), id(img_repeat_one_m), id(img_repeat_one_c) };
          for (size_t i = 0; i < sizeof(offs) / sizeof(offs[0]); i++) {
            lv_obj_add_flag(offs[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(alls[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(ones[i], LV_OBJ_FLAG_HIDDEN);
            if (x == "off") {
              lv_obj_remove_flag(offs[i], LV_OBJ_FLAG_HIDDEN);
            } else if (x == "all") {
              lv_obj_remove_flag(alls[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_remove_flag(ones[i], LV_OBJ_FLAG_HIDDEN);
            }
          }

  # -- Each layout has its own album art source at its own resolution. Fetch
  # -- only the one that is on screen, so switching styles never triggers two
  # -- concurrent HTTP requests and a hidden layout costs no traffic. --
  # ════════════════════════════════════════════════════════════
  # ROOM SLOTS
  # ════════════════════════════════════════════════════════════
  # A button here knows only its slot number. What it is called and whether it
  # is shown at all comes from the integration at runtime — an empty slot has
  # no tile — and which entity is behind it is the transport half's business:
  # a compile-time substitution in the classic firmware, a string read from the
  # config sensor in the paired one.

  - id: ui_load_album_art
    then:
      - if:
          condition:
            lambda: |-
              // -- Minimal Ring and Cover Card share the 244 px source. --
              auto style = id(screen_style).current_option();
              return style == "Minimal Ring" || style == "Cover Card";
          then:
            - lambda: |-
                id(album_art_small).update();
          else:
            - lambda: |-
                id(album_art).update();

  # ════════════════════════════════════════════════════════════
  # THEME
  # ════════════════════════════════════════════════════════════
  # Single place where the colour and opacity entities are turned into LVGL
  # styles. Called once from on_boot and again whenever one of them changes,
  # so on-boot restore and live edits cannot drift apart.

  - id: apply_theme
    then:
      - lambda: |-
          if (!id(ui_ready)) return;

          auto hex = [](const std::string &s) {
            unsigned long v = strtoul(s.c_str(), nullptr, 16);
            return lv_color_make((v >> 16) & 0xFF, (v >> 8) & 0xFF, v & 0xFF);
          };

          lv_color_t col_arc  = hex(id(color_arc).state);
          lv_color_t col_ind  = hex(id(color_arc_indicator).state);
          lv_color_t col_deco = hex(id(color_decoration).state);
          lv_color_t col_ttl  = hex(id(color_title).state);
          lv_color_t col_art  = hex(id(color_artist).state);
          lv_color_t col_vol  = hex(id(color_volume).state);
          lv_color_t col_btn  = hex(id(color_buttons).state);
          lv_color_t col_flat = hex(id(color_flat_controls).state);

          int arc_opa  = (int)id(arc_opacity).state;
          int art_opa  = (int)id(album_art_opacity).state;
          int deco_opa = (int)id(deco_opacity).state;
          int btn_opa  = (int)id(btn_opacity).state;

          // -------- Progress indicators --------
          lv_obj_t *arcs[] = { id(progress_arc), id(progress_arc_m) };
          for (auto *a : arcs) {
            lv_obj_set_style_arc_color(a, col_arc, LV_PART_MAIN);
            lv_obj_set_style_arc_color(a, col_ind, LV_PART_INDICATOR);
            lv_obj_set_style_arc_opa(a, arc_opa, LV_PART_MAIN);
            lv_obj_set_style_arc_opa(a, arc_opa, LV_PART_INDICATOR);
          }
          lv_obj_set_style_bg_color(id(progress_dot_m), col_ind, 0);
          lv_obj_set_style_shadow_color(id(progress_dot_m), col_ind, 0);
          lv_obj_set_style_bg_opa(id(progress_dot_m), arc_opa, 0);

          // -- Cover Card uses a linear bar and a volume slider for the same
          // -- two roles the rings fill elsewhere. --
          lv_obj_set_style_bg_color(id(progress_bar_c), col_arc, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(progress_bar_c), col_ind, LV_PART_INDICATOR);
          lv_obj_set_style_bg_opa(id(progress_bar_c), arc_opa, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(slider_volume_c), col_arc, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(slider_volume_c), col_ind, LV_PART_INDICATOR);

          // -------- Track text --------
          lv_obj_t *titles[]  = { id(lbl_title), id(lbl_title_m), id(lbl_title_c) };
          lv_obj_t *artists[] = { id(lbl_artist), id(lbl_artist_m), id(lbl_artist_c) };
          for (auto *l : titles) {
            lv_obj_set_style_text_color(l, col_ttl, 0);
            lv_obj_set_style_text_align(l, LV_TEXT_ALIGN_CENTER, 0);
          }
          for (auto *l : artists) {
            lv_obj_set_style_text_color(l, col_art, 0);
            lv_obj_set_style_text_align(l, LV_TEXT_ALIGN_CENTER, 0);
          }
          lv_obj_set_style_text_color(id(lbl_volume), col_vol, 0);
          lv_obj_set_style_text_color(id(lbl_elapsed_c), col_vol, 0);
          lv_obj_set_style_text_color(id(lbl_total_c), col_vol, 0);

          // -------- Album art --------
          lv_obj_set_style_img_opa(id(album_art_img), art_opa, 0);
          lv_obj_set_style_img_opa(id(album_art_circle), art_opa, 0);
          lv_obj_set_style_img_opa(id(album_art_cover), art_opa, 0);

          // -------- Classic decoration circle --------
          lv_obj_set_style_bg_color(id(btn_decoration), col_deco, 0);
          lv_obj_set_style_shadow_color(id(btn_decoration), col_deco, 0);
          lv_obj_set_style_bg_opa(id(btn_decoration), deco_opa, 0);

          // -------- Accent-coloured buttons (Classic, playlists, overlay) --------
          lv_obj_t *accent_btns[] = {
            id(btn_prev), id(btn_play_pause), id(btn_next),
            id(btn_vol_down), id(btn_vol_up),
            id(btn_to_queue), id(btn_to_playlists),
            id(btn_shuffle), id(btn_repeat),
            id(btn_back_playlists), id(btn_play_playlist),
            id(btn_shuffle_m), id(btn_repeat_m),
            id(btn_queue_m), id(btn_playlists_m), id(btn_close_more_m),
          };
          for (auto *b : accent_btns) {
            lv_obj_set_style_border_color(b, col_btn, 0);
            lv_obj_set_style_bg_opa(b, btn_opa, 0);
            lv_obj_t *child = lv_obj_get_child(b, 0);
            if (child != NULL && lv_obj_check_type(child, &lv_label_class)) {
              lv_obj_set_style_text_color(child, col_btn, 0);
            }
          }

          // -------- Shuffle / repeat icons --------
          lv_obj_t *icons[] = {
            id(img_shuffle_off), id(img_shuffle_on),
            id(img_repeat_off), id(img_repeat_all), id(img_repeat_one),
            id(img_shuffle_off_m), id(img_shuffle_on_m),
            id(img_repeat_off_m), id(img_repeat_all_m), id(img_repeat_one_m),
            id(img_shuffle_off_c), id(img_shuffle_on_c),
            id(img_repeat_off_c), id(img_repeat_all_c), id(img_repeat_one_c),
          };
          for (auto *i : icons) {
            lv_obj_set_style_img_recolor(i, col_btn, 0);
            lv_obj_set_style_img_recolor_opa(i, LV_OPA_COVER, 0);
          }

          // -------- Flat transport glyphs (Minimal Ring, Cover Card) --------
          lv_obj_t *flat_glyphs[] = {
            id(btn_prev_m), id(btn_play_pause_m), id(btn_next_m),
            id(btn_vol_down_m), id(btn_vol_up_m), id(btn_more_m),
            id(btn_prev_c), id(btn_next_c),
            id(btn_to_queue_c), id(btn_to_playlists_c),
            id(btn_vol_down_c), id(btn_vol_up_c),
          };
          for (auto *b : flat_glyphs) {
            lv_obj_t *child = lv_obj_get_child(b, 0);
            if (child != NULL && lv_obj_check_type(child, &lv_label_class)) {
              lv_obj_set_style_text_color(child, col_flat, 0);
            }
          }
          lv_obj_set_style_border_color(id(btn_play_pause_m), col_flat, 0);

          // -- Cover Card's play button is the one filled accent control. --
          lv_obj_set_style_bg_color(id(btn_play_pause_c), col_btn, 0);
          lv_obj_set_style_shadow_color(id(btn_play_pause_c), col_btn, 0);

