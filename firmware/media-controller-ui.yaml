  # ════════════════════════════════════════════════════════════
  # PAYLOAD TO WIDGETS
  # ════════════════════════════════════════════════════════════
  # Three payloads arrive from Home Assistant and three parts of the screen
  # are built out of them. Which request fetched a payload is not their
  # business, so each takes it as a parameter and both firmwares call the
  # same script. See this file's header for the rest of the seam.

  - id: rebuild_playlists
    parameters:
      payload: string
    then:
      - lambda: |-
          size_t attr_pos = payload.find("\"attributes\":");
          if (attr_pos == std::string::npos) return;
          size_t names_pos = payload.find("\"names\":", attr_pos);
          size_t uris_pos = payload.find("\"uris\":", attr_pos);
          if (names_pos == std::string::npos || uris_pos == std::string::npos) return;
          size_t names_start = payload.find('[', names_pos);
          size_t names_end = payload.find(']', names_start);
          std::string names_json = payload.substr(names_start, names_end - names_start + 1);
          size_t uris_start = payload.find('[', uris_pos);
          size_t uris_end = payload.find(']', uris_start);
          std::string uris_json = payload.substr(uris_start, uris_end - uris_start + 1);
          id(playlist_names) = id(json_string_array_parser)(names_json);
          id(playlist_uris) = id(json_string_array_parser)(uris_json);
          ESP_LOGD("playlist", "Loaded %d playlists",
                   id(playlist_names).size());
          std::string options = "";
          for (size_t i = 0; i < id(playlist_names).size(); i++) {
            if (i > 0) options += "\n";
            options += id(playlist_names)[i];
          }
          if (!options.empty()) {
            lv_roller_set_options(
              (lv_obj_t*)id(playlist_roller)->obj,
              options.c_str(),
              LV_ROLLER_MODE_NORMAL);
          }

  # -- Rebuilding the list creates about fifty widgets, so it must not be
  # -- allowed to run twice at once. --
  - id: rebuild_queue
    mode: restart
    parameters:
      payload: string
    then:
      - lambda: |-
          size_t data_pos = payload.find("\"data\":");
          if (data_pos == std::string::npos) return;

          // -- Guard: "count" key must exist, else str_end math underflows into a huge size_t --
          size_t count_pos = payload.find("\"count\"");
          if (count_pos == std::string::npos || count_pos < 2) {
            ESP_LOGD("queue", "No count key, skipping rebuild");
            lv_obj_clean((lv_obj_t*)id(queue_container));
            id(queue_title_list).clear();
            id(queue_artist_list).clear();
            id(queue_id_list).clear();
            id(queue_current_idx) = 0;
            return;
          }

          size_t str_quote = payload.find('"', data_pos + 7);
          if (str_quote == std::string::npos) {
            ESP_LOGW("queue", "Malformed data field: opening quote not found");
            return;
          }
          size_t str_start = str_quote + 1;
          size_t str_end = payload.rfind('"', count_pos - 2);
          if (str_end == std::string::npos || str_end <= str_start) {
            ESP_LOGW("queue", "Malformed data field, skipping rebuild");
            return;
          }
          std::string s = payload.substr(str_start, str_end - str_start);

          std::string unescaped;
          unescaped.reserve(s.size());
          for (size_t i = 0; i < s.size(); i++) {
            if (s[i] == '\\' && i + 1 < s.size()) {
              if (s[i+1] == '"') { unescaped += '"'; i++; }
              else if (s[i+1] == '\\') { unescaped += '\\'; i++; }
              else if (s[i+1] == 'n') { unescaped += '\n'; i++; }
              else { unescaped += s[i]; }
            } else {
              unescaped += s[i];
            }
          }

          // -- Bail out early when the queue is empty / player idle --
          if (unescaped.find("\"titles\":") == std::string::npos ||
              unescaped.find("\"titles\":[]") != std::string::npos) {
            ESP_LOGD("queue", "Empty queue, skipping rebuild");
            lv_obj_clean((lv_obj_t*)id(queue_container));
            id(queue_title_list).clear();
            id(queue_artist_list).clear();
            id(queue_id_list).clear();
            id(queue_current_idx) = 0;
            return;
          }

          size_t ci_pos = unescaped.find("\"current_index\":");
          if (ci_pos != std::string::npos) {
            std::string ci_raw = unescaped.substr(ci_pos + 16, 8);
            // -- Trim leading whitespace --
            size_t nb = ci_raw.find_first_not_of(" \t");
            int ci_val = 0;
            if (nb != std::string::npos &&
                (isdigit((unsigned char)ci_raw[nb]) || ci_raw[nb] == '-')) {
              ci_val = atoi(ci_raw.c_str() + nb);
            }
            if (ci_val < 0) ci_val = 0;
            id(queue_current_idx) = ci_val;
          }

          size_t t_start = unescaped.find("\"titles\":");
          size_t a_start = unescaped.find("\"artists\":");
          size_t q_start = unescaped.find("\"queue_ids\":");
          if (t_start == std::string::npos || a_start == std::string::npos || q_start == std::string::npos) {
            ESP_LOGW("queue", "Queue JSON is missing one or more required arrays");
            return;
          }

          size_t t_arr_start = unescaped.find('[', t_start);
          size_t t_arr_end = (t_arr_start != std::string::npos) ? unescaped.find(']', t_arr_start) : std::string::npos;
          size_t a_arr_start = unescaped.find('[', a_start);
          size_t a_arr_end = (a_arr_start != std::string::npos) ? unescaped.find(']', a_arr_start) : std::string::npos;
          size_t q_arr_start = unescaped.find('[', q_start);
          size_t q_arr_end = (q_arr_start != std::string::npos) ? unescaped.find(']', q_arr_start) : std::string::npos;

          if (t_arr_start == std::string::npos || t_arr_end == std::string::npos ||
              a_arr_start == std::string::npos || a_arr_end == std::string::npos ||
              q_arr_start == std::string::npos || q_arr_end == std::string::npos ||
              t_arr_end < t_arr_start || a_arr_end < a_arr_start || q_arr_end < q_arr_start) {
            ESP_LOGW("queue", "Queue JSON contains malformed arrays");
            return;
          }

          std::string titles_json = unescaped.substr(t_arr_start, t_arr_end - t_arr_start + 1);
          std::string artists_json = unescaped.substr(a_arr_start, a_arr_end - a_arr_start + 1);
          std::string ids_json = unescaped.substr(q_arr_start, q_arr_end - q_arr_start + 1);

          id(queue_title_list) = id(json_string_array_parser)(titles_json);
          id(queue_artist_list) = id(json_string_array_parser)(artists_json);
          id(queue_id_list) = id(json_string_array_parser)(ids_json);

          // Keep all parallel arrays at the same safe size.
          size_t safe_count = id(queue_title_list).size();
          if (id(queue_artist_list).size() < safe_count) safe_count = id(queue_artist_list).size();
          if (id(queue_id_list).size() < safe_count) safe_count = id(queue_id_list).size();
          if (id(queue_title_list).size() != safe_count) id(queue_title_list).resize(safe_count);
          if (id(queue_artist_list).size() != safe_count) id(queue_artist_list).resize(safe_count);
          if (id(queue_id_list).size() != safe_count) id(queue_id_list).resize(safe_count);

          if (safe_count == 0) {
            ESP_LOGD("queue", "Parsed queue is empty");
            lv_obj_clean((lv_obj_t*)id(queue_container));
            id(queue_current_idx) = 0;
            id(selected_queue_idx) = -1;
            return;
          }

          if (id(queue_current_idx) >= (int)safe_count) {
            id(queue_current_idx) = (int)safe_count - 1;
          }
          id(selected_queue_idx) = -1;

          ESP_LOGD("queue", "Parsed %d tracks, current=%d",
                   (int)safe_count, id(queue_current_idx));

          // -- Rebuild queue buttons --
          // -- Only render a window of tracks around the current one: with long
          //    queues (100+ tracks), creating a native LVGL widget per track blew
          //    up memory/layout cost enough to crash the device --
          lv_obj_t* cont = (lv_obj_t*)id(queue_container);
          lv_obj_clean(cont);
          lv_obj_set_flex_flow(cont, LV_FLEX_FLOW_COLUMN);
          lv_obj_set_flex_align(cont, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START);

          int qw_total = (int)id(queue_title_list).size();
          const int WINDOW_BEFORE = 5;
          const int WINDOW_SIZE = 50;
          int qw_start = id(queue_current_idx) - WINDOW_BEFORE;
          if (qw_start < 0) qw_start = 0;
          int qw_end = qw_start + WINDOW_SIZE;
          if (qw_end > qw_total) qw_end = qw_total;
          if (qw_end - qw_start < WINDOW_SIZE) {
            qw_start = qw_end - WINDOW_SIZE;
            if (qw_start < 0) qw_start = 0;
          }
          id(queue_window_start) = qw_start;

          for (int i = qw_start; i < qw_end; i++) {
            lv_obj_t* btn = lv_btn_create(cont);
            lv_obj_set_width(btn, 428);
            lv_obj_set_height(btn, LV_SIZE_CONTENT);
            lv_obj_set_style_pad_ver(btn, 6, 0);
            lv_obj_set_style_pad_hor(btn, 8, 0);
            lv_obj_set_style_radius(btn, 6, 0);
            lv_obj_set_style_border_width(btn, 0, 0);
            lv_obj_set_style_margin_bottom(btn, 2, 0);
            lv_obj_set_flex_flow(btn, LV_FLEX_FLOW_COLUMN);

            if ((int)i < id(queue_current_idx)) {
              // -- Past: темний і приглушений --
              lv_obj_set_style_bg_color(btn, lv_color_hex(0x080810), 0);
              lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
            } else if ((int)i == id(queue_current_idx)) {
              // -- Current: підсвічений cyan рамкою --
              lv_obj_set_style_bg_color(btn, lv_color_hex(0x002233), 0);
              lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
              lv_obj_set_style_border_color(btn, lv_color_hex(0x00cfff), 0);
              lv_obj_set_style_border_width(btn, 2, 0);
            } else {
              // -- Future: звичайний --
              lv_obj_set_style_bg_color(btn, lv_color_hex(0x12122a), 0);
              lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
            }

            if ((int)i == id(selected_queue_idx)) {
              // -- Selected (одинарний клік): бурштиновий фон поверх базового кольору --
              lv_obj_set_style_bg_color(btn, lv_color_hex(0x664400), 0);
              lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
            }

            // -- Title --
            lv_obj_t* lbl_t = lv_label_create(btn);
            lv_label_set_text(lbl_t, id(queue_title_list)[i].c_str());
            lv_label_set_long_mode(lbl_t, LV_LABEL_LONG_DOT);
            lv_obj_set_width(lbl_t, 408);
            lv_obj_set_style_text_font(lbl_t, id(roboto_16), 0);

            if ((int)i < id(queue_current_idx)) {
              lv_obj_set_style_text_color(lbl_t, lv_color_hex(0x333355), 0);
            } else if ((int)i == id(queue_current_idx)) {
              lv_obj_set_style_text_color(lbl_t, lv_color_hex(0x00cfff), 0);
            } else {
              lv_obj_set_style_text_color(lbl_t, lv_color_hex(0xffffff), 0);
            }

            // -- Artist --
            lv_obj_t* lbl_a = lv_label_create(btn);
            lv_label_set_text(lbl_a, id(queue_artist_list)[i].c_str());
            lv_label_set_long_mode(lbl_a, LV_LABEL_LONG_DOT);
            lv_obj_set_width(lbl_a, 408);
            lv_obj_set_style_text_font(lbl_a, id(roboto_16), 0);

            if ((int)i < id(queue_current_idx)) {
              lv_obj_set_style_text_color(lbl_a, lv_color_hex(0x222244), 0);
            } else if ((int)i == id(queue_current_idx)) {
              lv_obj_set_style_text_color(lbl_a, lv_color_hex(0x0077aa), 0);
            } else {
              lv_obj_set_style_text_color(lbl_a, lv_color_hex(0x5588cc), 0);
            }

            lv_obj_set_user_data(btn, (void*)i);
            lv_obj_add_event_cb(btn, [](lv_event_t* e) {
              lv_obj_t* b = (lv_obj_t*)lv_event_get_target(e);
              int idx = (int)(size_t)lv_obj_get_user_data(b);
              uint32_t now = lv_tick_get();
              static uint32_t last_click_time = 0;
              static int last_click_idx = -1;
              bool is_double = (idx == last_click_idx) && (now - last_click_time < 400);

              // -- Revert previously selected track back to its base color --
              int prev_idx = id(selected_queue_idx);
              if (prev_idx != idx && prev_idx >= 0) {
                lv_obj_t* cont = (lv_obj_t*)id(queue_container);
                int prev_child = prev_idx - id(queue_window_start);
                lv_obj_t* prev_btn = (prev_child >= 0) ? lv_obj_get_child(cont, prev_child) : NULL;
                if (prev_btn) {
                  if (prev_idx < id(queue_current_idx)) {
                    lv_obj_set_style_bg_color(prev_btn, lv_color_hex(0x080810), 0);
                  } else if (prev_idx == id(queue_current_idx)) {
                    lv_obj_set_style_bg_color(prev_btn, lv_color_hex(0x002233), 0);
                  } else {
                    lv_obj_set_style_bg_color(prev_btn, lv_color_hex(0x12122a), 0);
                  }
                }
              }

              // -- Highlight the newly selected track --
              lv_obj_set_style_bg_color(b, lv_color_hex(0x664400), 0);
              id(selected_queue_idx) = idx;

              if (is_double) {
                last_click_idx = -1;
                // -- Simulate pressing the "Play" button, so behavior is identical --
                lv_obj_send_event(id(btn_play_queue_item), LV_EVENT_CLICKED, NULL);
              } else {
                last_click_idx = idx;
                last_click_time = now;
              }
            }, LV_EVENT_CLICKED, NULL);
          }

      # -- Scroll after a short delay, once LVGL has settled the layout of the
      #    freshly created widgets: forcing a scroll (which forces a layout
      #    recalculation) immediately after creating ~50 objects crashed the device --
      - delay: 100ms
      - lambda: |-
          lv_obj_t* cont = (lv_obj_t*)id(queue_container);
          int cur_child = id(queue_current_idx) - id(queue_window_start);
          lv_obj_t* cur_btn = (cur_child >= 0) ? lv_obj_get_child(cont, cur_child) : NULL;
          if (cur_btn) lv_obj_scroll_to_view(cur_btn, LV_ANIM_OFF);

  # -- A slot with no label is not configured, and an unconfigured slot has
  # -- no tile. --
  - id: apply_slots
    parameters:
      payload: string
    then:
      - lambda: |-
          // -- LVGL widgets exist only after the on_boot handler has
          //    run. A client that connects earlier is handled by the
          //    next reconnect, which runs this script again. --
          if (!id(ui_ready)) return;
          // -- An LVGL widget id is already an lv_obj_t *. It used to be a
          //    wrapper with an .obj member, and the ->obj this code carried
          //    from that era stopped compiling when ESPHome changed it. --
          lv_obj_t *buttons[4] = {
            id(btn_light1),
            id(btn_light2),
            id(btn_switch_fan),
            id(btn_switch_ac),
          };
          lv_obj_t *labels[4] = {
            id(lbl_slot1_name),
            id(lbl_slot2_name),
            id(lbl_slot3_name),
            id(lbl_slot4_name),
          };
          for (int slot = 1; slot <= 4; slot++) {
            std::string label = id(slot_label_parser)(payload, slot);
            lv_obj_t *button = buttons[slot - 1];
            if (label.empty()) {
              lv_obj_add_flag(button, LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            lv_label_set_text(labels[slot - 1], label.c_str());
            lv_obj_clear_flag(button, LV_OBJ_FLAG_HIDDEN);
          }
          ESP_LOGD("slots", "Applied the room slots");

