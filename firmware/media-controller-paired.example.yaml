# The ESPHome route to the paired firmware, for an installation that already
# runs ESPHome and wants this device in that dashboard.
#
# If you do not run ESPHome, you do not need any of this: the same firmware is
# published as one finished image at
# https://vahac.github.io/ha-media-controller/ and installed from a browser
# over USB. See docs/ESP32_PAIRED_CONTROLLER.md.

substitutions:
  # Keep the existing ESPHome device name when updating an already adopted
  # device; changing it creates a different device identity in Home Assistant.
  device_name: media-controller
  friendly_name: Media Controller

  # Where Home Assistant is. This is the only address the firmware needs, and
  # the only value you copy from anywhere. Use an IP address if .local names
  # are unreliable on your network.
  ha_url: "http://homeassistant.local:8123"

# No entity IDs and no token. The device shows a six-digit code on its own
# screen, Home Assistant discovers it and asks you to type that code, and
# everything else is chosen in the Home Assistant UI afterwards. Changing which
# lamp a button drives never means flashing again.

packages:
  media_controller:
    url: https://github.com/VahaC/ha-media-controller
    ref: main
    files:
      - firmware/media-controller-paired.yaml
    refresh: 1h

# These three are what make this a build of your own rather than a copy of the
# published image, and they are also why this device ignores the **Firmware**
# update entity in Home Assistant. That entity offers the factory image, which
# deliberately carries no credentials of any kind: installing it here would
# replace the Wi-Fi below with nothing at all, and the panel would come back on
# its recovery access point with no way to reach the network or ESPHome. The
# firmware refuses the command for that reason and says so in its log. This
# device is updated from ESPHome Device Builder, over the OTA password at the
# bottom of this file, exactly as it always was.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESPHome leaves Wi-Fi power saving on by default, which parks the radio
  # between the access point's beacons and makes every round trip wait for the
  # next one. This panel is drawn by an RGB display that the processor refreshes
  # itself, and it reads Home Assistant over blocking HTTP requests: a request
  # that waits on beacons holds the main loop, and a held main loop is a picture
  # that visibly jumps. The device is mains powered and has nothing to save, so
  # turn it off.
  power_save_mode: NONE

api:
  encryption:
    key: !secret media_controller_api_encryption_key

ota:
  - platform: esphome
    password: !secret media_controller_ota_password
