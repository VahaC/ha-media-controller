name: Firmware

on:
  push:
    branches: [main, dev]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  validate:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      - name: Validate the maintained package
        # The maintained file carries its own substitution defaults and no
        # !secret lookups, so it validates standalone. Image assets are fetched
        # from asset_base_url during validation.
        run: esphome config firmware/media-controller.yaml
