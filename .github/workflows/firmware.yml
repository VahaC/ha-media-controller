name: Firmware

on:
  push:
    branches: [main, dev]
    paths:
      - "firmware/**"
      - "components/**"
      - "installer/**"
      - "tools/make-web-installer.py"
      - "tools/check-installer-manifest.py"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "components/**"
      - "installer/**"
      - "tools/make-web-installer.py"
      - "tools/check-installer-manifest.py"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  validate:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        # Pinned. See firmware/requirements.txt: the toolchain decides
        # whether the published image has a bootloader that can roll an
        # update back, and an application OTA cannot replace a bootloader
        # afterwards.
        run: pip install -r firmware/requirements.txt
      - name: Validate the maintained packages
        # The paired package intentionally receives Wi-Fi from the importing
        # device YAML, so validate it through a complete local device wrapper
        # instead of pretending the package is a complete device
        # configuration. The wrapper carries no `api:` and no
        # `ota: platform: esphome`, because a shipped panel has neither and a
        # wrapper that added them back would be validating something nobody
        # runs.
        #
        # The factory entrypoint needs no wrapper: it is a complete device
        # configuration on purpose, because it is the thing that gets built
        # and published.
        #
        # grid_component_source and asset_base_url are overridden to the
        # checkout. Their defaults are this repository on main, which is right
        # for a flashed device and wrong here: a pull request that changes the
        # component or adds an image asset would otherwise be validated
        # against the copies already on main — and a new asset, which exists
        # only in the pull request, would fail with a 404 that no code change
        # can fix. The paths are relative to the directory of the
        # configuration being validated, which is firmware/.
        run: |
          trap 'rm -f firmware/.ci-paired.yaml' EXIT
          printf '%s\n' \
            'substitutions:' \
            '  grid_component_source: ../components' \
            '  asset_base_url: assets' \
            '' \
            'packages:' \
            '  paired: !include media-controller-paired.yaml' \
            '' \
            'wifi:' \
            '  ssid: ci-validation-network' \
            '  password: ci-validation-password' \
            > firmware/.ci-paired.yaml
          esphome config firmware/.ci-paired.yaml
          esphome config firmware/media-controller-factory.yaml

      - name: Check no shipped firmware carries the ESPHome native API
        # Contract version 9 removed it, and removing it is the whole point of
        # that version rather than a tidy-up: `api:` is what defines USE_API,
        # USE_API is what publishes the `_esphomelib._tcp` mDNS record, and
        # that record is what makes a panel appear in the ESPHome integration.
        # One key put back by accident undoes all of it silently, because
        # everything still compiles and still works — the panel simply turns
        # up in an integration it is supposed to have left.
        #
        # An owner of a package build may still opt in, in their own device
        # YAML. That is theirs and is not checked here; these two files are
        # what every panel installed from the web installer runs.
        run: |
          status=0
          for config in firmware/media-controller-paired.yaml \
                        firmware/media-controller-factory.yaml; do
            if grep -nE '^api:' "$config"; then
              echo "::error file=$config::A shipped firmware must not declare api:; see \"THERE IS NO ESPHome NATIVE API\" in firmware/media-controller-paired.yaml."
              status=1
            fi
            if grep -nE '^\s+-?\s*platform:\s*esphome\s*$' "$config"; then
              echo "::error file=$config::ota: platform: esphome has a password, and a password compiled into a public binary is the same password on every panel."
              status=1
            fi
          done
          exit $status

      - name: Check the interface package names no transport
        # The interface package is everything about widgets and nothing about
        # reaching Home Assistant, which is what let it be built into an image
        # that has no Home Assistant address at all. A widget that calls
        # homeassistant.service directly, or an entity ID that creeps back
        # into a substitution, would end that quietly. Catch it here rather
        # than on the bench. See the header of media-controller-ui.yaml.
        run: |
          ui=firmware/media-controller-ui.yaml
          status=0

          if grep -n 'homeassistant\.' "$ui"; then
            echo "::error file=$ui::The interface package must not call Home Assistant directly; add a cmd_ script to the transport half instead."
            status=1
          fi

          # asset_base_url is the only one the interface is allowed to expect
          # from whichever firmware includes it. ha_url used to be the second;
          # it is gone because the paired firmware learns its address at
          # runtime and the factory image has none at all, so an interface
          # that named one could not be built into that image.
          if grep -o '\${[a-z_0-9]*}' "$ui" | sort -u \
              | grep -vE '^\$\{asset_base_url\}$'; then
            echo "::error file=$ui::The interface package may only use the asset_base_url substitution."
            status=1
          fi

          exit $status

      - name: Check the shipped image stays universal
        # These read firmware/, components/ and installer/ rather than
        # custom_components/, so they belong to this workflow's path filter
        # and not to the integration's. They are the cheap half of the rule
        # the factory job enforces against the compiled binary.
        run: python -m unittest tests.test_factory_firmware -v

  factory:
    name: Build the web installer
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the ESPHome and PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            ~/.esphome
          key: esphome-factory-${{ hashFiles('firmware/requirements.txt', 'firmware/media-controller-factory.yaml') }}
          restore-keys: esphome-factory-
      - name: Install ESPHome
        # Pinned. See firmware/requirements.txt: the toolchain decides
        # whether the published image has a bootloader that can roll an
        # update back, and an application OTA cannot replace a bootloader
        # afterwards.
        run: pip install -r firmware/requirements.txt
      - name: Compile the factory firmware
        run: esphome compile firmware/media-controller-factory.yaml
      - name: Assemble the installer, and refuse a personal image
        # This is where the "no credentials in an artifact" rule is actually
        # enforced: the script reads the merged image and fails the build if
        # anything installation-specific is inside it, before it is ever
        # published. See tools/make-web-installer.py.
        run: python tools/make-web-installer.py --build-dir firmware/.esphome/build
      - name: Check every file the manifest names exists
        run: python tools/check-installer-manifest.py
      - name: Upload the installer site
        uses: actions/upload-artifact@v4
        with:
          name: web-installer
          path: installer/
          if-no-files-found: error
