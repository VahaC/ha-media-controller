name: T560 panel

on:
  push:
    branches: [main, dev]
    paths:
      - "clients/t560/**"
      - ".github/workflows/t560-panel.yml"
  pull_request:
    paths:
      - "clients/t560/**"
      - ".github/workflows/t560-panel.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: clients/t560

jobs:
  tests:
    name: Build and test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libsoup-3.0-dev \
            libjson-glib-dev libglib2.0-bin
        working-directory: .
      - name: Build
        run: make
      - name: Test
        # Runs the C JSON helper tests and the Python helper tests.
        run: make test

  armv7:
    name: Build for ARMv7 (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build the target artifact
        working-directory: .
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD/clients/t560:/src" -w /src alpine:3.20 \
            sh -lc "set -eu; \
              apk add --no-cache build-base gtk+3.0-dev libsoup3-dev \
                json-glib-dev file python3; \
              make clean; make; make test; \
              file t560-panel | tee /tmp/t560-file; \
              grep -q 'ELF 32-bit' /tmp/t560-file; \
              grep -q 'ARM' /tmp/t560-file; \
              grep -q 'EABI5' /tmp/t560-file; \
              grep -q '/lib/ld-musl-armhf.so.1' /tmp/t560-file"
