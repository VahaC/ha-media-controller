<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room layout</title>
<style>
:root {
  --bg: #0a121d;
  --panel: #111d2d;
  --edge: #253a54;
  --edge-soft: #1a2941;
  --text: #eaf1fb;
  --muted: #8fa9c7;
  --accent: #4dd0e1;
  --accent-dark: #0b2a30;
  --danger: #e2657a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    max-width: 1250px;
    border: 1px solid var(--edge);
    margin: auto;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--edge);
  background: var(--panel); position: sticky; top: 0; z-index: 5;
}
h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .3px; }
.spacer { flex: 1 1 auto; }
button, select {
  font: inherit; color: var(--text); background: #16273c;
  border: 1px solid var(--edge); border-radius: 9px; padding: 8px 13px;
  cursor: pointer; min-height: 40px;
}
button:hover, select:hover { border-color: #375a80; }
button.primary { background: var(--accent-dark); border-color: #2f7f88; color: var(--accent); font-weight: 700; }
button.primary[disabled] { opacity: .45; cursor: default; }
button.danger { color: var(--danger); border-color: #59303c; }
button:disabled { opacity: .45; cursor: default; }
main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
#board {
  flex: 1 1 380px; max-width: 640px; min-width: 300px;
  background: var(--panel); border: 1px solid var(--edge);
  border-radius: 14px; padding: 8px; touch-action: none; position: relative;
}
#cells { display: grid; gap: 2px; position: absolute; inset: 8px; }

.cell { background: #0d1826; border-radius: 3px; }
#cards { position: absolute; inset: 8px; }
.card {
  position: absolute; border-radius: 9px; padding: 6px;
  background: linear-gradient(#213856, #0b1828);
  border: 1px solid #3b5678; color: var(--text);
  font-size: 11px; line-height: 1.2; overflow: hidden; cursor: grab;
  display: flex; flex-direction: column; justify-content: flex-end;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(77,208,225,.35); }
.card.unknown { background: #131a24; border-color: #3a2530; color: #b98b98; }
.card .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .kind { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
.card .swatch { position: absolute; top: 6px; left: 6px; width: 8px; height: 8px; border-radius: 4px; }
.grip {
  position: absolute; right: 0; bottom: 0; width: 22px; height: 22px;
  cursor: nwse-resize; touch-action: none;
}
.grip::after {
  content: ""; position: absolute; right: 4px; bottom: 4px;
  width: 9px; height: 9px; border-right: 2px solid var(--accent);
  border-bottom: 2px solid var(--accent); opacity: .8;
}
aside { flex: 1 1 300px; min-width: 280px; display: flex; flex-direction: column; gap: 14px; }
section { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 14px; }
section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin: 0 0 10px; }
.group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 12px 0 6px; }
.group-title:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: #16273c; border: 1px solid var(--edge); border-radius: 999px;
  padding: 7px 12px; font-size: 13px; cursor: pointer; min-height: 36px;
}
.chip.placed { opacity: .42; }
.chip.armed { border-color: var(--accent); color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; flex-wrap: wrap; }
.row label { flex: 0 0 78px; color: var(--muted); font-size: 13px; }
.row select, .row input { flex: 1 1 120px; min-width: 0; }
input[type=color] { padding: 2px; height: 40px; background: #16273c; border: 1px solid var(--edge); border-radius: 9px; }
/* In the header rather than beside the palette: this is the only feedback the
   page gives for Save, Restore and the skin, and on a phone the sidebar is
   below the whole grid, where a message would never be seen. */
#status { flex: 1 0 100%; font-size: 13px; color: var(--muted); min-height: 20px; }
#status.error { color: var(--danger); }
#status.ok { color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
/* The skin list and, beside it, what each name looks like. The pictures are
   static files this build carries, one per skin: drawing a live preview would
   mean a second implementation of every skin, in JavaScript, kept in step
   with the real one by hand. A skin with no picture is still a usable choice,
   so a tile whose image fails to load keeps its name and drops the image. */
.skins { display: flex; flex-wrap: wrap; gap: 10px; }
.skin-preview {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding: 8px; min-height: 0; font-size: 12px;
  color: var(--muted); text-transform: capitalize;
}
.skin-preview img {
  display: block; width: 88px; height: auto; border-radius: 5px;
  background: #0d1826;
}
.skin-preview.current { border-color: var(--accent); color: var(--accent); }
/* The card artwork, offered the same way the skins are and for the same
   reason: a name says nothing about a picture. The pictures come from the
   catalog the Media Controller integration publishes, through this device —
   the editor never reaches Home Assistant and holds no token. A tile whose
   image does not arrive keeps its name and drops the image, exactly as a
   skin with no picture does. */
.icons {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px;
}
.icon-tile {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 6px 4px; width: 62px; min-height: 0; font-size: 11px;
  color: var(--muted); background: #16273c; border: 1px solid var(--edge);
  border-radius: 9px; overflow: hidden;
}
.icon-tile img {
  display: block; width: 32px; height: 32px; image-rendering: auto;
}
.icon-tile .label {
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.icon-tile.current { border-color: var(--accent); color: var(--accent); }
/* The Automatic tile has no picture to show, so it shows the word instead
   and keeps the same footprint as the ones that do. */
.icon-tile .auto {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; font-size: 17px; color: var(--muted);
}
.card .art {
  position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
  opacity: .85;
}
#status.warn { color: #e8c46a; }
#card-name { min-width: 0; }
/* Adding a card is the one action with no control of its own — it is two
   taps, in two different places — so it says so where the entities are. */
#palette-hint { margin-bottom: 11px; }
@media (max-width: 760px) {
  main { padding: 10px; gap: 10px; }
  header { padding: 10px 12px; }
  #board { max-width: none; }
}
</style>
</head>
<body>
<header>
  <h1>Room layout</h1>
  <div class="spacer"></div>
  <button id="restore" class="danger" title="Replace this layout with the copy saved in Home Assistant">Restore</button>
  <button id="save" class="primary" disabled>Save</button>
  <div id="status">Loading…</div>
</header>

<main>
  <div id="board">
    <div id="cells"></div>
    <div id="cards"></div>
  </div>

  <aside>
    <section>
      <h2>Selected card</h2>
      <div id="editor">
        <p class="hint" id="no-selection">Tap a card to edit it, or pick an entity below and tap a free cell.</p>
        <div id="fields" hidden>
          <div class="row">
            <label for="entity">Entity</label>
            <select id="entity"></select>
          </div>
          <div class="row">
            <label for="card-name">Name</label>
            <input type="text" id="card-name" autocomplete="off"
                   placeholder="From Home Assistant">
            <button id="clear-name"
                    title="Use the name Home Assistant gives this entity"
                    >Auto</button>
          </div>
          <div class="row">
            <label for="icon">Icon</label>
            <select id="icon"></select>
          </div>
          <div class="icons" id="icon-previews"></div>
          <div class="row">
            <label for="color">Colour</label>
            <input type="color" id="color" value="#4dd0e1">
            <button id="clear-color">Default</button>
          </div>
          <div class="row">
            <label>Size</label>
            <span id="size" class="hint"></span>
          </div>
          <div class="row">
            <button id="delete" class="danger">Remove card</button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>Player skin</h2>
      <div class="row">
        <label for="skin">Skin</label>
        <select id="skin" title="Player skin"></select>
      </div>
      <div class="skins" id="skin-previews"></div>
    </section>

    <section>
      <h2>Entities</h2>
      <p class="hint" id="palette-hint">Pick one, then tap a free cell on the
        grid.</p>
      <div id="palette"></div>
    </section>

  </aside>
</main>

<script>
"use strict";

var grid = { v: 1, cols: 10, rows: 14, cards: [] };
var entities = [];
/* The card artwork the Media Controller integration publishes, as
   {id, label} rows. It is the device's answer and never a list written down
   here a second time: adding a picture to the integration must not mean
   changing this page, and it must not mean reflashing anything either.

   An older device answers with an array of plain strings, so both shapes are
   accepted and a string becomes its own label. */
var icons = [];
/* How long a display name may be. The device says, so the limit lives in one
   place; this is only the value used before it has answered. */
var nameLimit = 64;
/* Identifiers whose picture this device could not produce. Selecting one card
   after another re-renders the tiles, so without this a picture that cannot
   be had would take over the status line every time somebody touched a
   card. */
var iconMisses = {};
var selected = -1;
var armed = null;
var dirty = false;
/* The skins this client draws, in the order it offers them, and whether Home
   Assistant named an entity to write one into. Both come from /api/skins, so
   which skins exist is not written down here a second time. */
var skinNames = [];
var skinWritable = false;

var boardEl = document.getElementById("board");
var cellsEl = document.getElementById("cells");
var cardsEl = document.getElementById("cards");
var statusEl = document.getElementById("status");
var saveEl = document.getElementById("save");
var fieldsEl = document.getElementById("fields");
var noSelectionEl = document.getElementById("no-selection");

function say(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || "";
}

function markDirty(value) {
  dirty = value;
  saveEl.disabled = !value;
}

/* Which picture a card draws, in the order the device resolves it: what the
   person chose, kept in Home Assistant against the registry element, and then
   the name a layout document written by an older editor still carries. The
   second is honoured and never written again — choosing anything clears it,
   which is why the icon control marks the layout dirty. */
function iconFor(card, entity) {
  if (entity && entity.icon) { return entity.icon; }
  if (card && card.icon) { return card.icon; }
  return "";
}

/* What one catalog row is called. An older device answers with plain
   strings, and a string is its own label. */
function iconLabel(icon) {
  if (typeof icon === "string") { return icon; }
  return (icon && (icon.label || icon.id)) || "";
}

function iconId(icon) {
  if (typeof icon === "string") { return icon; }
  return (icon && icon.id) || "";
}

/* One picture, asked of this device rather than of Home Assistant: the
   browser holds no token and must never be given one, and the device has
   already fetched these for its own cards. The two panels serve different
   image formats out of what each of them happens to hold, which is why there
   is no extension here — the page asks for the icon, not for a file. */
function iconImage(id, onMissing) {
  var image = document.createElement("img");
  image.alt = "";
  image.decoding = "async";
  /* Asking for a picture is also what puts it on the device's list, so the
     first render of a catalog it has not fetched yet is a miss per row and
     the retries are what fill them in. They are spread out rather than
     hammered: each one costs the device an HTTP request, and on the ESP32
     that blocks its main loop. After the last attempt the image is dropped
     and the name stands on its own, exactly as it does for a skin the device
     carries no picture of. */
  var delays = [1200, 2500, 4000, 6000];
  var attempt = 0;
  image.addEventListener("error", function () {
    if (attempt >= delays.length) {
      image.remove();
      if (onMissing) { onMissing(id); }
      return;
    }
    var wait = delays[attempt];
    attempt += 1;
    setTimeout(function () {
      image.src = "/icons/" + encodeURIComponent(id) + "?try=" + attempt;
    }, wait);
  });
  image.src = "/icons/" + encodeURIComponent(id);
  return image;
}

function entityFor(rid) {
  for (var i = 0; i < entities.length; i++) {
    if (entities[i].rid === rid) { return entities[i]; }
  }
  return null;
}

/* The board keeps the grid's own proportions, so a card is the same shape
   here as it is on the tablet. */
function sizeBoard() {
  var width = boardEl.clientWidth - 16;
  var cell = width / grid.cols;
  boardEl.style.height = (cell * grid.rows + 16) + "px";
  cellsEl.style.gridTemplateColumns = "repeat(" + grid.cols + ", 1fr)";
  cellsEl.style.gridTemplateRows = "repeat(" + grid.rows + ", 1fr)";
  layoutCards();
}

function cellSize() {
  return {
    w: cardsEl.clientWidth / grid.cols,
    h: cardsEl.clientHeight / grid.rows
  };
}

function drawCells() {
  cellsEl.textContent = "";
  var total = grid.cols * grid.rows;
  for (var i = 0; i < total; i++) {
    var cell = document.createElement("div");
    cell.className = "cell";
    cellsEl.appendChild(cell);
  }
}

function overlaps(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w &&
         a.y < b.y + b.h && b.y < a.y + a.h;
}

function fits(card, ignoreIndex) {
  if (card.w < 1 || card.h < 1) { return false; }
  if (card.x < 0 || card.y < 0) { return false; }
  if (card.x + card.w > grid.cols || card.y + card.h > grid.rows) { return false; }
  for (var i = 0; i < grid.cards.length; i++) {
    if (i === ignoreIndex) { continue; }
    if (overlaps(card, grid.cards[i])) { return false; }
  }
  return true;
}

/* Driven by the cards and not by the nodes, and it stops at the first node
   that is missing. Resizing the board and replacing the arrangement both run
   through here, and after a restore the old nodes are still in the document
   while `grid.cards` is already the new, possibly shorter, list. */
function layoutCards() {
  var size = cellSize();
  var nodes = cardsEl.children;
  for (var i = 0; i < grid.cards.length; i++) {
    var card = grid.cards[i];
    var node = nodes[i];
    if (!node) { break; }
    node.style.left = (card.x * size.w) + "px";
    node.style.top = (card.y * size.h) + "px";
    node.style.width = (card.w * size.w - 3) + "px";
    node.style.height = (card.h * size.h - 3) + "px";
  }
}

function renderCards() {
  cardsEl.textContent = "";
  for (var i = 0; i < grid.cards.length; i++) {
    cardsEl.appendChild(cardNode(grid.cards[i], i));
  }
  layoutCards();
  renderPalette();
  renderEditor();
}

function cardNode(card, index) {
  var entity = entityFor(card.rid);
  var node = document.createElement("div");
  node.className = "card" + (index === selected ? " selected" : "") +
                   (entity ? "" : " unknown");
  node.dataset.index = String(index);

  if (card.color) {
    var swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = card.color;
    node.appendChild(swatch);
  }

  var art = iconFor(card, entity);
  if (art) {
    var picture = iconImage(art);
    picture.className = "art";
    node.appendChild(picture);
  }

  var kind = document.createElement("div");
  kind.className = "kind";
  kind.textContent = entity ? entity.domain : "unknown";
  var name = document.createElement("div");
  name.className = "name";
  name.textContent = entity ? entity.name : card.rid;
  node.appendChild(kind);
  node.appendChild(name);

  var grip = document.createElement("div");
  grip.className = "grip";
  node.appendChild(grip);

  node.addEventListener("pointerdown", function (event) {
    startDrag(event, index, event.target === grip);
  });
  return node;
}

/* One handler for both moving and resizing: the difference is only which of
   the card's numbers the pointer changes. */
function startDrag(event, index, resizing) {
  event.preventDefault();
  select(index);

  var origin = grid.cards[index];
  var start = { x: origin.x, y: origin.y, w: origin.w, h: origin.h };
  var size = cellSize();
  var fromX = event.clientX;
  var fromY = event.clientY;
  var node = cardsEl.children[index];
  var moved = false;

  function move(moveEvent) {
    var dx = Math.round((moveEvent.clientX - fromX) / size.w);
    var dy = Math.round((moveEvent.clientY - fromY) / size.h);
    if (dx === 0 && dy === 0 && !moved) { return; }
    moved = true;

    var candidate = { x: start.x, y: start.y, w: start.w, h: start.h,
                      rid: origin.rid };
    if (resizing) {
      candidate.w = Math.max(1, start.w + dx);
      candidate.h = Math.max(1, start.h + dy);
    } else {
      candidate.x = Math.max(0, start.x + dx);
      candidate.y = Math.max(0, start.y + dy);
    }
    if (!fits(candidate, index)) { return; }

    origin.x = candidate.x;
    origin.y = candidate.y;
    origin.w = candidate.w;
    origin.h = candidate.h;
    layoutCards();
    /* Only the geometry: a drag changes nothing else the panel shows, and
       rebuilding the whole of it here would rebuild the icon list — a tile
       and an image request per catalog row — several times a second. */
    renderCardGeometry();
    markDirty(true);
  }

  function up() {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
  }

  node.setPointerCapture && node.setPointerCapture(event.pointerId);
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}

/* A tap on empty board space places the armed entity there. */
boardEl.addEventListener("pointerdown", function (event) {
  if (event.target.closest(".card")) { return; }
  if (!armed) { select(-1); return; }

  var rect = cardsEl.getBoundingClientRect();
  var size = cellSize();
  var x = Math.floor((event.clientX - rect.left) / size.w);
  var y = Math.floor((event.clientY - rect.top) / size.h);
  var card = { x: x, y: y, w: 2, h: 2, rid: armed };

  if (!fits(card, -1)) {
    card.w = 1;
    card.h = 1;
    if (!fits(card, -1)) {
      say("There is no room for a card there.", "error");
      return;
    }
  }
  grid.cards.push(card);
  armed = null;
  selected = grid.cards.length - 1;
  markDirty(true);
  renderCards();
  say("Card added.", "ok");
});

function select(index) {
  selected = index;
  var nodes = cardsEl.children;
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].classList.toggle("selected", i === index);
  }
  renderEditor();
}

/* The one line a drag moves. Split out of renderEditor so that dragging a
   card costs a string rather than a rebuilt panel. */
function renderCardGeometry() {
  var card = selected >= 0 ? grid.cards[selected] : null;
  if (!card) { return; }
  document.getElementById("size").textContent =
    card.w + " x " + card.h + " cells at " + card.x + "," + card.y;
}

function renderEditor() {
  var card = selected >= 0 ? grid.cards[selected] : null;
  fieldsEl.hidden = !card;
  noSelectionEl.hidden = !!card;
  if (!card) { return; }

  var entitySelect = document.getElementById("entity");
  entitySelect.textContent = "";
  var known = entityFor(card.rid);
  if (!known) {
    var missing = document.createElement("option");
    missing.value = card.rid;
    missing.textContent = "Unknown (" + card.rid + ")";
    entitySelect.appendChild(missing);
  }
  for (var i = 0; i < entities.length; i++) {
    var option = document.createElement("option");
    option.value = entities[i].rid;
    option.textContent = entities[i].name + " — " + entities[i].domain;
    entitySelect.appendChild(option);
  }
  entitySelect.value = card.rid;

  /* The name on the tile. It shows what the card says now, which is the
     label the person typed or, when they typed none, the name Home Assistant
     gives the entity — and clearing the field is how you go back to the
     second. There is no third value to show: the payload carries the name in
     force and not both of them, because sixty-four elements times two names
     is a payload this device reads out of a fixed buffer. */
  var nameInput = document.getElementById("card-name");
  nameInput.value = known ? known.name : "";
  nameInput.maxLength = nameLimit;
  nameInput.disabled = !known;
  document.getElementById("clear-name").disabled = !known;

  var chosen = iconFor(card, known);
  var iconSelect = document.getElementById("icon");
  iconSelect.textContent = "";
  var auto = document.createElement("option");
  auto.value = "";
  auto.textContent = "Automatic";
  iconSelect.appendChild(auto);
  var offered = {};
  for (var j = 0; j < icons.length; j++) {
    var id = iconId(icons[j]);
    if (!id) { continue; }
    offered[id] = true;
    var iconOption = document.createElement("option");
    iconOption.value = id;
    iconOption.textContent = iconLabel(icons[j]);
    iconSelect.appendChild(iconOption);
  }
  /* A picture this card names that the catalog no longer publishes. It is
     still what the card is drawing, so it is still what the list has to show:
     silently reading as Automatic would tell somebody their icon was gone the
     moment they touched anything else on the card. */
  if (chosen && !offered[chosen]) {
    var stale = document.createElement("option");
    stale.value = chosen;
    stale.textContent = chosen + " (not in the catalog)";
    iconSelect.appendChild(stale);
  }
  iconSelect.value = chosen;
  iconSelect.disabled = !known;
  renderIconTiles(chosen, !known);

  document.getElementById("color").value = card.color || "#4dd0e1";
  renderCardGeometry();
}

function renderPalette() {
  var palette = document.getElementById("palette");
  var hint = document.getElementById("palette-hint");
  palette.textContent = "";

  var placed = {};
  for (var i = 0; i < grid.cards.length; i++) { placed[grid.cards[i].rid] = true; }

  var groups = [];
  var byDomain = {};
  for (var j = 0; j < entities.length; j++) {
    var domain = entities[j].domain || "other";
    if (!byDomain[domain]) { byDomain[domain] = []; groups.push(domain); }
    byDomain[domain].push(entities[j]);
  }
  if (!groups.length) {
    /* Nothing to pick, so telling somebody to pick one would be noise. */
    hint.hidden = true;
    var empty = document.createElement("p");
    empty.className = "hint";
    empty.textContent = "This panel has no room controls yet. Add them to " +
                        "the panel in Home Assistant.";
    palette.appendChild(empty);
    return;
  }
  hint.hidden = false;

  for (var g = 0; g < groups.length; g++) {
    var title = document.createElement("div");
    title.className = "group-title";
    title.textContent = groups[g];
    palette.appendChild(title);

    var chips = document.createElement("div");
    chips.className = "chips";
    byDomain[groups[g]].forEach(function (entity) {
      var chip = document.createElement("button");
      chip.className = "chip" + (placed[entity.rid] ? " placed" : "") +
                       (armed === entity.rid ? " armed" : "");
      chip.textContent = entity.name;
      chip.title = entity.entity;
      chip.addEventListener("click", function () {
        armed = armed === entity.rid ? null : entity.rid;
        renderPalette();
        say(armed ? "Now tap a free cell to place it." : "");
      });
      chips.appendChild(chip);
    });
    palette.appendChild(chips);
  }
}

document.getElementById("entity").addEventListener("change", function () {
  if (selected < 0) { return; }
  grid.cards[selected].rid = this.value;
  markDirty(true);
  renderCards();
});

/* The tiles beside the list, and the same rule the skin tiles follow: a tap
   writes the select's value and fires its change event, so choosing an icon
   stays in one handler however it was chosen. */
function renderIconTiles(current, disabled) {
  var box = document.getElementById("icon-previews");
  box.textContent = "";

  var rows = [{ id: "", label: "Automatic" }];
  for (var i = 0; i < icons.length; i++) {
    var id = iconId(icons[i]);
    if (id) { rows.push({ id: id, label: iconLabel(icons[i]) }); }
  }

  rows.forEach(function (row) {
    var tile = document.createElement("button");
    tile.className = "icon-tile" + (row.id === current ? " current" : "");
    tile.dataset.icon = row.id;
    tile.title = row.label;
    tile.disabled = !!disabled;

    if (row.id) {
      /* Only the picture this card is actually drawing is worth a message.
         A catalog row nobody chose that did not arrive is a gap in a list,
         and saying so once per row would bury the status line. */
      tile.appendChild(
        iconImage(row.id, row.id === current ? reportIconMiss : null));
    } else {
      var mark = document.createElement("span");
      mark.className = "auto";
      mark.textContent = "\u2013";
      tile.appendChild(mark);
    }

    var label = document.createElement("span");
    label.className = "label";
    label.textContent = row.label;
    tile.appendChild(label);

    tile.addEventListener("click", function () {
      var select = document.getElementById("icon");
      if (select.disabled || select.value === row.id) { return; }
      select.value = row.id;
      select.dispatchEvent(new Event("change"));
    });
    box.appendChild(tile);
  });
}

/* A picture this device could not produce. It is not an error in the layout
   and never stops anything: the card falls back to the artwork built into the
   device, and this only explains the gap where one is visible. */
function reportIconMiss(id) {
  if (iconMisses[id]) { return; }
  iconMisses[id] = true;
  say("This device could not load the " + id + " icon, so its cards draw " +
      "the built-in artwork instead.", "warn");
}

/* Everything that changes how one card is labelled goes through here.
   The name and the icon both belong to the registry element, which is Home
   Assistant's, so this device is asked to pass the change on and the new
   value comes back the ordinary way, in the next poll. Nothing about the
   grid is written by this: moving a card is a layout change and saved with
   Save, and naming one is not. */
function writeCard(rid, changes, described) {
  var body = { rid: rid };
  if (changes.hasOwnProperty("name")) { body.name = changes.name; }
  if (changes.hasOwnProperty("icon")) { body.icon = changes.icon; }

  say("Asking Home Assistant to " + described + "\u2026");
  return fetch("/api/card", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (response) {
    return response.json().then(function (answer) {
      if (!response.ok) {
        /* The device refused it, which means the value itself is wrong: too
           long a name, a control character in it, an icon nothing publishes,
           or a card this device does not draw. Saying so here is the whole
           point of the device checking as well as Home Assistant. */
        throw new Error(answer.error || "The change was refused.");
      }
      return answer;
    });
  }).then(function (answer) {
    if (answer.synced === false) {
      /* Nothing was stored anywhere: the name and the icon live in Home
         Assistant, and this device has not paired with one. */
      throw new Error("This device is not paired with Home Assistant, so " +
                      "the change was not saved.");
    }
    return awaitCard(12);
  });
}

/* Asks the device how the change it was given ended.

   It cannot be answered inside the request that started it: the write reaches
   Home Assistant over HTTP, which blocks the device's main loop, so the
   device takes the request and reports the outcome on /api/entities, which is
   the route that says what this device's situation is. A device that answers
   synchronously simply reports "ok" on the first ask. */
function awaitCard(attempts) {
  if (attempts <= 0) {
    return { settled: false, message: "" };
  }
  return new Promise(function (resolve) { setTimeout(resolve, 500); })
    .then(function () { return fetch("/api/entities"); })
    .then(function (response) { return response.json(); })
    .then(function (body) {
      var card = body.card || {};
      if (card.state === "pending") { return awaitCard(attempts - 1); }
      if (card.state === "failed") {
        throw new Error(card.message || "Home Assistant refused the change.");
      }
      /* Deliberately **not** re-read from this answer. Home Assistant has
         accepted the change, but the device's own copy of the registry does
         not move until its next config poll — up to a second later — so what
         is in this body is still the previous name. Taking it would put the
         old value straight back into the field somebody just changed. The
         page keeps what it asked for, which is what was stored; a reload
         reads the device's own payload the ordinary way, and a refusal is
         put right by loadEntities in the catch below. */
      return { settled: true, message: card.message || "" };
    });
}

document.getElementById("icon").addEventListener("change", function () {
  if (selected < 0) { return; }
  var card = grid.cards[selected];
  var rid = card.rid;
  var chosen = this.value;
  /* A layout document written by an older editor names the picture itself,
     and that name would go on shadowing the choice made here. Clearing it is
     a change to the layout and therefore something to Save, which is why the
     message below says so when it happened and stays quiet when it did
     not. */
  var hadOwn = !!card.icon;
  if (hadOwn) { delete card.icon; markDirty(true); }

  var known = entityFor(rid);
  if (known) { known.icon = chosen; }
  renderCards();

  writeCard(rid, { icon: chosen }, chosen ? "use the " + chosen + " icon"
                                          : "choose the icon automatically")
    .then(function (outcome) {
      renderCards();
      if (!outcome.settled) {
        say("Home Assistant has not confirmed the icon yet.", "warn");
      } else if (hadOwn) {
        say("Icon saved in Home Assistant. This card also named one of its " +
            "own; press Save to drop it.", "warn");
      } else {
        say("Icon saved in Home Assistant.", "ok");
      }
    })
    .catch(function (error) {
      say(String(error.message || error), "error");
      /* Put back what the device actually has, so the control never shows a
         choice that was refused. */
      loadEntities().then(renderCards);
    });
});

/* Both ways of setting a name end here, so the rule about what an empty one
   means is written once. */
function applyName(value) {
  if (selected < 0) { return; }
  var rid = grid.cards[selected].rid;
  var known = entityFor(rid);
  if (!known) { return; }

  var name = String(value == null ? "" : value).trim();
  if (name.length > nameLimit) {
    say("A name may be at most " + nameLimit + " characters.", "error");
    return;
  }
  var was = known.name;
  if (name === was) { return; }

  /* The tile shows the new name at once. It is put back from the device's
     own answer either way, so an optimistic preview cannot survive a
     refusal. */
  known.name = name;
  renderCards();

  writeCard(rid, { name: name }, name ? "call this card " + name
                                      : "use the Home Assistant entity name")
    .then(function (outcome) {
      renderCards();
      var applied = entityFor(rid);
      document.getElementById("card-name").value = applied ? applied.name : "";
      if (!outcome.settled) {
        say("Home Assistant has not confirmed the name yet.", "warn");
      } else if (name) {
        say("Name saved in Home Assistant.", "ok");
      } else {
        /* Cleared, so the tile is back to whatever Home Assistant calls the
           entity — and it follows that name from now on, including through a
           rename. */
        say("The Home Assistant entity name is back.", "ok");
      }
    })
    .catch(function (error) {
      known.name = was;
      say(String(error.message || error), "error");
      loadEntities().then(renderCards);
    });
}

document.getElementById("card-name").addEventListener("change", function () {
  applyName(this.value);
});

document.getElementById("card-name").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); this.blur(); }
});

document.getElementById("clear-name").addEventListener("click", function () {
  document.getElementById("card-name").value = "";
  applyName("");
});

document.getElementById("color").addEventListener("change", function () {
  if (selected < 0) { return; }
  grid.cards[selected].color = this.value;
  markDirty(true);
  renderCards();
});

document.getElementById("clear-color").addEventListener("click", function () {
  if (selected < 0) { return; }
  delete grid.cards[selected].color;
  markDirty(true);
  renderCards();
});

document.getElementById("delete").addEventListener("click", function () {
  if (selected < 0) { return; }
  grid.cards.splice(selected, 1);
  selected = -1;
  markDirty(true);
  renderCards();
});

document.getElementById("save").addEventListener("click", function () {
  say("Saving…");
  fetch("/api/layout", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(grid)
  }).then(function (response) {
    return response.json().then(function (body) {
      if (!response.ok) { throw new Error(body.error || "Save failed"); }
      return body;
    });
  }).then(function (body) {
    markDirty(false);
    say(body.backup === true
        ? "Saved, and a copy is in Home Assistant."
        : "Saved on the panel. The copy in Home Assistant could not be " +
          "written; it will be retried on the next save.",
        body.backup === true ? "ok" : "error");
  }).catch(function (error) {
    say(String(error.message || error), "error");
  });
});

document.getElementById("restore").addEventListener("click", function () {
  if (!window.confirm("Replace this layout with the copy saved in Home " +
                      "Assistant?")) { return; }
  say("Restoring…");
  fetch("/api/layout", { method: "DELETE" })
    .then(function (response) {
      return response.json().then(function (body) {
        if (!response.ok) { throw new Error(body.error || "Restore failed"); }
        return body;
      });
    })
    .then(function () { return loadLayout(); })
    .then(function () {
      markDirty(false);
      say("Restored from Home Assistant.", "ok");
    })
    .catch(function (error) { say(String(error.message || error), "error"); });
});

/* The tiles beside the list. They are another way to choose a skin and never
   a second implementation of choosing one: a tap writes the select's value
   and fires its change event, so the whole request stays in one handler. */
function renderSkinPreviews(current) {
  var box = document.getElementById("skin-previews");
  box.textContent = "";
  skinNames.forEach(function (name) {
    var tile = document.createElement("button");
    tile.className = "skin-preview";
    tile.dataset.skin = name;
    tile.title = name;

    var image = document.createElement("img");
    image.src = "/skins/" + encodeURIComponent(name) + ".png";
    image.alt = "";
    /* A skin this build draws but carries no picture for. The name alone is
       still a usable choice; a broken image would not be. */
    image.addEventListener("error", function () { image.remove(); });
    tile.appendChild(image);

    var label = document.createElement("span");
    label.textContent = name.replace(/_/g, " ");
    tile.appendChild(label);

    tile.addEventListener("click", function () {
      var select = document.getElementById("skin");
      if (select.disabled || select.value === name) { return; }
      select.value = name;
      select.dispatchEvent(new Event("change"));
    });
    box.appendChild(tile);
  });
  markCurrentSkin(current);
  setSkinBusy(false);
}

function markCurrentSkin(name) {
  var tiles = document.getElementById("skin-previews").children;
  for (var i = 0; i < tiles.length; i++) {
    var isCurrent = tiles[i].dataset.skin === name;
    tiles[i].classList.toggle("current", isCurrent);
    tiles[i].setAttribute("aria-pressed", isCurrent ? "true" : "false");
  }
}

/* One place decides whether a skin can be chosen at all, so the list and the
   tiles can never disagree: both are disabled while a request is in flight,
   and for good where Home Assistant named no entity to write. */
function setSkinBusy(busy) {
  var disabled = busy || !skinWritable;
  var tiles = document.getElementById("skin-previews").children;
  document.getElementById("skin").disabled = disabled;
  for (var i = 0; i < tiles.length; i++) { tiles[i].disabled = disabled; }
}

/* Asks the panel what skin it is drawing until it answers with the one that
   was requested. The request only reaches Home Assistant, which owns the
   value; the panel adopts it on its next poll. Reporting "sent" would tell
   the reader nothing about whether it worked, and the picture beside the
   list is a drawing of a layout rather than evidence the panel adopted it,
   so this is the only honest confirmation there is. */
function confirmSkin(name, attempts) {
  if (attempts <= 0) { return Promise.resolve(false); }
  return new Promise(function (resolve) { setTimeout(resolve, 600); })
    .then(function () { return fetch("/api/skins"); })
    .then(function (response) { return response.json(); })
    .then(function (body) {
      if (body.current === name) { return true; }
      return confirmSkin(name, attempts - 1);
    });
}

document.getElementById("skin").addEventListener("change", function () {
  var name = this.value;
  say("Asking Home Assistant for the " + name + " skin…");
  setSkinBusy(true);
  fetch("/api/skin", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ skin: name })
  }).then(function (response) {
    return response.json().then(function (body) {
      if (!response.ok) { throw new Error(body.error || "Could not set skin"); }
      return body;
    });
  }).then(function () {
    say("Asked. Waiting for the panel to pick it up…");
    return confirmSkin(name, 10);
  }).then(function (applied) {
    setSkinBusy(false);
    if (applied) {
      markCurrentSkin(name);
      say("The panel is drawing the " + name + " skin.", "ok");
    } else {
      /* Home Assistant took it, so this is not a failure: the tablet is
         asleep, offline, or simply slow to poll. */
      say("Home Assistant accepted " + name + ", but the panel has not " +
          "picked it up yet.");
    }
  }).catch(function (error) {
    setSkinBusy(false);
    say(String(error.message || error), "error");
  });
});

function loadLayout() {
  return fetch("/api/layout").then(function (r) { return r.json(); })
    .then(function (body) {
      grid = {
        v: 1,
        cols: body.cols || 10,
        rows: body.rows || 14,
        cards: body.cards || []
      };
      selected = -1;
      drawCells();
      sizeBoard();
      renderCards();
    });
}

function loadEntities() {
  return fetch("/api/entities").then(function (r) { return r.json(); })
    .then(function (body) {
      entities = body.entities || [];
      icons = body.icons || [];
      /* What the device will accept, so the field and the device cannot
         disagree about it. An older device says nothing and the built-in
         value stands. */
      var limits = body.limits || {};
      if (limits.name > 0) { nameLimit = limits.name; }
    });
}

function loadSkins() {
  return fetch("/api/skins").then(function (r) { return r.json(); })
    .then(function (body) {
      var select = document.getElementById("skin");
      skinNames = body.skins || [];
      skinWritable = body.writable === true;
      select.textContent = "";
      skinNames.forEach(function (name) {
        var option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      if (body.current) { select.value = body.current; }
      select.title = skinWritable
        ? "Player skin"
        : "Home Assistant has not told this panel which entity holds the skin";
      renderSkinPreviews(body.current);
    });
}

window.addEventListener("resize", sizeBoard);
window.addEventListener("beforeunload", function (event) {
  if (dirty) { event.preventDefault(); event.returnValue = ""; }
});

loadEntities()
  .then(loadLayout)
  .then(loadSkins)
  .then(function () { say("Ready."); })
  .catch(function (error) {
    say("Could not load the panel: " + (error.message || error), "error");
  });
</script>
</body>
</html>
